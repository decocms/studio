name: Release Web

# Builds the nginx web image (SPA bundle + reverse-proxy) independently from the
# mesh API image so the UI can roll out without restarting the API. Triggered by
# the version bump (same signal as release-mesh) or any change to the nginx
# Dockerfile/config. Tagged with the apps/mesh version; the GitOps repo bumps the
# `<fullname>-web` Deployment's tag on its own cadence.
on:
  push:
    branches: [main]
    paths:
      - "apps/mesh/package.json"
      - "deploy/nginx/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/web

jobs:
  build-push:
    name: Build & Push web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./apps/mesh/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      # amd64 only — the studio pods (and thus web pods, which reuse nodeSelector)
      # run on amd64 nodes. Add linux/arm64 here if that changes.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/nginx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          platforms: linux/amd64
