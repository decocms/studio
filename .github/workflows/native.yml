name: Native

# Phase 5 of the desktop migration contract (see the desktop migration contract §5.1).
# Gates the Rust/Tauri desktop app (apps/native/) — a separate cargo
# workspace, independent of the Bun workspaces the other workflows cover.
#
# Uses the `changes`-job PR-diff pattern (like test.yml/e2e.yml/
# sandbox-daemon.yml) so its jobs always REPORT on PRs — pass or skipped —
# which is what lets them be required branch-protection checks. A required
# check whose workflow never runs (workflow-level `paths:` filtering) blocks
# the merge forever; a job skipped via `if:`, by contrast, reports as passed.
# The `pull_request` trigger is therefore unfiltered and the `changes` job
# skips the expensive macOS jobs when the PR touches nothing they consume.
# That gate is PER JOB, not one workflow-wide "relevant" bit: a PR that
# changes only the pinned parity fail-set has no reason to run cargo
# clippy, and a web-only PR has no reason to build local-api twice.
# Pushes to main keep the `paths:` filter — required checks gate PRs, not
# pushes, so a never-run workflow is harmless there.
on:
  push:
    branches:
      - main
    paths:
      - "apps/native/**"
      - "apps/web/**"
      - "packages/sandbox/daemon-e2e/**"
      - "packages/shared/**"
      - ".github/workflows/native.yml"
  pull_request:
    branches:
      - main
  # stub-seam-nightly keeps the DAEMON_E2E_CMD swap seam
  # (packages/sandbox/daemon-e2e/stub-daemon.mjs) from rotting even on weeks with no apps/native PRs —
  # see the desktop migration contract §5.1's "nightly job running the daemon-e2e stub-seam
  # check". `schedule` + `workflow_dispatch` fire regardless of `paths:`
  # (path filters only apply to push/pull_request), which is intentional
  # here — every job below is gated by `if:` on `github.event_name` instead
  # (see each job).
  schedule:
    - cron: "17 3 * * *" # nightly, arbitrary off-hour offset to dodge the top-of-hour stampede
  workflow_dispatch: {}

# Cancel superseded runs on PR branches, but QUEUE on main: with
# cancel-in-progress everywhere, every main push killed the previous
# commit's in-flight jobs (tauri-build runs 10-20 min; merges land minutes
# apart), so nearly every main commit ended with cancelled — rendered as a
# red X — checks, and only the last commit of a burst ever completed
# post-merge verification. GitHub holds at most one queued run per group,
# so bursts still collapse to "in-progress finishes, newest waits".
#
# Relatedly, every job below also skips `[release]:` bump pushes (via the
# `changes` gate): the bot's bump touches only package.json versions, seconds
# after the merge commit that was already verified — building it doubled
# main's native runs for zero extra signal. release-native.yaml, not this
# workflow, owns the shipping build of the bumped version.
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: "1.3.14"

jobs:
  # Gate: skip each macOS job when a PR touches none of ITS inputs.
  # Required checks can't be skipped via workflow-level `paths` filters — a
  # never-scheduled required check blocks the merge forever. A job skipped
  # via `if`, by contrast, reports as passed (same pattern as test.yml).
  #
  # Four outputs, one per downstream job, because the four jobs consume
  # different things:
  #   rust     — the cargo workspace itself (+ build inputs). Every job below
  #              compiles Rust, so this one implies all of them.
  #   suite    — the curated daemon e2e suite and its pinned fail-set, the
  #              only extra inputs to the parity oracle. The suite is fully
  #              black-box (it imports no workspace package), so nothing else
  #              in packages/ can move it.
  #   contract — apps/native's own e2e suite.
  #   frontend — the web bundle baked into the .app.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      suite: ${{ steps.filter.outputs.suite }}
      contract: ${{ steps.filter.outputs.contract }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Detect relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          all() { for k in rust suite contract frontend; do echo "$k=$1" >> "$GITHUB_OUTPUT"; done; }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Pushes to main, schedule, and dispatch run everything — except
            # the [release]: version-bump push, which only touches version
            # strings (release-native.yaml owns the shipping build).
            case "$HEAD_MSG" in
              '[release]:'*) all false ;;
              *) all true ;;
            esac
            exit 0
          fi
          set +e
          if ! FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename'); then
            echo "Could not list PR files — running to be safe."
            all true
            exit 0
          fi
          echo "Changed files:"; echo "$FILES"
          rust=false suite=false contract=false frontend=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # First match wins, so order these most-specific-first. Editing
            # THIS workflow matches nothing on purpose: most edits here are
            # comments or gate wiring, and burning 4 macOS jobs (one of them a
            # 45-minute bundle) to prove a YAML comment is why this gate got
            # split in the first place. The `push:` trigger above includes this
            # file and runs the full set on main, so a workflow change is
            # verified the moment it merges.
            case "$f" in
              # fetch-appimage-tools.sh is in the `rust` bucket because
              # `tauri-build`'s ubuntu leg is the ONLY thing that validates
              # those pins — a bump must run the job that would go red on a
              # bad one, not just the bun-side jobs.
              apps/native/crates/*|apps/native/src-tauri/*|apps/native/Cargo.toml|apps/native/Cargo.lock|apps/native/rustfmt.toml|apps/native/scripts/fetch-rclone.sh|apps/native/scripts/fetch-appimage-tools.sh)
                rust=true ;;
              packages/sandbox/daemon-e2e/*|apps/native/scripts/ci/*) suite=true ;;
              apps/native/e2e/*) contract=true ;;
              apps/web/*|packages/shared/*) frontend=true ;;
              # Everything else under apps/native — package.json, tsconfig,
              # the other scripts — can move any of the three bun-side jobs.
              # apps/native/{docs,README.md} intentionally match nothing.
              apps/native/docs/*|apps/native/README.md) ;;
              apps/native/*) suite=true contract=true frontend=true ;;
            esac
          done <<< "$FILES"
          for k in rust suite contract frontend; do
            eval "echo \"$k=\$$k\"" >> "$GITHUB_OUTPUT"
          done

  # ---------------------------------------------------------------------
  # 1. rust-checks — fmt / clippy / cargo test across the whole cargo
  #    workspace (crates/local-api, crates/harness, crates/upstream,
  #    src-tauri), on BOTH shipping targets. The macos leg gates the v1
  #    desktop target; the ubuntu leg gates the Linux port — src-tauri's
  #    window/webview stack is
  #    GTK + WebKitGTK there rather than the macOS system frameworks, so
  #    that leg carries an apt surface the macOS leg gets for free:
  #    libwebkit2gtk-4.1-dev (webview + webkit2gtk-sys pkg-config),
  #    libxdo-dev, libayatana-appindicator3-dev, librsvg2-dev, patchelf,
  #    libssl-dev, xdg-utils, plus the usual build-essential/curl/wget/file.
  #    ubuntu-22.04 is PINNED, not ubuntu-latest: the AppImage this port
  #    ships inherits the build host's glibc floor, so raising the runner
  #    raises the floor for every Linux user — a deliberate decision, never
  #    a drive-by bump.
  # ---------------------------------------------------------------------
  rust-checks-os:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      github.event_name != 'schedule'
    strategy:
      # Both legs always report: a red Linux leg must not hide the macOS
      # result (or vice versa) on a PR where both are required checks.
      fail-fast: false
      matrix:
        # macOS does the lot in ~3 min. Linux gets one runner per half: five
        # attempts at running both on one runner died in `cargo test` at an
        # invariant ~49-50 min with the step incomplete, NO logs uploaded, and
        # conclusion `failure` rather than the `cancelled` a timeout gives —
        # i.e. the runner was killed. Capping debug info, freeing 20 GiB and
        # capping link parallelism each changed nothing, and that invariance is
        # the tell: the surviving variable is that one runner carried clippy's
        # dev-profile build of the whole GTK/WebKit tree AND the test profile's.
        # Two runners halve the peak, and each saves its own cache — which also
        # breaks the spiral where a job that never finishes never warms one.
        include:
          - os: macos-latest
            task: all
          - os: ubuntu-22.04
            task: lint
          - os: ubuntu-22.04
            task: test
    runs-on: ${{ matrix.os }}
    # The ubuntu leg builds the GTK/WebKit stack (webkit2gtk-sys, gtk-sys,
    # glib, soup) from source, once for clippy's dev profile and again for
    # test's — where macOS links system frameworks and finishes in ~3 min.
    # A cold cache ran 25-35 min and was killed mid-`cargo test` at 30.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      # This job is the only one that builds the workspace TWICE — clippy's dev
      # profile, then test's — and on Linux each of those also carries the
      # GTK/WebKit dependency tree that macOS gets from system frameworks. With
      # full debug info that target dir measured 13.5 GiB locally, against a
      # runner that has ~14 GiB free: the job died at 49 min mid-`cargo test`
      # with no retained logs, which is what disk exhaustion looks like here.
      # Debug info is the bulk of it and nothing in this job reads a backtrace,
      # so drop it rather than buy a bigger runner. macOS is left alone: it
      # finishes in three minutes and its artifacts are a fraction of the size.
      - name: Make room for the Linux target dir
        if: runner.os == 'Linux'
        run: |
          # Two compounding problems, both invisible in the logs because the
          # runner dies before they upload. (1) This is the only job that
          # builds the workspace twice — clippy's dev profile, then test's —
          # and on Linux each carries the GTK/WebKit tree macOS gets from
          # system frameworks; with full debug info that target dir measured
          # 13.5 GiB against ~14 GiB free. (2) rust-cache saves in a post
          # step, so a job that never finishes never warms the cache, and
          # every run starts cold — which is why the failure reproduced at a
          # near-identical 49 min rather than varying with load.
          #
          # Dropping debug info removes the bulk of the artifacts (nothing
          # here reads a backtrace) and evicting the preinstalled SDKs this
          # repo never uses frees ~20 GiB more. macOS is untouched: it
          # finishes in three minutes.
          {
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          echo "after:"; df -h / | tail -1

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native

      - name: cargo fmt --check
        if: matrix.task != 'test'
        working-directory: apps/native
        run: cargo fmt --all -- --check

      - name: Placeholder frontendDist for generate_context!
        # `tauri::generate_context!` (compiled by clippy + test below) panics if
        # the configured `frontendDist` (../../web/dist/native) is absent. This
        # job intentionally does NOT build the frontend, so drop a minimal
        # placeholder — the real bundle is produced in the `tauri-build` job.
        run: |
          mkdir -p apps/web/dist/native
          printf '<!doctype html><html><body></body></html>' > apps/web/dist/native/index.html

      # `tauri-build` resolves `externalBin` in `src-tauri/build.rs`, so ANY
      # cargo command touching the workspace needs the sidecar on disk — not
      # just `tauri build`. It is git-ignored and fetched at build time, so
      # without this every cargo job fails with "resource path
      # binaries/rclone-<triple> doesn't exist".
      - name: Cache bundled rclone
        uses: actions/cache@v4
        with:
          path: apps/native/src-tauri/binaries
          key: rclone-${{ runner.os }}-${{ hashFiles('apps/native/scripts/fetch-rclone.sh') }}

      - name: Fetch bundled rclone
        working-directory: apps/native
        run: ./scripts/fetch-rclone.sh

      - name: cargo clippy -D warnings
        if: matrix.task != 'test'
        working-directory: apps/native
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        if: runner.os != 'Linux' && matrix.task != 'lint'
        working-directory: apps/native
        run: cargo test --workspace

      # Same tests, one crate at a time, and with the build parallelism capped.
      # Three runs died here at a near-identical ~50 min with the step
      # incomplete and NO logs uploaded at all — and the job conclusion was
      # `failure`, not the `cancelled` a timeout produces, so the runner itself
      # was being killed rather than the job timed out. Dropping debug info and
      # freeing 20 GiB of preinstalled SDKs changed nothing, which rules out
      # disk and leaves memory: `cargo test` links a test binary per target,
      # and linking these crates four-up (local-api alone carries ~850 tests
      # plus the GTK/WebKit tree) is what exhausts a 16 GiB runner.
      #
      # Per crate so a future failure names the crate instead of the step, and
      # so each link peak stands alone.
      # Linux runs single-threaded and per crate. Two tests here write or kill
      # things the platform treats differently from BSD: `upstream` writes a
      # helper script and execs it (a concurrent fork inherits the write
      # descriptor and the exec fails ETXTBSY), and `local-api`'s process-group
      # suite manipulates process groups, so it runs under `setsid`.
      #
      # Be exact about what `setsid` buys, because the earlier claim here
      # ("keeps a stray group signal inside its own session rather than the
      # runner's") overstated it. `setsid --wait` does NOT fork when its caller
      # is not already a process-group leader — it `setsid()`s in place and
      # execs — so cargo itself becomes the chunk's session and group leader.
      # That bounds a stray group signal to one chunk instead of this step's
      # shell, and nothing more: pgids are global, so it cannot protect a chunk
      # from a test that signals its OWN group. Three tests did exactly that;
      # the fix is at the source, in `process_util::group_signal_argv`.
      - name: cargo test (Linux)
        if: runner.os == 'Linux' && matrix.task != 'lint'
        working-directory: apps/native
        timeout-minutes: 25
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo test -p harness -- --test-threads=1
          # terminal-session drives real PTYs and signals foreground process
          # groups, so it is exactly the crate a BSD-vs-Linux divergence hides
          # in — and no other leg ran it on Linux, which is why a Ctrl-C that
          # never reached the foreground job shipped unnoticed. 11 tests, ~3 s:
          # small enough to need neither chunking nor `setsid`.
          cargo test -p terminal-session -- --test-threads=1
          cargo test -p upstream -- --test-threads=1
          # local-api's ~850 tests are chunked into separate processes. Note
          # the original justification for this — "the kill point moved
          # steadily later as suspects were excluded, so it is accumulation,
          # not one bad test" — did NOT hold up. There were three self-killing
          # tests, and excluding them one at a time produces precisely that
          # moving kill point. All three are fixed and re-enabled; run as ONE
          # process the crate finishes 817 tests in 49 s at ~250 MB and 14
          # processes, so there is no resource wall here to chunk around —
          # note that measures execution, not the link peak the step's own
          # comments blame. Chunking stays because it is nearly free
          # and makes a failure name its chunk, not because the suite cannot
          # survive a single process. `setsid` bounds a stray group signal to
          # one chunk (see the note above the step).
          for chunk in routes:: sandbox:: setup::; do
            setsid --wait cargo test -p local-api "$chunk" -- --test-threads=1
          done
          setsid --wait cargo test -p local-api -- --test-threads=1 \
            --skip routes:: --skip sandbox:: --skip setup::
          cargo test -p deco -- --test-threads=1

  # ---------------------------------------------------------------------
  # 2. daemon-e2e-vs-rust — the parity oracle: build the release local-api
  #    binary, point packages/sandbox's curated 4-file daemon e2e suite at
  #    it via DAEMON_E2E_CMD, and assert the EXACT pinned failing-test set
  #    in scripts/ci/daemon-parity-allowlist.json — not just the counts.
  #    A NEW failure (regression) or a VANISHED one (allowlist gone stale)
  #    both fail this job via apps/native/scripts/ci/check-junit-allowlist.mjs.
  #
  #    What the 27 pinned names are, and which are choices vs. gaps:
  #      - auth/CORS tightening (6) — local-api is stricter on purpose.
  #      - no-publish-on-close shutdown (2) — worktrees are durable on a
  #        user's machine, unlike a pod's; see local-api's routes/git.rs.
  #      - UNIMPLEMENTED in local-api, not a design decision (19). The
  #        sandbox daemons grew these; the Rust crate has not been ported:
  #          * url-transfer SSRF gate (11) — write_from_url / upload_to_url
  #            in local-api have NO allowlist and follow redirects. That is
  #            a real hole in the desktop app, pinned here only so this gate
  #            stays a *set* match; it is not sanctioned. Port
  #            packages/sandbox/daemon-go/internal/urlallow and delete
  #            these 11 lines.
  #          * decofile block validation (4) — an invalid block written by
  #            the agent reaches the user's branch and breaks site render.
  #          * protected-branch publish guard (1) — local-api will push to
  #            main.
  #          * diverged-origin reconcile / fast-forward (2), fs watcher
  #            file-changed (1) — missing features, benign.
  #    Shrinking this file is the goal; growing it needs a reason on the line.
  #
  #    `daemon.dispatch.e2e.test.ts` is DELIBERATELY excluded after the native
  #    terminal cutover. Cloud sandboxes still own `/_sandbox/dispatch` and
  #    `/_sandbox/runs`; local-api now launches Claude Code, Codex, and OpenCode
  #    only through the scoped terminal routes covered by apps/native/e2e.
  #
  #    `daemon.proxy.e2e.test.ts` + `daemon.ws-proxy.e2e.test.ts` (12 tests,
  #    formerly "all pass") are DELIBERATELY excluded from this curated set
  #    as of the port-router split (`local_api::ServerHandle`'s dedicated
  #    PREVIEW listener) — this harness (`daemon.e2e.helpers.ts`, owned by
  #    `packages/sandbox`, out of bounds to edit here) hard-codes a SINGLE
  #    port for the whole daemon and has no way to discover/target a SECOND
  #    one, so it structurally cannot drive local-api's now-separate preview
  #    listener. See `the native parity contract`'s "Reverse proxy +
  #    WS proxy" exclusion section for the full rationale and this crate's
  #    own substitute oracle coverage (`apps/native/e2e/git-sandbox.e2e.test.ts`,
  #    `real-ui-passthrough.e2e.test.ts`).
  #
  #    Stays macOS-only while its neighbours grew an ubuntu leg: the gate is
  #    an EXACT pinned fail-set, and the daemon's own suite diverges per OS,
  #    so a Linux leg needs a second allowlist to be meaningful rather than
  #    a copy of this one. Deferred with the rest of the Linux port.
  # ---------------------------------------------------------------------
  daemon-e2e-vs-rust:
    needs: changes
    if: >-
      (needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.suite == 'true') &&
      github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      # The fs `grep` route (in the curated suite's daemon.e2e.test.ts)
      # shells out to ripgrep; install it so the test asserts results
      # strictly instead of tolerating "grep unavailable" — same reasoning
      # as sandbox-daemon.yml / daemon-e2e-windows.yml's ripgrep installs.
      - name: Install ripgrep
        run: brew install ripgrep

      - name: Build release local-api binaries
        working-directory: apps/native
        run: cargo build --release --features e2e-runner --bin local-api --bin local-api-e2e-embedded

      - name: Run curated daemon e2e subset against local-api
        id: daemon-parity
        # The pinned documented failures are EXPECTED here (see the job header
        # above for what they are) —
        # `|| true` keeps this step green so the next step (the actual
        # gate) can inspect the junit output and fail precisely on a SET
        # mismatch, not merely on bun test's own non-zero exit.
        #
        # `daemon.proxy.e2e.test.ts` / `daemon.ws-proxy.e2e.test.ts` are NOT
        # in this list — see the job header comment above and
        # the native parity contract for why (the port-router split moved that
        # traffic to a second listener this single-port harness can't
        # reach).
        run: |
          LOCAL_API_BIN="$GITHUB_WORKSPACE/apps/native/target/release/local-api"
          export DAEMON_E2E_CMD="[\"$LOCAL_API_BIN\"]"
          cd packages/sandbox
          bun test daemon-e2e/daemon.e2e.test.ts \
                   daemon-e2e/daemon.sse-shapes.e2e.test.ts \
                   daemon-e2e/daemon.git.e2e.test.ts \
                   daemon-e2e/daemon.tools.e2e.test.ts \
                   --reporter=junit --reporter-outfile="$RUNNER_TEMP/daemon-parity.xml" || true

      - name: Assert exact fail-set match against the pinned allowlist
        run: |
          bun run --cwd apps/native check:junit-allowlist -- \
            "$RUNNER_TEMP/daemon-parity.xml" \
            "$GITHUB_WORKSPACE/apps/native/scripts/ci/daemon-parity-allowlist.json"

      - name: Upload junit report (debugging aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-parity-junit
          path: ${{ runner.temp }}/daemon-parity.xml
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------
  # 3. contract-suite — apps/native/e2e's own black-box contract suite
  #    (LOCAL_API_E2E_CMD) against the release local-api binary. Unlike the
  #    parity oracle above, this suite is OWNED by this implementation
  #    (the native local-API contract is the spec it pins), so
  #    the bar is simply "all green" — no allowlist needed.
  #
  #    Runs on both shipping targets. The suite drives the local-api BINARY
  #    over the wire (`LOCAL_API_E2E_CMD`), and that binary needs no system
  #    libraries on Linux — rusqlite is `bundled`, reqwest is rustls-only —
  #    so the ubuntu leg deliberately carries no apt step. Only src-tauri
  #    (the `rust-checks` / `tauri-build` jobs) pulls in the GTK surface.
  # ---------------------------------------------------------------------
  contract-suite-os:
    needs: changes
    if: >-
      (needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.contract == 'true') &&
      github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Build release local-api binaries
        working-directory: apps/native
        run: cargo build --release --features e2e-runner --bin local-api --bin local-api-e2e-embedded

      - name: Run local-api contract suite
        working-directory: apps/native
        run: |
          export LOCAL_API_E2E_CMD="[\"$GITHUB_WORKSPACE/apps/native/target/release/local-api\"]"
          export LOCAL_API_EMBEDDED_E2E_CMD="[\"$GITHUB_WORKSPACE/apps/native/target/release/local-api-e2e-embedded\"]"
          bun test e2e

  # ---------------------------------------------------------------------
  # 4. tauri-build — bundles the RELEASE artifact for each shipping target
  #    (the same profile release-native.yaml ships; a debug bundle used to
  #    be built here but gated nothing the release profile doesn't, while
  #    leaving the shipped profile untested until release day), boot-smokes
  #    it, and uploads the exact tested bundle as an artifact. macOS
  #    produces `deco.app`; Linux produces an AppImage, with `--bundles`
  #    left off so the target list comes from
  #    src-tauri/tauri.linux.conf.json5 exactly as it does on release day.
  #    Unsigned always — signing and notarization live in
  #    release-native.yaml, the secret-gated release job.
  #
  #    LOAD-BEARING: the Linux legs of this workflow must NEVER declare an
  #    `environment:` nor map any secret. That is precisely what makes this
  #    job the `createUpdaterArtifacts` canary — tauri.linux.conf.json5
  #    documents that the key belongs only in release-native.yaml's
  #    --config overlay, and a secretless build is what goes red the moment
  #    someone commits it into the platform config instead.
  # ---------------------------------------------------------------------
  tauri-build-os:
    needs: changes
    if: >-
      (needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.frontend == 'true') &&
      github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # (No job-level env: both signing families below are deliberately unwired
    # in this non-shipping job.)
    # --- macOS code signing + notarization (Apple Developer ID) ---------
      # All optional. Human-required setup (cert enrollment, notarization
      # credentials) — see the native release contract (§5.3,
      # dormant scaffolding). Required secret names, each consumed only by
      # the `tauri build` step below via env:
      #   APPLE_CERTIFICATE              - base64-encoded .p12 Developer ID cert
      #   APPLE_CERTIFICATE_PASSWORD     - password for the .p12 above
      #   APPLE_SIGNING_IDENTITY         - cert Common Name, e.g. "Developer ID
      #                                     Application: <org> (<team id>)" —
      #                                     not in the brief's original list but
      #                                     REQUIRED by Tauri's signing flow
      #                                     alongside the cert itself; documented
      #                                     here so it isn't missed when the
      #                                     other 5 Apple secrets are configured
      #   APPLE_ID                       - Apple ID used for notarization
      #   APPLE_PASSWORD                 - app-specific password for APPLE_ID
      #   APPLE_TEAM_ID                  - Developer Team ID
      # DELIBERATELY NOT WIRED HERE. This job produces an unsigned release
      # bundle for boot-smoke, which runs the binary directly and gains
      # nothing from a Developer ID. Exporting the secrets made the Tauri CLI
      # attempt `security import` during this verification build, and it
      # failed with "failed codesign application: failed to import keychain
      # certificate", from a cert that is present but not importable. Wiring
      # them cost a green CI and bought nothing. Signing belongs to the
      # separate, secret-gated release job.
      # --- Tauri updater artifact signing: NOT wired here, by design.
      #     createUpdaterArtifacts is enabled only by release-native.yaml's
      #     --config overlay (never the committed tauri.conf.json5), so this
      #     job can never produce updater artifacts and has no use for the
      #     minisign key. The key is step-scoped onto the release build —
      #     see release-native.yaml's "tauri build" step.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same surface as `rust-checks` plus xvfb: the boot smoke launches a
      # real GTK/WebKitGTK process, and Linux runners are headless (macOS
      # runners are logged-in GUI VMs, which is why that leg needs nothing).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            xvfb

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      # rclone is bundled as an `externalBin` (the org filesystem's NFS
      # mount) and deliberately NOT committed — 78 MB per architecture.
      # Keyed on the fetch script's hash, so bumping the pinned version in
      # that script busts the cache automatically.
      - name: Cache bundled rclone
        uses: actions/cache@v4
        with:
          path: apps/native/src-tauri/binaries
          key: rclone-${{ runner.os }}-${{ hashFiles('apps/native/scripts/fetch-rclone.sh') }}

      # `beforeBuildCommand` also runs this, but a dedicated step attributes a
      # download or checksum failure to itself instead of to `tauri build`.
      - name: Fetch bundled rclone
        working-directory: apps/native
        run: ./scripts/fetch-rclone.sh

      # The AppImage's outer runtime is supplied by whichever
      # `linuxdeploy-plugin-appimage` the CLI finds in its tools cache; a
      # stale one emits a type-2 runtime dynamically linked against
      # libfuse.so.2, which cannot even self-extract on a runner that has no
      # libfuse2.
      #
      # Seeded from apps/native/scripts/fetch-appimage-tools.sh — the SAME
      # pinned, checksum-verified set release-native.yaml uses (it wipes the
      # cache first, so no stale tool survives). Letting the CLI fetch rolling
      # `continuous` builds here instead would mean the AppImage this job
      # boot-smokes, extracts and asserts static is NOT produced by the
      # toolchain that builds the shipped one: a stale or wrong pin could then
      # only fail on release day, on a half-published version, with no way to
      # go red on the PR that introduced it. That is precisely the canary
      # framing this job claims below.
      #
      # No secret and no `environment:` is involved — the createUpdaterArtifacts
      # canary property is untouched.
      - name: Seed the pinned AppImage tooling
        if: runner.os == 'Linux'
        working-directory: apps/native
        run: ./scripts/fetch-appimage-tools.sh

      # These verification builds are NEVER signed, whether or not the
      # secrets exist. Boot-smoke runs the binary directly and a Developer ID
      # buys it nothing, while attempting the import couples this job to the
      # health of six repo secrets. Signing belongs to release-native.yaml,
      # the secret-gated release job.
      #
      # Pinned to the version release-native.yaml ships with: the bundler
      # decides the AppImage member name (`deco_<version>_amd64.AppImage`)
      # that the updater's version-pairing check parses, so CI must not
      # validate an artifact produced by a different bundler than release.
      #
      # macOS PRs build only the artifact this job smokes and uploads; pushes
      # to main and manual runs retain DMG bundler coverage without adding
      # that packaging cost to every review cycle. Linux never passes
      # `--bundles`, so its target list comes from the
      # tauri.linux.conf.json5 overlay exactly as it does on release day.
      - name: tauri build (.app only)
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        working-directory: apps/native
        run: bunx @tauri-apps/cli@2.11.4 build --bundles app

      - name: tauri build (.app + DMG)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        working-directory: apps/native
        run: bunx @tauri-apps/cli@2.11.4 build

      - name: tauri build (AppImage)
        if: runner.os == 'Linux'
        working-directory: apps/native
        run: bunx @tauri-apps/cli@2.11.4 build

      # Runs BEFORE anything extracts the AppImage (the boot smoke does,
      # via --appimage-extract). Asserting after extraction would be
      # self-defeating: a libfuse2-linked runtime cannot perform the extract
      # at all, so the smoke would fail first and mask the real diagnosis.
      # `ldd` exits non-zero on a static binary — that is the passing case
      # here, hence the `|| true` around both probes.
      #
      # Which is also why "no output at all" (missing binutils, wrong path,
      # non-ELF input) must NOT be read as success: `grep -q` would find no
      # match and the tripwire would report green having learned nothing. So
      # the probe output has to carry a recognizable linkage verdict before
      # "no libfuse" counts as evidence.
      # A download can only ADD a name to that cache, so an exact set
      # comparison after the build proves `tauri build` fetched nothing —
      # closing the drift a CLI bump would otherwise open silently (the pin
      # table is not keyed to the CLI version).
      - name: Assert the build fetched no unpinned tooling
        if: runner.os == 'Linux'
        working-directory: apps/native
        run: ./scripts/fetch-appimage-tools.sh --verify-only

      - name: Assert the AppImage runtime is statically linked
        if: runner.os == 'Linux'
        working-directory: apps/native
        run: |
          set -euo pipefail
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::no .AppImage produced under target/release/bundle/appimage"
            exit 1
          fi
          echo "Inspecting $APPIMAGE"
          PROBE="$RUNNER_TEMP/appimage-runtime.txt"
          { ldd "$APPIMAGE" || true; readelf -d "$APPIMAGE" || true; } \
            > "$PROBE" 2>&1
          cat "$PROBE"
          if ! grep -Eq 'statically linked|not a dynamic executable|Dynamic section|no dynamic section|NEEDED' "$PROBE"; then
            echo "::error::neither ldd nor readelf reported a linkage verdict for $APPIMAGE (output above) — the libfuse.so.2 check would pass vacuously, so failing instead. Check that binutils is installed on this runner and that the path is the AppImage itself."
            exit 1
          fi
          if grep -q 'libfuse\.so\.2' "$PROBE"; then
            echo "::error::$APPIMAGE links libfuse.so.2 — the AppImage runtime is not static, so it cannot run or self-extract without libfuse2 installed. The pinned linuxdeploy-plugin-appimage in apps/native/scripts/fetch-appimage-tools.sh is stale; re-pin it there (both this workflow and release-native.yaml read that file)."
            exit 1
          fi

      # GitHub's macOS runners provide a GUI session, so no headless display
      # shim is needed. Self-test uses an isolated app-data directory and an
      # in-memory token store, validates the runtime report, and checks for
      # orphaned child processes. Its window is briefly visible by default to
      # avoid macOS App Nap stalling the runtime probes.
      - name: Boot smoke (DESKTOP_SELFTEST=1)
        if: runner.os == 'macOS'
        # DECOCMS_DISABLE_AUTO_UPDATE: this job builds the RELEASE profile at
        # the committed version 0.1.0 — without the kill-switch, a
        # plugin-registered updater would see the prod channel as "newer" and
        # download ~80 MB over the CI bundle mid-smoke. Belt-and-braces: the
        # updater task also refuses to spawn under DESKTOP_SELFTEST=1 and at
        # the 0.1.0 placeholder version.
        env:
          DECOCMS_DISABLE_AUTO_UPDATE: "1"
        # CI must smoke the bundle produced above without letting the smoke
        # script replace it with a second build.
        run: bun run --cwd apps/native smoke:boot --require-existing-bundle

      - name: Upload smoked .app artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: deco-app
          path: apps/native/target/release/bundle/macos/deco.app
          if-no-files-found: error
          retention-days: 14

      # Same smoke, same kill-switch reasoning as the macOS step above; the
      # only difference is the display. Linux runners are headless, so the
      # webview needs an X server — `xvfb-run -a` picks a free display
      # number. The smoke extracts the AppImage it just asserted on (no FUSE
      # required) and launches the inner binary directly.
      - name: Boot smoke under Xvfb (DESKTOP_SELFTEST=1, hidden window)
        if: runner.os == 'Linux'
        env:
          DECOCMS_DISABLE_AUTO_UPDATE: "1"
        run: xvfb-run -a bun run --cwd apps/native smoke:boot --require-existing-bundle

      - name: Upload smoked AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: deco-appimage
          path: apps/native/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # 5. stub-seam-nightly — keeps the DAEMON_E2E_CMD swap-seam mechanics
  #    (spawn / env contract / health-poll / SIGKILL-teardown) exercised
  #    even on weeks with no apps/native PRs, per the desktop migration contract §5.1.
  #    Runs the plain Node stub (packages/sandbox/daemon-e2e/
  #    stub-daemon.mjs), not the Rust binary — ubuntu-latest is fine since
  #    nothing here is macOS-specific (no cargo build at all). Asserts the
  #    documented 76 pass / 27 fail table from the daemon parity contract via the
  #    same exact-set allowlist checker as job 2 — this table already
  #    documents (and this job tolerates, by pinning it into the allowlist
  #    like every other entry) the one env-leakage self-check failure
  #    (`swappable spawn target > defaults to ... when DAEMON_E2E_CMD is
  #    unset`) the README's "Friction found in the seam" section explains.
  # ---------------------------------------------------------------------
  stub-seam-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run daemon.e2e.test.ts against the e2e-stub seam probe
        # 27 documented failures are EXPECTED (this stub implements only a
        # slice of the daemon's route surface — see the daemon parity contract's
        # "What stub-daemon.mjs implements"). `|| true` for the same reason
        # as job 2's parity step — the next step is the real gate.
        run: |
          STUB="$GITHUB_WORKSPACE/packages/sandbox/daemon-e2e/stub-daemon.mjs"
          export DAEMON_E2E_CMD="[\"node\", \"$STUB\"]"
          cd packages/sandbox
          bun test daemon-e2e/daemon.e2e.test.ts \
                   --reporter=junit --reporter-outfile="$RUNNER_TEMP/stub-seam.xml" || true

      - name: Assert exact fail-set match against the pinned allowlist
        run: |
          bun run --cwd apps/native check:junit-allowlist -- \
            "$RUNNER_TEMP/stub-seam.xml" \
            "$GITHUB_WORKSPACE/apps/native/scripts/ci/stub-seam-allowlist.json"

      - name: Upload junit report (debugging aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stub-seam-junit
          path: ${{ runner.temp }}/stub-seam.xml
          if-no-files-found: warn
          retention-days: 7

  # Aggregator carrying the required-check name: the ruleset requires a check
  # called "rust-checks", and matrix jobs report as "rust-checks (macos-latest)"/"(ubuntu-22.04)"
  # — a renamed required check would block merges forever. This job is the one
  # the rule sees; a skipped matrix (irrelevant-paths PRs) counts as pass, same
  # as the changes-gate semantics everywhere else.
  rust-checks:
    needs: [changes, rust-checks-os]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify rust-checks legs
        run: |
          case "${{ needs.rust-checks-os.result }}" in
            success|skipped) echo "rust-checks: ${{ needs.rust-checks-os.result }}"; exit 0 ;;
            *) echo "rust-checks: ${{ needs.rust-checks-os.result }}"; exit 1 ;;
          esac

  # Aggregator carrying the required-check name: the ruleset requires a check
  # called "contract-suite", and matrix jobs report as "contract-suite (macos-latest)"/"(ubuntu-22.04)"
  # — a renamed required check would block merges forever. This job is the one
  # the rule sees; a skipped matrix (irrelevant-paths PRs) counts as pass, same
  # as the changes-gate semantics everywhere else.
  contract-suite:
    needs: [changes, contract-suite-os]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify contract-suite legs
        run: |
          case "${{ needs.contract-suite-os.result }}" in
            success|skipped) echo "contract-suite: ${{ needs.contract-suite-os.result }}"; exit 0 ;;
            *) echo "contract-suite: ${{ needs.contract-suite-os.result }}"; exit 1 ;;
          esac

  # Aggregator carrying the required-check name: the ruleset requires a check
  # called "tauri-build", and matrix jobs report as "tauri-build (macos-latest)"/"(ubuntu-22.04)"
  # — a renamed required check would block merges forever. This job is the one
  # the rule sees; a skipped matrix (irrelevant-paths PRs) counts as pass, same
  # as the changes-gate semantics everywhere else.
  tauri-build:
    needs: [changes, tauri-build-os]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify tauri-build legs
        run: |
          case "${{ needs.tauri-build-os.result }}" in
            success|skipped) echo "tauri-build: ${{ needs.tauri-build-os.result }}"; exit 0 ;;
            *) echo "tauri-build: ${{ needs.tauri-build-os.result }}"; exit 1 ;;
          esac
