name: Sandbox Android Image

# The release workflow only builds this image on main, after the version bump.
# This builds it on the PR against the already-published base and runs the same
# smoke test, so a broken emulator setup is caught before merge.
on:
  pull_request:
    paths:
      - "packages/sandbox/image-android/**"
      - ".github/actions/sandbox-android-smoke/**"
      - ".github/workflows/sandbox-android-image.yaml"

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The base image alone is ~6GB and the SDK adds about as much again;
      # the runner's preinstalled toolchains are what stand between that and
      # a full disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /


      - name: Read sandbox version
        id: version
        run: echo "version=$(jq -r .version packages/sandbox/package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ./packages/sandbox/image-android
          file: ./packages/sandbox/image-android/Dockerfile
          load: true
          tags: studio-sandbox-android:pr
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}/studio-sandbox-go
            BASE_TAG=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=sandbox-android
          cache-to: type=gha,mode=max,scope=sandbox-android
          platforms: linux/amd64

      - uses: ./.github/actions/sandbox-android-smoke
        with:
          image: studio-sandbox-android:pr
