name: daemon-e2e-windows

# Windows gate for the sandbox daemon. Mirrors sandbox-daemon.yml's build+run
# contract exactly (same bun-version pin, same build command, same test glob,
# same unset DAEMON_E2E_CMD so the suite falls back to its own bundled-daemon
# default — see daemon.e2e.helpers.ts's resolveDaemonCmd) but on windows-latest
# instead of ubuntu-latest, plus the ripgrep install the grep route needs.
#
# This is scoped to the daemon subtree via `paths:` (not the PR-file-diff
# `changes` job sandbox-daemon.yml uses) since it's a narrower, opt-in gate for
# Windows support work rather than a required check on every daemon change.

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/sandbox/daemon/**"
      - ".github/workflows/daemon-e2e-windows.yml"

concurrency:
  group: daemon-e2e-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun and install dependencies
        # Also installs node-pty's prebuilt ConPTY binary for win32 (no native
        # build step needed — node-pty ships platform prebuilds).
        uses: ./.github/actions/setup-bun

      # The fs `grep` route shells out to ripgrep; install it so the test
      # asserts results strictly instead of tolerating "grep unavailable" (see
      # daemon.e2e.test.ts's "grep finds matching content" test, which is
      # strict whenever `CI` is set — true on every GitHub Actions runner).
      - name: Install ripgrep
        run: choco install ripgrep -y

      - name: Build daemon bundle
        run: bun run --cwd=packages/sandbox build

      - name: Run daemon e2e tests
        # Same glob as sandbox-daemon.yml: all daemon e2e specs end in
        # `.e2e.test.ts` (core + git + proxy + dispatch + tools); the helpers
        # file is `.e2e.helpers.ts` and is not matched. DAEMON_E2E_CMD is left
        # unset so the suite spawns the bundle built above via its own default
        # (`bun packages/sandbox/daemon/dist/daemon.js`) — the same contract
        # the POSIX job uses, just resolved via `bun` on PATH here too.
        #
        # shell: bash (Git Bash, preinstalled on windows-latest) — the default
        # pwsh does NOT expand the `daemon*` glob, so bun received the literal
        # pattern, matched zero files, and exited 1 (first-run triage). Bash
        # expands it exactly like the ubuntu job.
        shell: bash
        run: bun test packages/sandbox/daemon/daemon*.e2e.test.ts
