name: E2E Tests

on:
  push:
    branches:
      - main
    # The "[release]: bump" commit touches only apps/mesh/package.json; skip it
    # here so the version bump doesn't re-spawn this suite (release-mesh owns it).
    paths-ignore:
      - "apps/mesh/package.json"
  pull_request:

jobs:
  # See test.yml for why this gate exists: skip the (required) check on
  # workflow/docs/markdown-only PRs without leaving the required check
  # stuck pending. Pushes to main always run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push to main runs everything — except the [release]: version-bump
            # commit, which only touches the version string. release-mesh picks
            # that commit up on its own push trigger and cuts the release.
            case "$HEAD_MSG" in
              '[release]:'*) echo "relevant=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "relevant=true" >> "$GITHUB_OUTPUT" ;;
            esac
            exit 0
          fi
          set +e
          FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          if [ $? -ne 0 ]; then
            echo "Could not list PR files — running to be safe."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$FILES"
          relevant=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/*|apps/docs/*|*.md) ;;
              *) relevant=true; break ;;
            esac
          done <<< "$FILES"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mesh

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NATS_URL: nats://localhost:4222
      # Better Auth's per-endpoint signup limiter kicks in after a handful of
      # /sign-up/email POSTs in a short window. Our e2e specs do multiple
      # signups per run; without this they get 429s and only pass on retry,
      # which masks real regressions as "flaky".
      DISABLE_RATE_LIMIT: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install
        working-directory: .

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10 -js
          for i in $(seq 1 10); do nc -z localhost 4222 && break || sleep 1; done
          nc -z localhost 4222

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/mesh/package.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Write CI auth config
        run: |
          echo '{"emailAndPassword":{"enabled":true},"socialProviders":{},"saml":{"enabled":false,"providers":[]},"emailProviders":[],"magicLinkConfig":{"enabled":false}}' > auth-config.json

      - name: Create data directory
        run: mkdir -p data

      - name: Run database migrations
        run: bun run migrate

      - name: Run e2e tests
        run: bun run test:e2e
