name: Release Sandbox Controller Image

on:
  push:
    branches: [main]
    paths:
      - "packages/sandbox/controller-go/**"
      - "deploy/helm/sandbox-controller/Chart.yaml"
  workflow_dispatch:

concurrency:
  group: release-sandbox-controller
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sandbox-controller

jobs:
  build-push:
    name: Build & Push sandbox-controller image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The chart's appVersion is the image tag the chart deploys, so it is
      # the version: bump it to publish.
      - name: Read controller version
        id: version
        run: echo "version=$(awk -F'"' '/^appVersion:/{print $2; exit}' deploy/helm/sandbox-controller/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version tag already exists
        id: tag-check
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://${{ env.REGISTRY }}/v2/${{ env.IMAGE_NAME }}/manifests/${{ steps.version.outputs.version }}")
          if [ "${STATUS}" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} already exists — bump appVersion in deploy/helm/sandbox-controller/Chart.yaml to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        if: steps.tag-check.outputs.exists != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short

      - name: Set up Docker Buildx
        if: steps.tag-check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        if: steps.tag-check.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./packages/sandbox/controller-go
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Install cosign
        if: steps.tag-check.outputs.exists != 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: steps.tag-check.outputs.exists != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $(echo "${TAGS}" | tr ',' '\n'); do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Generate SLSA build provenance
        if: steps.tag-check.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
