name: Sandbox

# packages/sandbox/daemon/daemon.e2e.test.ts spawns the built daemon binary
# and exercises real HTTP/SSE endpoints — it's an integration test that
# runs under `bun test` purely because of where it lives in the tree.
# Split into its own workflow so the unit-test job stays infrastructure-free
# (no daemon-bundle build, no per-test process spawning) per TESTING.md.

on:
  push:
    branches:
      - main
    # Skip pushes to main that only touch the version bump, CI/workflow config,
    # or docs — none need the suite re-run (PRs already validated them, and the
    # [release] bump is owned by release-studio).
    paths-ignore:
      - "apps/api/package.json"
      - ".github/**"
      - "apps/docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # See test.yml for why this gate exists: skip the (required) check without
  # leaving it stuck pending. Here the gate is scoped tighter than test.yml's:
  # the daemon e2e suite only exercises the sandbox daemon bundle, so it runs
  # only when the packages feeding that build change. Pushes to main always run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push to main runs everything — except the [release]: version-bump
            # commit, which only touches the version string. release-studio picks
            # that commit up on its own push trigger and cuts the release.
            case "$HEAD_MSG" in
              '[release]:'*) echo "relevant=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "relevant=true" >> "$GITHUB_OUTPUT" ;;
            esac
            exit 0
          fi
          set +e
          if ! FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename'); then
            echo "Could not list PR files — running to be safe."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$FILES"
          relevant=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              packages/sandbox/*|packages/typegen/*|packages/shared/*|packages/harness/*) relevant=true; break ;;
            esac
          done <<< "$FILES"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  daemon-e2e:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      # The fs `grep` route shells out to ripgrep; install it so that test can
      # assert results strictly instead of tolerating "grep unavailable".
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build daemon bundle
        run: bun run --cwd=packages/sandbox build

      - name: Run daemon e2e tests
        # All daemon e2e specs end in `.e2e.test.ts` (core + git + proxy +
        # dispatch); the helpers file is `.e2e.helpers.ts` and is not matched.
        run: bun test packages/sandbox/daemon/daemon*.e2e.test.ts

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build daemon bundle
        run: bun run --cwd=packages/sandbox build

      - name: Build sandbox image
        run: |
          docker build \
            -t studio-sandbox:ci \
            -f packages/sandbox/image/Dockerfile \
            packages/sandbox

      - name: Smoke test
        run: |
          docker run -d --name sandbox-smoke -p 19999:9000 \
            -e DAEMON_TOKEN="$(printf 't%.0s' {1..32})" \
            -e DAEMON_BOOT_ID="ci-smoke" \
            -e APP_ROOT=/app \
            -e PROXY_PORT=9000 \
            -e DAEMON_NO_AUTOSTART=1 \
            studio-sandbox:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:19999/health | grep -q '"bootId":"ci-smoke"'; then
              echo "ok"
              exit 0
            fi
            sleep 1
          done
          echo "smoke test failed — daemon did not return /health with ci-smoke bootId"
          docker logs sandbox-smoke
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f sandbox-smoke || true
