# Ships the desktop app whenever its version moves.
#
# The version moves via release-tagging.yaml: a merge touching apps/api/**,
# apps/web/** or apps/native/** bumps apps/native/package.json in lockstep
# with apps/api's (scripts/release-changes.ts — ONE release line, so the
# deployed server and the installed app always answer "what version?" with
# the same number), and the bot's `[release]:` commit lands on main touching
# exactly that file — which is this workflow's trigger. Keying the trigger on
# the manifest rather than the bump-commit message keeps it idempotent: the
# tag-exists guard below makes re-runs and manual dispatches safe.
#
# Signing/notarization are fork-safe dormant scaffolding, same pattern as
# native.yml documents: every Apple step is gated on the secrets being
# non-empty, so an unconfigured repo ships an unsigned build (Gatekeeper
# "Open Anyway" friction, but installable) instead of failing. The day the
# six APPLE_* secrets land, the same workflow signs, notarizes and staples
# with no further edits.
#
# The Homebrew cask (Casks/deco.rb — this repo doubles as the
# tap) is bumped by this workflow after the release assets exist, committed
# straight to main with the same App token release-tagging uses. That commit
# touches only Casks/**, which no other workflow's paths match, so it
# triggers nothing.
name: Release Native

on:
  push:
    branches:
      - main
    paths:
      - "apps/native/package.json"
  # Manual escape hatch: re-cut a release whose run failed halfway, or cut
  # the first one. The tag-exists guard keeps this idempotent.
  workflow_dispatch: {}

concurrency:
  group: release-native-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUN_VERSION: "1.3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/native/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=native-v$VERSION" >> "$GITHUB_OUTPUT"

      # A version still at 0.0.0 has never been released-bumped, so there is
      # nothing to ship. A PUSH whose tag already exists was already shipped,
      # so it skips (staying safe on every main commit that touches the
      # manifest for other reasons). A manual workflow_dispatch does NOT skip
      # on an existing tag — that is the documented repair path for a run
      # that died after the release was created, and the create/upload and
      # cask steps below are idempotent so re-running only heals.
      - name: Skip if already released
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if [ "${{ steps.version.outputs.version }}" = "0.0.0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version 0.0.0 — never bumped; skipping"
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ] && \
               gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already released and this is a push; skipping (dispatch to repair)"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust toolchain
        if: steps.guard.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target dir
        if: steps.guard.outputs.release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native

      - name: Setup Bun
        if: steps.guard.outputs.release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        if: steps.guard.outputs.release == 'true'
        run: bun install

      - name: Cache bundled rclone
        if: steps.guard.outputs.release == 'true'
        uses: actions/cache@v4
        with:
          path: apps/native/src-tauri/binaries
          key: rclone-${{ runner.os }}-${{ hashFiles('apps/native/scripts/fetch-rclone.sh') }}

      - name: Fetch bundled rclone
        if: steps.guard.outputs.release == 'true'
        working-directory: apps/native
        run: ./scripts/fetch-rclone.sh

      - name: Build desktop frontend bundle
        if: steps.guard.outputs.release == 'true'
        run: bun run --cwd apps/web build:native

      # Import the Developer ID certificate only when configured. Kept as its
      # own step (not left to the Tauri CLI env-sniffing) so a broken cert
      # fails HERE with a clear name, not inside `tauri build`.
      - name: Import signing certificate
        if: steps.guard.outputs.release == 'true' && env.HAVE_CERT == 'true'
        env:
          HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      # Tauri's CLI signs whenever APPLE_SIGNING_IDENTITY is *defined* — and
      # an `env:` mapping of an unset secret defines it as "", so mapping the
      # secrets directly onto `tauri build` made every unconfigured run die
      # in codesign with `no identity found` instead of shipping unsigned.
      # Export each var only when its secret is non-empty; a var that is
      # absent (not empty) leaves an unsigned build
      # (https://v2.tauri.app/distribute/sign/macos/).
      #
      # TAURI_SIGNING_* signs the updater artifact the day tauri.conf enables
      # the `updater` bundle target. Wired in this SHIPPING job (not just
      # native.yml's non-shipping CI build) so no edit is needed here on
      # release day; a no-op while that target stays dormant.
      - name: Export signing env
        if: steps.guard.outputs.release == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Heredoc form because TAURI_SIGNING_PRIVATE_KEY may be multiline.
        run: |
          for VAR in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD \
                     APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY \
                     TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!VAR}" ]; then
              {
                echo "$VAR<<__SIGNING_EOF__"
                echo "${!VAR}"
                echo "__SIGNING_EOF__"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: tauri build
        if: steps.guard.outputs.release == 'true'
        working-directory: apps/native
        # Signing env (when configured) comes from "Export signing env" above.
        # The binary's version comes from apps/native/package.json — the one
        # release-tagging bumps — overriding Cargo.toml's static workspace
        # version, so the DMG, the About panel, and the cask all agree.
        run: |
          bunx @tauri-apps/cli@latest build \
            --config "{\"version\": \"${{ steps.version.outputs.version }}\"}"

      - name: Package release assets
        if: steps.guard.outputs.release == 'true'
        id: assets
        working-directory: apps/native/target/release/bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="deco-$VERSION-aarch64.zip"
          DMG_OUT="deco-$VERSION-aarch64.dmg"
          # ditto preserves signatures, resource forks and the executable bit
          # — a plain `zip` bundle strips what codesign later needs intact.
          ditto -c -k --keepParent "macos/deco.app" "$ZIP"
          DMG_SRC=$(ls dmg/*.dmg | head -1)
          cp "$DMG_SRC" "$DMG_OUT"
          echo "zip=apps/native/target/release/bundle/$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg=apps/native/target/release/bundle/$DMG_OUT" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$ZIP" | cut -d' ' -f1 > zip.sha256
          echo "sha256=$(cat zip.sha256)" >> "$GITHUB_OUTPUT"

      # Create-or-update: on a repair dispatch the tag already exists, so
      # re-uploading the assets (--clobber) heals a run that died here or
      # later, rather than erroring on the existing release.
      - name: Create or update GitHub release
        if: steps.guard.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.assets.outputs.zip }}
          DMG: ${{ steps.assets.outputs.dmg }}
        run: |
          set -euo pipefail
          NOTES="macOS (Apple Silicon) desktop app. Install via Homebrew: \`brew tap decocms/studio https://github.com/decocms/studio && brew install --cask deco\` — or download the DMG below."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "deco $VERSION" --notes "$NOTES"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$ZIP" "$DMG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "deco $VERSION" --notes "$NOTES" \
              "$ZIP" "$DMG"
          fi

      # Gated on the App credentials EXISTING: a fork without them still
      # builds and publishes the (unsigned) release above — this only skips
      # the cask bump, which needs a push token, rather than failing the run
      # after the release was created. The bot's push touches only Casks/**,
      # which no workflow's paths match — no retrigger loop.
      - name: Generate app token
        if: steps.guard.outputs.release == 'true' && vars.RELEASE_BOT_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Bump Homebrew cask
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          set -euo pipefail
          git config user.name "decocms-release[bot]"
          git config user.email "decocms-release[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          render_cask() {
            python3 - "$VERSION" "$SHA" <<'PY'
          import re, sys

          version, sha = sys.argv[1], sys.argv[2]
          path = "Casks/deco.rb"
          s = open(path).read()
          # Anchor to the INDENTED stanza lines. The header comment mentions
          # `sha256 :no_check` too, but comment lines start with `#`, so
          # `^\s+` (multiline) can only ever hit the real ruby stanza — the
          # unanchored version rewrote the comment and left the stanza at
          # :no_check, disabling checksum verification forever.
          s = re.sub(r'(?m)^(\s+)version "[^"]*"', rf'\g<1>version "{version}"', s, count=1)
          s = re.sub(
              r'(?m)^(\s+)sha256 (?::no_check|"[^"]*")',
              rf'\g<1>sha256 "{sha}"',
              s,
              count=1,
          )
          open(path, "w").write(s)
          PY
          }

          # Regenerate from a CLEAN origin/main each attempt instead of
          # rebasing: two release runs bump the same cask lines, so
          # `git pull --rebase` would content-conflict by construction (and
          # then loop inside the unfinished rebase). Reset + re-render is
          # deterministic, so it always fast-forwards, and is idempotent — a
          # repair dispatch whose cask is already current commits nothing.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            render_cask
            if git diff --quiet -- Casks/deco.rb; then
              echo "cask already at $VERSION; nothing to push"
              exit 0
            fi
            git add Casks/deco.rb
            git commit -m "[chore]: bump homebrew cask to $VERSION"
            if git push "$REMOTE" HEAD:main; then
              echo "cask pushed (attempt $attempt)"
              exit 0
            fi
            echo "push rejected; resyncing to origin/main and retrying"
          done
          echo "::error::cask bump push failed after retries"
          exit 1
