name: Storage Integration

# Storage-layer tests that previously used PGlite (WASM-emulated Postgres)
# now run against a real `postgres:16` service so the SQL surface, query
# planner, RETURNING/ON CONFLICT semantics, advisory locks, LISTEN/NOTIFY,
# and extension behavior all match production. PGlite produced false
# confidence — passing locally, sometimes failing in prod.
#
# Lives outside the unit-test workflow because real Postgres is
# infrastructure per TESTING.md. No HTTP, no auth, no Playwright — just
# the storage adapters being exercised against a real DB.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  storage-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Run migrations
        run: bun run --cwd=apps/mesh migrate

      # Convention: every `*.integration.test.ts` file is picked up here.
      # Adding a new integration test = create a `something.integration.test.ts`
      # and it auto-routes to this workflow. See TESTING.md.
      #
      # One bun process per file: cleanest isolation between heavy-DB
      # files. Bun 1.3.14's teardown fixes mean we no longer need the
      # signal-tolerance branches we had on 1.3.5.
      - name: Run storage integration tests
        run: |
          set -e
          while IFS= read -r f; do
            echo "::group::$f"
            bun test "$f"
            echo "::endgroup::"
          done < <(find apps/mesh -name '*.integration.test.ts' | sort)
          failed_files=""
          crashed_files=""
          for f in $files; do
            echo "::group::$f"
            set +e
            out=$(bun test "$f" 2>&1)
            code=$?
            set -e
            echo "$out"
            echo "::endgroup::"
            if echo "$out" | grep -qE '^\(fail\)|[1-9][0-9]* fail'; then
              failed_files="$failed_files $f"
              continue
            fi
            if [ "$code" -eq 0 ]; then
              continue
            fi
            # Signal-induced exit AND we saw a (pass) marker → known Bun
            # 1.3.5 teardown crash, accept. Mirrors the unit-shard logic.
            if [ "$code" -gt 128 ] && echo "$out" | grep -qE '^\(pass\)|[1-9][0-9]* pass'; then
              echo "⚠️  $f: bun crashed at teardown (exit $code) after tests passed — accepting"
              continue
            fi
            crashed_files="$crashed_files $f"
          done
          if [ -n "$failed_files" ]; then
            echo "❌ Test failures in:$failed_files"
            exit 1
          fi
          if [ -n "$crashed_files" ]; then
            echo "❌ Bun crashed before tests ran in:$crashed_files"
            exit 1
          fi
          echo "✅ All storage integration files passed"
