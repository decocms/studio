name: Publish @decocms/sandbox-controller-types

on:
  push:
    branches: [main]
    paths:
      - "packages/sandbox/controller-types/**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if npm view @decocms/sandbox-controller-types@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "version-changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ Version $CURRENT_VERSION already published, skipping publish"
          else
            echo "version-changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version $CURRENT_VERSION not found in npm, will publish"
          fi

          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [[ "$CURRENT_VERSION" == *-* ]]; then
            echo "npm-tag=next" >> $GITHUB_OUTPUT
          else
            echo "npm-tag=latest" >> $GITHUB_OUTPUT
          fi
        working-directory: packages/sandbox/controller-types

      - name: Publish to npm
        if: steps.version-check.outputs.version-changed == 'true'
        run: npm publish --access public --tag ${{ steps.version-check.outputs.npm-tag }} --provenance
        working-directory: packages/sandbox/controller-types

      - name: Create Release
        if: steps.version-check.outputs.version-changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "sandbox-controller-types-v${{ steps.version-check.outputs.current-version }}" \
            --title "@decocms/sandbox-controller-types v${{ steps.version-check.outputs.current-version }}" \
            --notes "Automated release of @decocms/sandbox-controller-types: the SandboxVariant types, generated from packages/sandbox/controller-go.

          \`\`\`bash
          npm install @decocms/sandbox-controller-types
          \`\`\`"
