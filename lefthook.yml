# Lefthook configuration for the Studio monorepo
# Install: npx lefthook install

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.{ts,tsx,js,jsx,json,md}"
      run: bunx biome format --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint {staged_files}
    rust-fmt:
      root: "apps/native/"
      glob: "**/*.rs"
      run: cargo fmt -- --check {staged_files}
    rust-clippy:
      root: "apps/native/"
      glob: "**/*.rs"
      run: cargo clippy -- -D warnings
