apiVersion: v2
name: chart-deco-studio
description: Helm chart for deco Studio — supports inline secrets, external secretName, and AWS Secrets Manager via ExternalSecret
type: application
# 0.14.0: per-PR preview releases (preview.enabled, default false). Adds an
# HTTPRoute, an ephemeral in-namespace Postgres and a single PreSync migration
# Job — the database lives and dies with the namespace, so there is no shared
# server to provision, no admin credential to distribute and nothing to sweep.
# Renders nothing when disabled, so the default render is byte-identical and
# existing releases are unaffected. Pod topology is deliberately unchanged, and
# helm.sh/chart is kept off pod templates so a version bump rolls no pods.
# 0.13.2: dedicated emptyDir + FAST_PREVIEW_CACHE_DIR for the sandbox-less
# Fast Preview disk cache (fastPreviewCache values block).
# 0.13.1: documents the pre-existing `serviceAccount` values block. The
# templates already honoured it; it was simply absent from values.yaml, so
# `helm show values` hid a key the sandbox layer depends on. The render is
# byte-identical with default values.
# 0.13.0: optional Ingress (ingress.enabled, default false). Renders nothing
# when disabled, so existing releases are unaffected.
# 0.12.4: chart-managed API/worker dispatch roles now use
# STUDIO_DISPATCH_ROLE; legacy overrides are rejected.
version: 0.14.0
appVersion: "latest"

dependencies:
  - name: nats
    version: "2.14.2"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
  - name: opentelemetry-collector
    version: "0.147.2"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: otel.collector.enabled
  # Official ClickHouse operator + a ClickHouseCluster/KeeperCluster CR wrapper.
  # Keep both pinned to the SAME version (upstream compatibility guarantee).
  - name: clickhouse-operator-helm
    alias: clickhouse-operator
    version: "0.0.6"
    repository: "oci://ghcr.io/clickhouse"
    condition: clickhouse-operator.enabled
  - name: clickhouse-cluster-helm
    alias: clickhouse-cluster
    version: "0.0.6"
    repository: "oci://ghcr.io/clickhouse"
    condition: clickhouse-cluster.enabled
