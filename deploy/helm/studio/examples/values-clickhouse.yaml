# In-cluster ClickHouse for the monitoring dashboard (single node), for
# clusters that don't use ClickHouse Cloud.
#
# Assumes: helm install deco-studio . -n deco-studio -f values-clickhouse.yaml
# (adjust watchNamespaces and the exporter endpoint if release/namespace differ).
#
# Prerequisite: cert-manager (operator webhook certificates). Without it, set
# clickhouse-operator.certManager.enabled=false and
# clickhouse-operator.webhook.enabled=false.
#
# After the collector starts writing otel_logs, provision the
# studio_monitoring_logs VIEW once — the DDL and the why live in
# apps/api/src/monitoring/clickhouse-setup.md.

clickhouse-operator:
  enabled: true
  controller:
    # REQUIRED: the namespace this release installs into. Render fails if the
    # ClickHouseCluster CR would land in a namespace the operator ignores.
    watchNamespaces:
      - deco-studio

clickhouse-cluster:
  enabled: true
  # Pin the ClickHouse server version (default is `latest`).
  imageTag: "25.8"
  clickhouse:
    # spec is passed verbatim to ClickHouseCluster.spec — any CRD field works
    # here (settings, podTemplate, additionalPorts, ...) and is validated by
    # the operator webhook on apply.
    spec:
      # WARNING: scaling replicas/shards also requires changing the table DDL
      # (ReplicatedMergeTree / Distributed) — the CR alone leaves data
      # unreplicated/undistributed. See "Scaling beyond a single node" in
      # apps/api/src/monitoring/clickhouse-setup.md.
      replicas: 1
      shards: 1
      dataVolumeClaimSpec:
        # storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
      # The `default` user has no password out of the box (in-cluster access
      # only). To require one: create a Secret with the password, reference it
      # here, and put the authenticated URL in the chart Secret as
      # CLICKHOUSE_URL=http://default:<pass>@<cr-name>-clickhouse-headless:8123
      # (the Secret overrides the auto-derived ConfigMap value).
      # settings:
      #   defaultUserPassword:
      #     passwordType: password
      #     secret:
      #       name: clickhouse-default-user
      #       key: password
  keeper:
    # keeperClusterRef is REQUIRED by the CRD, so a Keeper always runs
    # (auto-wired by the subchart). Use 3 replicas when raising
    # clickhouse.spec.replicas.
    spec:
      replicas: 1
      dataVolumeClaimSpec:
        resources:
          requests:
            storage: 5Gi

# Ship Studio telemetry into ClickHouse through the in-cluster collector.
otel:
  enabled: true
  collector:
    enabled: true

opentelemetry-collector:
  config:
    exporters:
      clickhouse:
        # <release>-clickhouse-cluster-clickhouse-headless (native port 9000).
        # Same host the chart derives for CLICKHOUSE_URL, check the rendered
        # ConfigMap when in doubt.
        endpoint: tcp://deco-studio-clickhouse-cluster-clickhouse-headless:9000
        logs_table_name: otel_logs
        ttl: 720h
    service:
      pipelines:
        # Helm replaces lists wholesale: overriding one pipeline keeps the
        # others from the chart defaults (traces/metrics still export to
        # debug), but this logs list must be complete.
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
