# Example Secrets to create manually
# 
# IMPORTANT: This file contains example values and should NOT be applied directly.
# Use the create-secrets.sh script or create the Secrets manually with your real values.
#
# To create the Secrets manually:
#
# 1. Main Secret (BETTER_AUTH_SECRET, DATABASE_URL, and optional internal NATS credentials):
#    kubectl create secret generic deco-studio-secrets \
#      --from-literal=BETTER_AUTH_SECRET='your-secret-here' \
#      --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db' \
#      --from-file=NATS_CLUSTER_CREDS=./cluster.creds \
#      -n deco-studio


---
# Main Secret - BETTER_AUTH_SECRET, DATABASE_URL, and optional internal NATS credentials
apiVersion: v1
kind: Secret
metadata:
  name: deco-studio-secrets
  namespace: deco-studio
type: Opaque
stringData:
  BETTER_AUTH_SECRET: "SUBSTITUA_PELO_SEU_SECRET_AQUI"
  DATABASE_URL: "postgresql://usuario:senha@host:5432/database"
  NATS_CLUSTER_CREDS: |-
    -----BEGIN NATS USER JWT-----
    SUBSTITUA_PELO_CLUSTER_USER_JWT
    ------END NATS USER JWT------

    ************************* IMPORTANT *************************
    NKEY Seed printed below can be used to sign and prove identity.
    NKEYs are sensitive and should be treated as secrets.

    -----BEGIN USER NKEY SEED-----
    SUBSTITUA_PELO_CLUSTER_USER_NKEY_SEED
    ------END USER NKEY SEED------

  # Auth: AUTH_* env keys (schema: apps/api/src/auth/auth-env.ts). The chart
  # injects this whole Secret via envFrom, so they belong here, not in a
  # second Secret with camelCase keys the server never reads.
  AUTH_GOOGLE_CLIENT_ID: "SUBSTITUA_PELO_CLIENT_ID_DO_GOOGLE"
  AUTH_GOOGLE_CLIENT_SECRET: "SUBSTITUA_PELO_CLIENT_SECRET_DO_GOOGLE"
  AUTH_RESEND_API_KEY: "SUBSTITUA_PELA_API_KEY_DO_RESEND"
