# Example: bundled NATS in operator/JWT mode with a public websocket endpoint
# for CLI link sessions.
#
# Replace every placeholder before applying. Prefer an existing Kubernetes
# Secret or ExternalSecret in production instead of storing secret material in
# this values file.

tunnel:
  nats:
    publicUrl: "wss://nats.example.com"
    publicEnabled: true
    sessionTtlSeconds: 900
    clusterCreds:
      enabled: true

secret:
  # The tunnel account JWT and signing seed let Studio mint short-lived,
  # per-user daemon credentials returned by POST /api/links/session.
  NATS_ACCOUNT_JWT: "REPLACE_WITH_TUNNEL_ACCOUNT_JWT"
  NATS_ACCOUNT_SIGNING_KEY: "REPLACE_WITH_TUNNEL_ACCOUNT_SIGNING_SEED"
  NATS_OPERATOR_JWT: "REPLACE_WITH_OPERATOR_JWT"
  # Creds used by Studio API/worker pods for their internal NATS_URL connection.
  NATS_CLUSTER_CREDS: |-
    -----BEGIN NATS USER JWT-----
    REPLACE_WITH_CLUSTER_USER_JWT
    ------END NATS USER JWT------

    ************************* IMPORTANT *************************
    NKEY Seed printed below can be used to sign and prove identity.
    NKEYs are sensitive and should be treated as secrets.

    -----BEGIN USER NKEY SEED-----
    REPLACE_WITH_CLUSTER_USER_NKEY_SEED
    ------END USER NKEY SEED------

nats:
  enabled: true
  config:
    jetstream:
      enabled: true
    resolver:
      enabled: true
      merge:
        type: full
        interval: 2m
        timeout: 1.9s
    merge:
      operator: "REPLACE_WITH_OPERATOR_JWT"
      system_account: "REPLACE_WITH_SYSTEM_ACCOUNT_PUBLIC_KEY"
      resolver_preload:
        "REPLACE_WITH_SYSTEM_ACCOUNT_PUBLIC_KEY": "REPLACE_WITH_SYSTEM_ACCOUNT_JWT"
        "REPLACE_WITH_TUNNEL_ACCOUNT_PUBLIC_KEY": "REPLACE_WITH_TUNNEL_ACCOUNT_JWT"
    websocket:
      enabled: true
      port: 8080
      ingress:
        enabled: true
        hosts:
          - nats.example.com
