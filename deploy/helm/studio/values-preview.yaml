# Values for a per-PR preview release.
#
# Sized for "one reviewer clicking around", NOT for load. Do not derive a
# production values file from this one, and do not copy production values on
# top of it — the prod pod set requests ~4.5 vCPU / ~4.1 GiB plus two 10Gi
# PVCs, which is $150-250/mo per preview.
#
# Pod topology is deliberately identical to production (nginx `-web` front door
# + two API containers + a worker). A preview that runs a different topology
# than prod is a preview that can miss exactly the class of bug it exists to
# catch, and the extra container is ~100m/64Mi.
#
# The per-PR half of the configuration — image tags, preview.host, preview.prNumber,
# BASE_URL/BETTER_AUTH_URL, S3_BUCKET, DATABASE_URL — is injected by the Argo CD
# ApplicationSet, which is the only thing that knows the PR number. This file
# holds the half that is the same for every preview.
#
# Rendered in CI (.github/workflows/helm-test.yml) so it cannot rot.

preview:
  enabled: true
  # prNumber / host injected per PR by the ApplicationSet.
  gateway:
    name: studio-preview
    namespace: istio-gateways
    sectionName: https
  dbAdminSecret:
    # name empty → the release's own ESO-synced Secret (see externalSecret below).
    key: PREVIEW_PG_ADMIN_URL
  objectStorage:
    # No per-PR bucket. Object keys are scoped by ORG id, and because every
    # preview starts from an empty database its org ids are freshly generated
    # UUIDs — so two previews can never collide in one bucket. (Bucket-per-PR
    # would be mandatory if previews shared a seeded org id.) One shared R2
    # bucket with a lifecycle rule is simpler and needs no bucket-create
    # credential in the cluster.
    manageBucket: false

replicaCount: 1
autoscaling:
  enabled: false

image:
  repository: ghcr.io/decocms/studio/studio-preview
  # tag injected per PR by the ApplicationSet.
  pullPolicy: IfNotPresent
  # --skip-migrations is REQUIRED and enforced by validatePreview: the PreSync
  # Job is the single migration writer. Applies to the worker containers too,
  # which share this value.
  command: ["bun", "run", "deco", "--no-tui", "--no-local-mode", "--skip-migrations"]

nginx:
  # repository/tag injected per PR (studio-nginx-preview).
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      memory: "192Mi"

# No CPU limit anywhere below: boot is CPU-spiky (DBOS launch, NATS connect,
# Better Auth init) and throttling turns a 30s start into minutes.
resources:
  requests:
    cpu: "300m"
    memory: "768Mi"
  limits:
    memory: "1536Mi"

worker:
  # Not optional — validateDispatchRole fails the render without it, and
  # nothing would dequeue runs.
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  # Let the cluster autoscaler consolidate preview nodes freely.
  doNotDisrupt: false
  resources:
    requests:
      cpu: "300m"
      memory: "768Mi"
    limits:
      memory: "1536Mi"

database:
  engine: postgresql
  # url injected per PR (points at pr_<n> on the shared preview Postgres).

# No PVCs anywhere in a preview: PVC finalizers are the most common cause of a
# namespace that will not finish deleting, and a preview has nothing worth
# persisting.
persistence:
  enabled: false
  emptyDirSizeLimit: "2Gi"

fastPreviewCache:
  enabled: true
  sizeLimit: 1Gi

nats:
  enabled: true
  # A debug shell pod and a PDB are both meaningless for a single-replica
  # throwaway NATS, and the PDB actively blocks node drain during autoscaler
  # consolidation.
  natsBox:
    enabled: false
  podDisruptionBudget:
    enabled: false
  container:
    merge:
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          memory: "320Mi"
  config:
    jetstream:
      enabled: true
      memoryStore:
        enabled: true
        maxSize: 256Mi
      # Memory-only: losing streams on restart is irrelevant for a throwaway
      # env, and dropping the PVC makes namespace deletion instant.
      fileStore:
        enabled: false
        pvc:
          enabled: false

# The default value pins `app.kubernetes.io/instance: deco-studio`, which
# matches nothing in a studio-pr-<n> release — it would silently do nothing.
topologySpreadConstraints: []

metrics:
  scrape: false

terminationGracePeriodSeconds: 30

# Every secret comes from one AWS Secrets Manager entry, and DATABASE_URL is
# COMPOSED from it rather than stored — that is what lets each preview point at
# its own pr_<n> database without a password ever being templated into git.
#
# The SM entry holds BETTER_AUTH_SECRET, ENCRYPTION_KEY, the S3/R2 credentials
# and the preview Postgres admin parts (PREVIEW_PG_*). BETTER_AUTH_SECRET and
# ENCRYPTION_KEY must be stable for the life of the environment: a rotating
# auth secret is a login loop, and a rotating encryption key makes every
# vaulted credential undecryptable.
#
# externalSecret.template.data.DATABASE_URL is injected per PR by the
# ApplicationSet (it is the only thing that knows the PR number).
externalSecret:
  enabled: true
  secretPath: preview/studio/application
  # A ClusterSecretStore, because previews create namespaces on the fly and a
  # namespaced SecretStore would need IRSA wired up per namespace.
  secretStoreName: aws-secrets-manager
  secretStoreKind: ClusterSecretStore
  createSecretStore: false

configMap:
  meshConfig:
    NODE_ENV: "production"
    # 20 (the chart default) x 2 API containers x N previews exhausts the
    # shared preview Postgres. Do not raise this without also raising
    # max_connections; PgBouncer is not an option here because DBOS uses
    # prepared statements and advisory locks.
    DATABASE_POOL_MAX: "5"
    # OAuth callbacks cannot be pre-registered for a per-PR hostname, so
    # email/password is the only login path. It is already the default; pinned
    # here so a future default flip does not silently lock previews out.
    AUTH_EMAIL_PASSWORD_ENABLED: "true"
    # Several reviewers behind one office IP trip the auth limiter otherwise.
    DISABLE_RATE_LIMIT: "true"
    # No hosted sandboxes in a preview. Agent dispatch returns 409 link_offline
    # with no local daemon attached — a documented limitation, not a bug.
    STUDIO_SANDBOX_PROVIDER: "user-desktop"
    DISABLE_ORGFS_MOUNTS: "true"
    # Never let a preview provision real gateway keys. STUDIO_PROVISION_SECRET_KEY
    # is deliberately left unset, which is the other half of this gate.
    DECO_AI_GATEWAY_ENABLED: "false"
    RUN_IDLE_TIMEOUT_MS: "120000"
    # Cloudflare R2, same object store the stg deploy uses. All four S3_* must
    # be set or the app downloads and runs its own MinIO at boot; the
    # credentials arrive via the ESO-synced Secret.
    S3_ENDPOINT: "https://c95fc4cec7fc52453228d9db170c372c.r2.cloudflarestorage.com"
    S3_BUCKET: "deco-studio-storage-preview"
    S3_REGION: "auto"
    S3_FORCE_PATH_STYLE: "true"
    # BASE_URL / BETTER_AUTH_URL injected per PR.

# Observability and billing are off. All of these are already false by default;
# stated explicitly so nobody inherits them from a copied production values file.
otel:
  enabled: false
  collector:
    enabled: false
s3Sync:
  enabled: false
dbosConductor:
  enabled: false
clickhouse-operator:
  enabled: false
clickhouse-cluster:
  enabled: false

ingress:
  # Previews route through Gateway API (HTTPRoute). validatePreview rejects
  # enabling both.
  enabled: false
