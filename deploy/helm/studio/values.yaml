# Default values for chart-deco-studio.
# The value below is only considered if autoscaling is disabled.
replicaCount: 1

strategy:
  # type: ""  # Leave empty for auto-detection:
  #   - RollingUpdate: if database.engine=postgresql OR persistence.distributed=true OR accessMode=ReadWriteMany
  #   - Recreate: if SQLite with ReadWriteOnce (default)
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

image:
  repository: ghcr.io/decocms/studio/studio
  pullPolicy: IfNotPresent
  command:
    - bun
    - run
    - deco
    - --no-local-mode

# Optional Ingress in front of the Service. OFF by default: clusters differ in
# controller, class, TLS issuer, and annotations, and deployments that front
# Studio with a LoadBalancer or Gateway API want no Ingress at all.
#
# When enabled, the backend is this release's Service on service.port — you
# don't hardcode the generated name. Set BASE_URL and BETTER_AUTH_URL to the
# same public https:// URL you put in hosts[].host, or auth callbacks break.
#
# Gateway API users: leave this off and create a Gateway + HTTPRoute pointing
# at the same Service (the sandbox preview Gateway is configured separately,
# in the sandbox-env chart).
ingress:
  enabled: false
  # Ingress controller class, e.g. "nginx", "traefik", "alb". Empty → the
  # cluster's default IngressClass.
  className: ""
  # Controller-specific config, e.g. cert-manager's
  # cert-manager.io/cluster-issuer, or nginx body-size/timeout tuning.
  annotations: {}
  # Required when enabled. Studio serves the whole app from the root path,
  # so a single "/" Prefix rule per host is the normal shape.
  hosts: []
  #  - host: studio.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  # TLS is the controller's job. With cert-manager, name a secret that does
  # not exist yet and the issuer annotation above will populate it.
  tls: []
  #  - hosts:
  #      - studio.example.com
  #    secretName: studio-tls

# Per-PR preview releases. Off by default and rendering nothing when disabled,
# so existing releases are unaffected.
#
# A preview is a throwaway environment for one pull request: its own namespace,
# its own Postgres, destroyed together when the release is deleted. Enabling
# this adds an HTTPRoute, a Postgres Deployment + Service, and one migration
# Job; it does NOT change the pod topology, which stays identical to production
# on purpose so previews exercise the same nginx → API serving path.
#
# Pods MUST run with --skip-migrations (image.command) when this is on: the
# migration Job is the single writer. See templates/_helpers.tpl
# validatePreview, which fails the render otherwise.
preview:
  enabled: false
  # PR number. Only used to label/name things; the database is per-namespace.
  prNumber: ""
  # Exact public origin, e.g. pr-42.pr.studio.decocms.com. Must match
  # BASE_URL/BETTER_AUTH_URL: Better Auth's trustedOrigins is a single exact
  # origin with no wildcard support, so a mismatch breaks login with a
  # CSRF-shaped error rather than anything legible.
  host: ""
  # The shared wildcard Gateway the per-PR HTTPRoute attaches to.
  # NOTE: the Gateway's allowedRoutes selector matches on NAMESPACE labels, so
  # whatever creates the namespace must label it (Argo: managedNamespaceMetadata).
  # Without that the HTTPRoute attaches to nothing, silently.
  gateway:
    name: ""
    namespace: istio-gateways
    # Must name a real listener on that Gateway. A sectionName matching no
    # listener attaches the route to nothing, with no error.
    sectionName: https
  # A Postgres that lives and dies with this preview.
  #
  # The alternative — one shared server with per-PR CREATE/DROP DATABASE hook
  # Jobs — needs a server provisioned and paid for while idle, an admin
  # credential distributed to every preview namespace, a connection budget
  # shared across previews, and a sweeper for the databases that outlive their
  # PR. A pod per namespace has none of those: deleting the namespace deletes
  # the database.
  #
  # When enabled and database.url is unset, the chart derives DATABASE_URL
  # itself and publishes it via the ConfigMap.
  postgres:
    enabled: true
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    # Fixed and NOT secret: this Postgres is reachable only from inside the
    # preview's namespace, holds no real data, and dies with the PR. Use a
    # NetworkPolicy to bound reach, not a password.
    auth:
      username: postgres
      password: postgres
      database: postgres
    # emptyDir, not a PVC — nothing here is worth persisting, and PVC
    # finalizers are the most common cause of a namespace that will not finish
    # deleting.
    sizeLimit: 4Gi
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "1Gi"
  # Object storage that lives and dies with the preview, so a preview needs no
  # bucket, no lifecycle rule and no credential from outside the namespace.
  #
  # This is NOT the application's own auto-provisioned MinIO: Studio downloads a
  # MinIO binary at boot when S3_* is unset, which re-downloads on every pod
  # start, puts dl.min.io in the boot path, and assumes a single process — the
  # preview pod runs two API containers.
  minio:
    enabled: true
    image:
      repository: minio/minio
      tag: RELEASE.2025-04-22T22-12-26Z
      pullPolicy: IfNotPresent
    bucket: studio
    # Fixed and NOT secret: reachable only from inside the preview's namespace,
    # holds nothing real, dies with the PR. Use a NetworkPolicy to bound reach,
    # not a password.
    auth:
      accessKey: minioadmin
      secretKey: minioadmin
    # emptyDir. A reviewer uploads next to nothing, and the node disk is shared
    # with the Postgres and data volumes of every other preview on it.
    sizeLimit: 2Gi
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        memory: "768Mi"

  # Re-apply the schema on every pod start, not only when Argo syncs.
  #
  # The preview's Postgres is an emptyDir, so a spot reclaim, a drain or an OOM
  # hands the pod an empty volume. The migration Job is a sync hook and does not
  # re-run — nothing changed in git — so the application comes up against zero
  # tables while every signal says healthy. Turn off only if something else
  # guarantees the schema.
  migrateOnBoot: true

  # Render the preview's namespace as part of the release.
  #
  # Argo's CreateNamespace=true creates a namespace without adopting it: no
  # tracking annotation, never in the Application's resource tree, so a
  # cascading delete leaves it behind. Everything inside is removed correctly,
  # and an empty namespace accumulates for every PR that ever had a preview.
  #
  # Set false when something else owns the namespace.
  manageNamespace: true
  # Labels the namespace carries. The Gateway admits routes by namespace label,
  # so this is what makes the HTTPRoute attach — putting it here means it no
  # longer depends on the Application being created with the matching
  # managedNamespaceMetadata, which is the omission that yields a silent 404.
  namespaceLabels: {}

  # Hosted agent sandboxes for a preview. OFF by default, and it should stay off
  # unless someone is actively testing agent behaviour.
  #
  # Enabling binds this release's ServiceAccount to a Role in a namespace shared
  # with production sandboxes — see templates/preview-sandbox-rbac.yaml for why
  # that cannot currently be narrowed, and what would remove the need.
  #
  # The application also needs the matching STUDIO_SANDBOX_* configuration
  # (provider, runner, template name, preview gateway) pointed at an existing
  # environment; enabling this alone grants permission but changes no behaviour.
  sandbox:
    enabled: false
    # Namespace holding the SandboxTemplates, warm pools and claims.
    namespace: agent-sandbox-system
    # An existing Role in that namespace, owned by the sandbox-env chart.
    roleName: ""

  # Hard deadline for the migration Job. backoffLimit only counts failed pods;
  # a Job that hangs without producing one — missing ConfigMap, missing
  # ServiceAccount — never trips it and blocks the sync operation forever, which
  # in turn blocks teardown and the TTL. Generous: a cold migration measures
  # around 3 minutes, nearly all of it waiting for the image.
  migrateDeadlineSeconds: 900

  # Resources for the short-lived migration Job.
  jobResources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      memory: "1Gi"

# ServiceAccount for the API and worker pods. Undocumented until now, though the
# templates have always honoured it — and the sandbox layer depends on it: the
# sandbox-env chart grants claim/port-forward RBAC to a NAMED service account,
# so leaving Studio on `default` yields 403 "cannot create sandboxclaims".
# Set create: true with a name matching sandbox-env's mesh.serviceAccountName.
serviceAccount:
  # Renders the ServiceAccount and runs the pods as it.
  create: false
  # Empty + create: true → the release fullname. Empty + create: false → `default`.
  name: ""
  annotations: {}
  automount: true

service:
  type: ClusterIP
  port: 80
  # Same-zone endpoint preference (kube-proxy topology hints) to cut cross-zone
  # traffic. Empty → field omitted (REQUIRED on k8s < 1.31, where it's rejected).
  # Set "PreferClose" on k8s >= 1.31. Best-effort: needs pods spread across zones
  # to take effect; falls back to all endpoints otherwise.
  trafficDistribution: ""

# Prometheus scraping of the app's /metrics endpoint (HTTP request-duration
# histogram, event-loop delay, runtime metrics). Adds prometheus.io/* pod
# annotations for vmagent's kubernetes-pods job. Disable if your cluster uses
# ServiceMonitor CRDs or doesn't scrape pods by annotation.
metrics:
  scrape: true
  path: /metrics

resources:
  requests:
    cpu: "750m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "1Gi"

database:
  engine: postgresql # postgresql required for split API/worker pods
  url: ""        # Required when engine=postgresql
  caCert: ""     # Optional: Specify existing CA certificate in PEM format

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  # Empty uses the cluster's default StorageClass (portable across local/kind/
  # Rancher and managed clusters). Set explicitly (e.g. "gp3" on AWS, "efs" for
  # ReadWriteMany) when you need a specific provisioner.
  storageClass: ""
  size: 10Gi
  claimName: ""  # Optional: Specify existing PVC name
  distributed: false  # Mark as true if storage offers ReadWriteMany
  emptyDirSizeLimit: "10Gi"  # Cap for the emptyDir volume when persistence.enabled=false. Prevents a single pod from exhausting node ephemeral-storage.

# Disk cache for the sandbox-less decofile read path (see
# apps/api/src/decofile/disk-cache-spec.md §Deploy). A dedicated emptyDir walls
# the cache off the node's root filesystem; keep sizeLimit comfortably ABOVE
# the app's own byte budget (FAST_PREVIEW_CACHE_MAX_BYTES, default 2GiB — the app
# evicts at that budget, so the kubelet's pod-eviction enforcement at
# sizeLimit stays dormant). Disabling removes the volume AND the env var, so
# the app falls back to caching under the container's tmpdir — set
# FAST_PREVIEW_CACHE_DIR: "" in configMap.meshConfig to turn caching off entirely.
fastPreviewCache:
  enabled: true
  mountPath: /app/fast-preview-cache
  sizeLimit: 4Gi

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

worker:
  # Worker Deployment for agent/automation run queues. The main Deployment is
  # API-only behind nginx, so workers are required to dequeue runs. Workers carry
  # a distinct `app.kubernetes.io/name` (`<name>-worker`), so the main Service
  # selector does not match them.
  # When true, render a second Deployment (`<fullname>-worker`) that dequeues
  # only the agent/automation run queues (STUDIO_DISPATCH_ROLE=worker). Required
  # because the main Deployment now runs API-only containers behind nginx.
  enabled: true
  replicaCount: 2
  # Workers are CPU-bound on LLM streams — give headroom and scale on CPU.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1.5"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 30
    targetCPUUtilizationPercentage: 65
  # Stamp `karpenter.sh/do-not-disrupt: "true"` on worker pods so Karpenter does
  # not consolidate/drift-evict a worker mid-run (see worker-deployment.yaml).
  # Default on; set false where Karpenter isn't the node provisioner. (A
  # PodDisruptionBudget for forced/involuntary eviction is deployed alongside,
  # in the deco-apps-cd wrapper chart, next to the existing Studio PDB.)
  doNotDisrupt: true
  # Extra env for worker pods only (merged after the shared envFrom).
  env: []

nginx:
  image:
    repository: ghcr.io/decocms/studio/studio-nginx
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  preStopSleepSeconds: 15
  # Labels stamped onto the combo (nginx + API) pods so a front-door
  # LoadBalancer (e.g. the deco-apps-cd NLB) can select them by a stable label
  # instead of app.kubernetes.io/name. Applied to the combo deployment ONLY
  # (never the worker), so the raw-API worker is never registered as a public
  # target. Empty by default; set e.g. { decocms.com/frontdoor: "true" }.
  frontDoorLabels: {}

configMap:
  # DEPRECATED NAME — retained as a values-API compatibility surface for
  # existing releases. These are Studio API settings; a future chart major may
  # rename this key to `studioConfig`.
  meshConfig:
    NODE_ENV: "production"
    PORT: "3000"
    HOST: "0.0.0.0"
    BETTER_AUTH_URL: "http://localhost:8080"
    BASE_URL: "http://localhost:8080"
    DATA_DIR: "/app/data"
    # NATS_URL: ""  # Optional: overrides auto-derived URL when nats.enabled=true (e.g. nats://my-nats:4222)
    DATABASE_POOL_MAX: "20"
    DECO_AI_GATEWAY_ENABLED: "false"

secret:
  # secretName: ""  # If defined, uses this existing secret (does not create new secret)
  # Generate secret with the following command: openssl rand -base64 32
  BETTER_AUTH_SECRET: "define_your_secret_with_command_above"
  # ENCRYPTION_KEY for CredentialVault (AES-256-GCM).
  # Empty string "" is valid — derives key via SHA-256("").
  # If omitted, the server auto-generates a random key on each boot (breaks across restarts).
  # Generate with: openssl rand -base64 32
  ENCRYPTION_KEY: ""
  # Optional: required for the public NATS link tunnel when using the
  # chart-managed Secret. Prefer secret.secretName or externalSecret for
  # production GitOps so these values are not stored in plain values files.
  # NATS_ACCOUNT_JWT: ""
  # NATS_ACCOUNT_SIGNING_KEY: ""
  # NATS_OPERATOR_JWT: ""
  # NATS_CLUSTER_CREDS: ""

# ExternalSecret — pull all values from AWS Secrets Manager via external-secrets operator.
# When enabled, creates a namespace-scoped SecretStore and an ExternalSecret using dataFrom
# so every key in the SM JSON becomes an env var automatically.
# Requires: external-secrets operator installed on the cluster.
# Incompatible with: secret.secretName (both reference the same target Secret name).
externalSecret:
  enabled: false
  # secretPath: ""  # Required when enabled. SM secret key path.
  secretStoreName: "aws-secrets-manager"
  # SecretStore (namespaced) or ClusterSecretStore. A namespaced store needs
  # per-namespace IRSA, so a deploy that creates namespaces on the fly (per-PR
  # previews) wants a pre-existing ClusterSecretStore instead.
  secretStoreKind: "SecretStore"
  # Render the SecretStore above. Set false to reference a store someone else
  # owns — required when secretStoreKind is ClusterSecretStore, since a cluster
  # store must not be created once per release.
  createSecretStore: true
  refreshInterval: "1h"
  provider:
    aws:
      region: "sa-east-1"
  # Optional ESO target template — derive extra keys from the fetched secret
  # instead of storing them. The canonical use is composing a connection string
  # whose parts live in the secret store but whose database name is per-release
  # (per-PR previews), so the password never has to be templated into git.
  #
  #   template:
  #     data:
  #       DATABASE_URL: "postgresql://{{ .PGUSER }}:{{ .PGPASSWORD }}@{{ .PGHOST }}:5432/pr_42?sslmode=require"
  #
  # The {{ }} above are ESO's, evaluated against the fetched secret's keys — NOT
  # Helm's. Values are data, so Helm passes them through untouched; a caller
  # that is ITSELF a Go template (an Argo ApplicationSet) must escape them.
  #
  # mergePolicy defaults to Merge, not ESO's Replace default: with Replace, a
  # template that adds one key silently discards every key dataFrom pulled in.
  template: {}

volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

extraContainers: []
# - name: cloudsql-proxy
#   image: gcr.io/cloudsql-docker/gce-proxy:1.33.1
#   args:
#     - "/cloud_sql_proxy"
#     - "-instances=PROJECT:REGION:INSTANCE=tcp:5432"

volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 4

terminationGracePeriodSeconds: 120

# Optional lifecycle hooks (preStop, postStart)
# lifecycle: {}

# Empty by default so pods schedule on any node arch. Published images are
# multi-arch (amd64 + arm64), so this works on Apple Silicon and arm64 nodes
# out of the box. Pin an arch only when your cluster requires it,
# e.g. { kubernetes.io/arch: amd64 }.
nodeSelector: {}

tolerations: []
# Example:
# tolerations:
#   - key: "env"
#     operator: "Equal"
#     value: "dev"
#     effect: "NoSchedule"

affinity: {}
# Example:
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchLabels:
#               app.kubernetes.io/name: chart-deco-studio
#           topologyKey: kubernetes.io/hostname

# Topology Spread Constraints (optional - leave empty [] to disable)
# IMPORTANT: labelSelector is required when topologySpreadConstraints is configured
#topologySpreadConstraints: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: chart-deco-studio
        app.kubernetes.io/instance: deco-studio

# OpenTelemetry configuration (optional)
otel:
  enabled: false
  protocol: "http/protobuf"  # http/protobuf | grpc
  service: ""                # OTEL_SERVICE_NAME
  endpoint: ""               # Remote OTLP endpoint (direct export, bypasses collector)
  # When otel.endpoint is set, the app sends directly to this endpoint
  # and headers are passed as OTEL_EXPORTER_OTLP_HEADERS.
  # When otel.endpoint is empty and otel.collector.enabled is true,
  # the app sends to the in-cluster collector which handles forwarding.
  # In that case, configure the remote endpoint in the collector config
  # (opentelemetry-collector.config.exporters) instead.
  headers: {}                # OTEL_EXPORTER_OTLP_HEADERS (key=value format)
  # headers:
  #   authorization: "Bearer your-token"
  #   x-custom-header: "value"
  attributes: {}             # OTEL_RESOURCE_ATTRIBUTES (key=value format)
  # attributes:
  #   deployment.environment: "production"
  #   service.namespace: "my-namespace"

  # Shared OTel Collector (namespace-level Deployment via subchart)
  # When enabled, app exports to http://<release>-opentelemetry-collector:4318
  # unless overridden via otel.endpoint
  collector:
    enabled: false

# S3 file sync sidecar — syncs /app/data/{logs,traces,metrics} to S3
# Uses inotify + curl (AWS SigV4) for event-driven upload with minimal memory
s3Sync:
  enabled: false
  image:
    repository: ghcr.io/decocms/studio/s3-sync
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  bucket: ""               # Required when enabled
  region: "us-east-1"
  prefix: ""               # S3 key prefix (e.g. "studio/production")
  interval: 60             # Safety-net poll interval in seconds
  roleArn: ""              # IRSA role ARN — adds eks.amazonaws.com/role-arn to ServiceAccount
  syncDirs:                # Directories under /app/data to sync
    - logs
    - traces
    - metrics
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "32Mi"

# NATS subchart (https://artifacthub.io/packages/helm/nats/nats)
# When enabled, NATS_URL is automatically set to nats://<release-name>-nats:4222
# unless overridden via configMap.meshConfig.NATS_URL
tunnel:
  nats:
    publicUrl: "" # e.g. wss://nats.example.com
    publicEnabled: false
    sessionTtlSeconds: 900
    clusterCreds:
      # Enable when NATS runs in operator/JWT mode and Studio's internal
      # NATS_URL connection must authenticate with a creds file.
      enabled: false
      # Empty defaults to the same Secret consumed by Studio envFrom
      # (secret.secretName, externalSecret target, or the chart-managed Secret).
      secretName: ""
      secretKey: "NATS_CLUSTER_CREDS"
      mountDir: "/etc/nats-creds"
      fileName: "cluster.creds"

nats:
  enabled: true
  # Native NATS websocket/ingress settings belong to the NATS subchart under
  # nats.config.websocket and nats.config.websocket.ingress. This chart does
  # not enable them by default and Helm cannot derive subchart websocket values
  # from tunnel.nats.*; set both sections explicitly when exposing a public
  # tunnel.
  config:
    jetstream:
      enabled: true
      memoryStore:
        enabled: true
        maxSize: 1Gi
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
          storageClassName: ""  # empty = use cluster default StorageClass

# In-cluster ClickHouse (optional) — backs the monitoring dashboard when you
# don't use ClickHouse Cloud. Two independent subcharts (official, same repo,
# keep versions in lockstep):
#   clickhouse-operator — the operator Deployment + CRDs. Enable only if the
#     cluster doesn't already run the ClickHouse operator. Webhooks require
#     cert-manager; without it set certManager.enabled=false and
#     webhook.enabled=false.
#   clickhouse-cluster  — renders the ClickHouseCluster (+ optional
#     KeeperCluster) CRs. Needs the operator (embedded or pre-existing).
# When the CR is enabled, CLICKHOUSE_URL is auto-derived to
# http://<cr-name>-clickhouse-headless:8123 unless set in
# configMap.meshConfig or in the Secret (Secret wins — use it for an
# authenticated URL, see examples/values-clickhouse.yaml).
# The dashboard reads the studio_monitoring_logs VIEW — provision it once
# (apps/api/src/monitoring/clickhouse-setup.md).
clickhouse-operator:
  enabled: false
  controller:
    # REQUIRED when enabled: the namespace this release installs into, so the
    # embedded operator only watches Studio's namespace (validated at render
    # time; the upstream chart can't derive it from the release). For a
    # cluster-wide operator, install clickhouse-operator-helm separately.
    watchNamespaces: []

clickhouse-cluster:
  enabled: false
  clickhouse:
    # clickhouse.enabled (subchart, default true) controls the CR itself.
    # clickhouse.spec is passed verbatim to ClickHouseCluster.spec — any CRD
    # field can be set here (settings, podTemplate, keeperClusterRef, ...).
    # WARNING: raising replicas/shards does NOT replicate/distribute the data
    # by itself — the table DDL must change in lockstep (ReplicatedMergeTree /
    # Distributed). See "Scaling beyond a single node" in
    # apps/api/src/monitoring/clickhouse-setup.md.
    spec:
      replicas: 1
      shards: 1
      dataVolumeClaimSpec:
        resources:
          requests:
            storage: 50Gi
  keeper:
    # ClickHouseCluster.spec.keeperClusterRef is REQUIRED by the CRD, so a
    # Keeper always runs (the subchart auto-wires the ref). 1 replica matches
    # the single-node default; use 3 when raising clickhouse.spec.replicas.
    spec:
      replicas: 1
      dataVolumeClaimSpec:
        resources:
          requests:
            storage: 5Gi

# DBOS Conductor — opt-in management service for DBOS workflows.
# https://docs.dbos.dev/production/conductor
# When enabled, the app dials wss:// to the conductor URL for workflow
# recovery, observability, and retention. Disconnects don't affect the
# request path. Requires outbound egress to the conductor URL.
dbosConductor:
  enabled: false
  # Inline API key — written into the chart-managed Secret as DBOS_CONDUCTOR_KEY.
  # Leave empty when supplying the key via existingSecret.
  key: ""
  # Optional WS URL override. SDK default: wss://cloud.dbos.dev/conductor/v1alpha1
  url: ""
  # Pre-existing Secret with the conductor key. When set, the chart skips
  # writing the key and references this Secret instead. Mutually exclusive
  # with `key`.
  existingSecret: ""
  existingSecretKey: "DBOS_CONDUCTOR_KEY"

# Additional environment variables (merged with existing envs)
env: []
# env:
#   - name: MY_CUSTOM_VAR
#     value: "my-value"
#   - name: MY_SECRET_VAR
#     valueFrom:
#       secretKeyRef:
#         name: my-secret
#         key: my-key

# OpenTelemetry Collector subchart configuration
# See: https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector
# NOTE: mode is required (the chart has no default). Helm lists are NOT merged —
# if you override config.service.pipelines, you must specify all pipelines.
# To scale: set opentelemetry-collector.replicaCount or configure autoscaling.
opentelemetry-collector:
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
  podSecurityContext:
    fsGroup: 1001
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    behavior: {}
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    additionalMetrics: []
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s
    exporters:
      debug:
        verbosity: basic
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
