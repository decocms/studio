# Default values for chart-deco-studio.
# The value below is only considered if autoscaling is disabled.
replicaCount: 1

strategy:
  # type: ""  # Leave empty for auto-detection:
  #   - RollingUpdate: if database.engine=postgresql OR persistence.distributed=true OR accessMode=ReadWriteMany
  #   - Recreate: if SQLite with ReadWriteOnce (default)
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

image:
  repository: ghcr.io/decocms/studio/studio
  pullPolicy: IfNotPresent
  command:
    - bun
    - run
    - deco
    - --no-local-mode

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  # Same-zone endpoint preference (kube-proxy topology hints) to cut cross-zone
  # traffic. Empty → field omitted (REQUIRED on k8s < 1.31, where it's rejected).
  # Set "PreferClose" on k8s >= 1.31. Best-effort: needs pods spread across zones
  # to take effect; falls back to all endpoints otherwise.
  trafficDistribution: ""

# Prometheus scraping of the app's /metrics endpoint (HTTP request-duration
# histogram, event-loop delay, runtime metrics). Adds prometheus.io/* pod
# annotations for vmagent's kubernetes-pods job. Disable if your cluster uses
# ServiceMonitor CRDs or doesn't scrape pods by annotation.
metrics:
  scrape: true
  path: /metrics

resources:
  requests:
    memory: "2Gi"
    cpu: "2000m"
  limits:
    memory: "2Gi"

database:
  engine: sqlite # sqlite | postgresql
  url: ""        # Required when engine=postgresql
  caCert: ""     # Optional: Specify existing CA certificate in PEM format

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  storageClass: "gp3"  # Empty string applies default storage class.
  size: 10Gi
  claimName: ""  # Optional: Specify existing PVC name
  distributed: false  # Mark as true if storage offers ReadWriteMany
  emptyDirSizeLimit: "10Gi"  # Cap for the emptyDir volume when persistence.enabled=false. Prevents a single pod from exhausting node ephemeral-storage.

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod dispatch-role split (see apps/mesh MESH_DISPATCH_ROLE). One release, one
# Argo app: the main Deployment serves HTTP; an optional `worker` Deployment
# runs the agent loop. Workers carry a distinct `app.kubernetes.io/name`
# (`<name>-worker`), so the main Deployment selector AND the Service selector
# do NOT match them — workers stay OFF the load balancer and receive work only
# by pulling the DBOS queue. /stream is served by the (api) main pods, which
# tail NATS for chunks the workers published. Health probes hit pods directly,
# so workers stay live regardless of Service membership.
#
# Rollout: set worker.enabled=true first (workers come up; main is still "all"
# so nothing breaks), confirm workers dequeue, THEN set dispatchRole=api so the
# main pods stop running the agent loop. Rollback = unset both.
#
# dispatchRole controls the MAIN deployment's MESH_DISPATCH_ROLE.
#   "" (default) → unset → "all" (unchanged behavior). Set to "api" once
#   workers exist so HTTP pods stop dequeuing runs. Env-only update (rolling,
#   no recreate); does NOT touch the immutable selector.
dispatchRole: ""

worker:
  # When true, render a second Deployment (`<fullname>-worker`) that dequeues
  # only the agent/automation run queues (MESH_DISPATCH_ROLE=worker). Default
  # false → chart output is identical to before.
  enabled: false
  replicaCount: 2
  # Workers are CPU-bound on LLM streams — give headroom and scale on CPU.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 30
    targetCPUUtilizationPercentage: 65
  # Extra env for worker pods only (merged after the shared envFrom).
  env: []

# Static-SPA + reverse-proxy split (the "web" role). When enabled, renders an
# nginx Deployment + Service (`<fullname>-web`) that serves the prebuilt client
# bundle and reverse-proxies API/system paths to the main Service (same origin).
# Cut over by pointing the external gateway/NLB at the web Service. Default
# false → chart output is unchanged. See deploy/nginx/README.md.
#
# No separate web image: an initContainer copies the bundle out of the mesh
# image (already on the studio nodes), and nginx is the stock image with its
# config mounted from a ConfigMap.
web:
  enabled: false
  replicaCount: 2
  # Mesh image to extract the SPA bundle from. Empty repository/tag → inherit the
  # API image (image.repository / image.tag). Pin tag separately to roll the UI
  # independently of the API.
  bundleImage:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  # Path of the built bundle inside the mesh image (where `bun add decocms`
  # installs it).
  bundlePath: /app/apps/mesh/node_modules/decocms/dist/client
  # Numeric uid of the mesh image (its USER is the non-numeric "bunuser", which
  # kubelet can't verify against runAsNonRoot). Pins the bundle initContainer.
  bundleRunAsUser: 1001
  # Stock nginx that serves the bundle + reverse-proxies. The unprivileged
  # variant listens on 8080 and runs as uid 101 (non-root) out of the box.
  nginxImage: nginxinc/nginx-unprivileged:1.27-alpine
  nginxImagePullPolicy: IfNotPresent
  # nginx access log → stdout. Set false to disable (e.g. when an edge/CDN +
  # app OTel already capture requests). /healthz is never logged either way.
  accessLog: true
  # host:port of the API (main) Service. Empty → in-namespace main Service.
  # Set to an FQDN (<svc>.<ns>.svc.cluster.local:80) for cross-namespace.
  apiUpstream: ""
  # Front-door pod labels for blue-green LB retargeting. When non-empty, these
  # labels sit on the API pods while web.enabled=false and move to the nginx
  # pods when web.enabled=true. Point your external LB/NLB selector at them
  # ONCE; then cutover/rollback is just flipping web.enabled. Flipping rolls the
  # pods that gain/lose the label once. Default {} → no labels, output unchanged.
  frontDoorLabels: {}
  #   decocms.com/frontdoor: "true"
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      memory: "128Mi"
  # fsGroup so the initContainer (mesh image, uid 1001) can write the shared
  # emptyDir; nginx (uid 101) reads the world-readable bundle files.
  podSecurityContext:
    fsGroup: 1001
  # No runAsUser → the nginx image's uid 101 / mesh image's uid 1001 stand.
  # readOnlyRootFilesystem stays off so nginx can write its cache/pid + the
  # envsubst'd config.
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  # Empty → the template defaults to a SOFT podAffinity preferring nodes that
  # already run API pods, so the (large) mesh image pulled by the bundle
  # initContainer is cache-warm. Set to override (or to {} via --set to keep the
  # default; set a non-empty affinity to replace it entirely).
  affinity: {}
  # Empty → the template defaults to a SOFT zone spread (maxSkew 1,
  # ScheduleAnyway) so same-zone routing has a web endpoint per zone. Override
  # with your own constraints.
  topologySpreadConstraints: []

configMap:
  meshConfig:
    NODE_ENV: "production"
    PORT: "3000"
    HOST: "0.0.0.0"
    BETTER_AUTH_URL: "http://localhost:8080"
    BASE_URL: "http://localhost:8080"
    DATA_DIR: "/app/data"
    # NATS_URL: ""  # Optional: overrides auto-derived URL when nats.enabled=true (e.g. nats://my-nats:4222)
    DATABASE_POOL_MAX: "20"
    DECO_AI_GATEWAY_ENABLED: "false"

secret:
  # secretName: ""  # If defined, uses this existing secret (does not create new secret)
  # Generate secret with the following command: openssl rand -base64 32
  BETTER_AUTH_SECRET: "define_your_secret_with_command_above"
  # ENCRYPTION_KEY for CredentialVault (AES-256-GCM).
  # Empty string "" is valid — derives key via SHA-256("").
  # If omitted, the server auto-generates a random key on each boot (breaks across restarts).
  # Generate with: openssl rand -base64 32
  ENCRYPTION_KEY: ""

# ExternalSecret — pull all values from AWS Secrets Manager via external-secrets operator.
# When enabled, creates a namespace-scoped SecretStore and an ExternalSecret using dataFrom
# so every key in the SM JSON becomes an env var automatically.
# Requires: external-secrets operator installed on the cluster.
# Incompatible with: secret.secretName (both reference the same target Secret name).
externalSecret:
  enabled: false
  # secretPath: ""  # Required when enabled. SM secret key path.
  secretStoreName: "aws-secrets-manager"
  refreshInterval: "1h"
  provider:
    aws:
      region: "sa-east-1"

volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

extraContainers: []
# - name: cloudsql-proxy
#   image: gcr.io/cloudsql-docker/gce-proxy:1.33.1
#   args:
#     - "/cloud_sql_proxy"
#     - "-instances=PROJECT:REGION:INSTANCE=tcp:5432"

volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 4

terminationGracePeriodSeconds: 120

# Optional lifecycle hooks (preStop, postStart)
# lifecycle: {}

nodeSelector:
  kubernetes.io/arch: amd64

tolerations: []
# Example:
# tolerations:
#   - key: "env"
#     operator: "Equal"
#     value: "dev"
#     effect: "NoSchedule"

affinity: {}
# Example:
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchLabels:
#               app.kubernetes.io/name: chart-deco-studio
#           topologyKey: kubernetes.io/hostname

# Topology Spread Constraints (optional - leave empty [] to disable)
# IMPORTANT: labelSelector is required when topologySpreadConstraints is configured
#topologySpreadConstraints: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: chart-deco-studio
        app.kubernetes.io/instance: deco-studio

# OpenTelemetry configuration (optional)
otel:
  enabled: false
  protocol: "http/protobuf"  # http/protobuf | grpc
  service: ""                # OTEL_SERVICE_NAME
  endpoint: ""               # Remote OTLP endpoint (direct export, bypasses collector)
  # When otel.endpoint is set, the app sends directly to this endpoint
  # and headers are passed as OTEL_EXPORTER_OTLP_HEADERS.
  # When otel.endpoint is empty and otel.collector.enabled is true,
  # the app sends to the in-cluster collector which handles forwarding.
  # In that case, configure the remote endpoint in the collector config
  # (opentelemetry-collector.config.exporters) instead.
  headers: {}                # OTEL_EXPORTER_OTLP_HEADERS (key=value format)
  # headers:
  #   authorization: "Bearer your-token"
  #   x-custom-header: "value"
  attributes: {}             # OTEL_RESOURCE_ATTRIBUTES (key=value format)
  # attributes:
  #   deployment.environment: "production"
  #   service.namespace: "my-namespace"

  # Shared OTel Collector (namespace-level Deployment via subchart)
  # When enabled, app exports to http://<release>-opentelemetry-collector:4318
  # unless overridden via otel.endpoint
  collector:
    enabled: false

# S3 file sync sidecar — syncs /app/data/{logs,traces,metrics} to S3
# Uses inotify + curl (AWS SigV4) for event-driven upload with minimal memory
s3Sync:
  enabled: false
  image:
    repository: ghcr.io/decocms/studio/s3-sync
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  bucket: ""               # Required when enabled
  region: "us-east-1"
  prefix: ""               # S3 key prefix (e.g. "studio/production")
  interval: 60             # Safety-net poll interval in seconds
  roleArn: ""              # IRSA role ARN — adds eks.amazonaws.com/role-arn to ServiceAccount
  syncDirs:                # Directories under /app/data to sync
    - logs
    - traces
    - metrics
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "32Mi"

# NATS subchart (https://artifacthub.io/packages/helm/nats/nats)
# When enabled, NATS_URL is automatically set to nats://<release-name>-nats:4222
# unless overridden via configMap.meshConfig.NATS_URL
tunnel:
  nats:
    publicUrl: "" # e.g. wss://nats.example.com
    publicEnabled: false
    sessionTtlSeconds: 900

nats:
  enabled: true
  # Native NATS websocket/ingress settings belong to the NATS subchart under
  # nats.config.websocket and nats.config.websocket.ingress. This chart does
  # not enable them by default and Helm cannot derive subchart websocket values
  # from tunnel.nats.*; set both sections explicitly when exposing a public
  # tunnel.
  config:
    jetstream:
      enabled: true
      memoryStore:
        enabled: true
        maxSize: 1Gi
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
          storageClassName: ""  # empty = use cluster default StorageClass

# DBOS Conductor — opt-in management service for DBOS workflows.
# https://docs.dbos.dev/production/conductor
# When enabled, the app dials wss:// to the conductor URL for workflow
# recovery, observability, and retention. Disconnects don't affect the
# request path. Requires outbound egress to the conductor URL.
dbosConductor:
  enabled: false
  # Inline API key — written into the chart-managed Secret as DBOS_CONDUCTOR_KEY.
  # Leave empty when supplying the key via existingSecret.
  key: ""
  # Optional WS URL override. SDK default: wss://cloud.dbos.dev/conductor/v1alpha1
  url: ""
  # Pre-existing Secret with the conductor key. When set, the chart skips
  # writing the key and references this Secret instead. Mutually exclusive
  # with `key`.
  existingSecret: ""
  existingSecretKey: "DBOS_CONDUCTOR_KEY"

# Additional environment variables (merged with existing envs)
env: []
# env:
#   - name: MY_CUSTOM_VAR
#     value: "my-value"
#   - name: MY_SECRET_VAR
#     valueFrom:
#       secretKeyRef:
#         name: my-secret
#         key: my-key

# OpenTelemetry Collector subchart configuration
# See: https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector
# NOTE: mode is required (the chart has no default). Helm lists are NOT merged —
# if you override config.service.pipelines, you must specify all pipelines.
# To scale: set opentelemetry-collector.replicaCount or configure autoscaling.
opentelemetry-collector:
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
  podSecurityContext:
    fsGroup: 1001
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    behavior: {}
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    additionalMetrics: []
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s
    exporters:
      debug:
        verbosity: basic
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
