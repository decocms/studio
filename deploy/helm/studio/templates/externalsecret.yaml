{{- if .Values.externalSecret.enabled }}
{{- if .Values.externalSecret.createSecretStore }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.secretStoreName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.provider.aws.region }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
  {{- if .Values.preview.enabled }}
  annotations:
    # Ahead of everything that mounts it: the migrate Job (-10) and the app
    # Deployments (0) both consume this Secret via envFrom, and a missing
    # secretRef stops a pod from starting at all.
    argocd.argoproj.io/sync-wave: "-30"
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind }}
  target:
    name: {{ include "chart-deco-studio.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- with .Values.externalSecret.template }}
    template:
      # Merge, not ESO's Replace default — Replace would drop every dataFrom key.
      mergePolicy: {{ .mergePolicy | default "Merge" }}
      {{- with .engineVersion }}
      engineVersion: {{ . }}
      {{- end }}
      {{- with .metadata }}
      metadata:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .data }}
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretPath }}
{{- end }}
