{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.secretStoreName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.provider.aws.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
  {{- if .Values.preview.enabled }}
  annotations:
    # In preview mode this Secret is read by the PreSync provision/migrate Jobs
    # (it carries the Postgres admin URL and the composed per-PR DATABASE_URL),
    # so it has to exist BEFORE the Sync phase. A plain sync-wave cannot express
    # that — PreSync runs entirely ahead of every Sync resource — so the
    # ExternalSecret joins the PreSync phase at a weight below both Jobs.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-20"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ include "chart-deco-studio.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- with .Values.externalSecret.template }}
    template:
      # Merge, not ESO's Replace default — Replace would drop every dataFrom key.
      mergePolicy: {{ .mergePolicy | default "Merge" }}
      {{- with .engineVersion }}
      engineVersion: {{ . }}
      {{- end }}
      {{- with .metadata }}
      metadata:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .data }}
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretPath }}
{{- end }}
