{{- if .Values.preview.enabled }}
{{- /*
Gateway API route for a per-PR preview, attaching to a SHARED wildcard Gateway
(one DNS record, one cert) rather than provisioning per-host TLS.

The Gateway's allowedRoutes selector matches on NAMESPACE labels, so whatever
creates this namespace must label it — with Argo CD that means
syncPolicy.managedNamespaceMetadata. Without the label this route attaches to
nothing and reports no error.

The `ingress` values block is the wrong tool here and says so; validatePreview
rejects enabling both.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.preview.gateway.name }}
      namespace: {{ .Values.preview.gateway.namespace }}
      {{- with .Values.preview.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ .Values.preview.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "chart-deco-studio.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
