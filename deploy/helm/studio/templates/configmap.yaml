apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}-config
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
  {{- if .Values.preview.enabled }}
  annotations:
    # Same wave as the ExternalSecret, and for the same reason: the migrate Job
    # (-10) and the app Deployments (0) both take this via envFrom, and a
    # missing configMapRef leaves the container in CreateContainerConfigError —
    # which stalls the whole sync on the hook, with no error on the object
    # itself. Only a real sync surfaces this; `helm template` cannot.
    argocd.argoproj.io/sync-wave: "-30"
  {{- end }}
data:
  {{- toYaml .Values.configMap.meshConfig | nindent 2 }}
  {{- $autoNatsUrl := "" }}
  {{- if .Values.nats.enabled }}
  {{- $autoNatsUrl = printf "nats://%s-nats:4222" .Release.Name }}
  {{- end }}
  {{- $natsUrl := .Values.configMap.meshConfig.NATS_URL | default $autoNatsUrl }}
  {{- if and $natsUrl (not (hasKey .Values.configMap.meshConfig "NATS_URL")) }}
  NATS_URL: {{ $natsUrl | quote }}
  {{- end }}
  {{- /* Auto-derive CLICKHOUSE_URL from the embedded ClickHouseCluster. An
  explicit value in meshConfig or in the Secret (envFrom lists the Secret
  last, so it wins) takes precedence — use the Secret for authenticated URLs. */}}
  {{- if and (eq (include "chart-deco-studio.clickhouseEnabled" .) "true") (not (hasKey .Values.configMap.meshConfig "CLICKHOUSE_URL")) }}
  CLICKHOUSE_URL: {{ printf "http://%s-clickhouse-headless:8123" (include "chart-deco-studio.clickhouseCrName" .) | quote }}
  {{- end }}
  {{- if .Values.tunnel.nats.publicUrl }}
  NATS_PUBLIC_URL: {{ .Values.tunnel.nats.publicUrl | quote }}
  {{- end }}
  NATS_TUNNEL_PUBLIC_ENABLED: {{ .Values.tunnel.nats.publicEnabled | quote }}
  NATS_TUNNEL_SESSION_TTL_SECONDS: {{ .Values.tunnel.nats.sessionTtlSeconds | quote }}
  {{- if or (ne (lower (default "sqlite" .Values.database.engine)) "postgresql") (eq (include "chart-deco-studio.previewPostgresProvidesUrl" . | trim) "true") }}
  DATABASE_URL: {{ include "chart-deco-studio.databaseUrl" . | trim | quote }}
  {{- end }}
  {{- /* Derive object storage from the preview's own in-namespace MinIO. All
  four S3_* plus both credentials must be present together — with any of them
  missing the application falls back to downloading and running its own MinIO
  binary, which is the failure this exists to avoid. They are ConfigMap and not
  Secret for the same reason DATABASE_URL is: they address an ephemeral pod
  reachable only from this namespace. An explicit meshConfig value wins, so a
  preview can still be pointed at a real bucket. */}}
  {{- if and (eq (include "chart-deco-studio.previewMinioProvidesStorage" . | trim) "true") (not (hasKey .Values.configMap.meshConfig "S3_ENDPOINT")) }}
  S3_ENDPOINT: {{ printf "http://%s:9000" (include "chart-deco-studio.previewMinioName" .) | quote }}
  S3_BUCKET: {{ .Values.preview.minio.bucket | quote }}
  S3_REGION: "us-east-1"
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: {{ .Values.preview.minio.auth.accessKey | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.preview.minio.auth.secretKey | quote }}
  {{- end }}
