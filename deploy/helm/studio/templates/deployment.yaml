apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ include "chart-deco-studio.deploymentStrategy" . }}
    {{- $strategyType := include "chart-deco-studio.deploymentStrategy" . }}
    {{- if eq $strategyType "RollingUpdate" }}
    rollingUpdate:
      {{- if and .Values.strategy .Values.strategy.rollingUpdate }}
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
      {{- else }}
      maxSurge: 1
      maxUnavailable: 0
      {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "chart-deco-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.metrics.scrape .Values.podAnnotations }}
      annotations:
        {{- if .Values.metrics.scrape }}
        # Annotation-based discovery: vmagent's kubernetes-pods job scrapes the
        # nginx proxies /metrics to the API containers; scrape the service-facing
        # http port so annotation discovery follows the front door.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "chart-deco-studio.podLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Front-door selector label(s) for the NLB. Applied to the combo
        # (nginx + API) pods ONLY — deliberately NOT in worker-deployment.yaml —
        # so labelling the front door never registers the worker as a public
        # NLB target. See nginx.frontDoorLabels in values.yaml.
        {{- with .Values.nginx.frontDoorLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart-deco-studio.serviceAccountName" . }}
      securityContext:
        {{- include "chart-deco-studio.podSecurityContext" . | nindent 8 }}
      containers:
        # The front-door / web tier. Runs the nginx image (serves the SPA +
        # proxies to the API sidecars); named "-web" for the user-facing web
        # tier rather than the implementation (nginx).
        - name: {{ .Chart.Name }}-web
          {{- with .Values.nginx.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.nginx.image.repository }}{{- if and .Values.nginx.image.tag (hasPrefix "sha256:" .Values.nginx.image.tag) }}@{{ .Values.nginx.image.tag }}{{- else }}:{{ .Values.nginx.image.tag | default .Chart.AppVersion }}{{- end }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              # Keep the listener open while external load balancers remove the
              # terminating pod from their targets. After the hook completes,
              # the nginx image's STOPSIGNAL (SIGQUIT) drains open connections.
              exec:
                command: ["sleep", "{{ .Values.nginx.preStopSleepSeconds | default 15 }}"]
          {{- with .Values.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- range $api := list (dict "name" (printf "%s-api-0" $.Chart.Name) "portName" "api-0" "port" 3000) (dict "name" (printf "%s-api-1" $.Chart.Name) "portName" "api-1" "port" 3001) }}
        - name: {{ $api.name }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.image.repository }}{{- if and $.Values.image.tag (hasPrefix "sha256:" $.Values.image.tag) }}@{{ $.Values.image.tag }}{{- else }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}{{- end }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.image.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ $api.portName }}
              containerPort: {{ $api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "chart-deco-studio.fullname" $ }}-config
            - secretRef:
                name: {{ include "chart-deco-studio.secretName" $ }}
          env:
            - name: PORT
              value: {{ $api.port | quote }}
            - name: POD_NAME_BASE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAME
              value: "$(POD_NAME_BASE)-{{ $api.portName }}"
            - name: STUDIO_DISPATCH_ROLE
              value: "api"
            {{- if $.Values.decofileCache.enabled }}
            - name: DECOFILE_CACHE_DIR
              value: {{ $.Values.decofileCache.mountPath | quote }}
            {{- end }}
            {{- if $.Values.terminationGracePeriodSeconds }}
            - name: SHUTDOWN_GRACE_SECONDS
              value: {{ $.Values.terminationGracePeriodSeconds | quote }}
            {{- end }}
            {{- if $.Values.tunnel.nats.clusterCreds.enabled }}
            - name: NATS_CREDS
              value: {{ include "chart-deco-studio.natsClusterCredsPath" $ | quote }}
            {{- end }}
            {{- if $.Values.otel.enabled }}
            {{- if $.Values.otel.protocol }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ $.Values.otel.protocol | quote }}
            {{- end }}
            {{- if $.Values.otel.service }}
            - name: OTEL_SERVICE_NAME
              value: {{ $.Values.otel.service | quote }}
            {{- end }}
            {{- if $.Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.otel.endpoint | quote }}
            {{- else if $.Values.otel.collector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ printf "http://%s-opentelemetry-collector:4318" $.Release.Name | quote }}
            {{- end }}
            {{- if and $.Values.otel.headers (or (not $.Values.otel.collector.enabled) $.Values.otel.endpoint) }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ include "chart-deco-studio.otelHeaders" $ | quote }}
            {{- end }}
            {{- if $.Values.otel.attributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "chart-deco-studio.otelAttributes" $ | quote }}
            {{- end }}
            {{- end }}
            {{- if and $.Values.dbosConductor $.Values.dbosConductor.enabled }}
            - name: DBOS_CONDUCTOR_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dbosConductor.existingSecret | default (printf "%s-dbos-conductor" (include "chart-deco-studio.fullname" $)) }}
                  key: {{ $.Values.dbosConductor.existingSecretKey | default "DBOS_CONDUCTOR_KEY" }}
            {{- with $.Values.dbosConductor.url }}
            - name: DBOS_CONDUCTOR_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with $.Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $.Values.startupProbe }}
          {{- $probe := deepCopy . }}
          {{- $httpGet := get $probe "httpGet" }}
          {{- if and $httpGet (eq (get $httpGet "port") "http") }}
          {{- $_ := set $httpGet "port" $api.port }}
          {{- end }}
          startupProbe:
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with $.Values.livenessProbe }}
          {{- $probe := deepCopy . }}
          {{- $httpGet := get $probe "httpGet" }}
          {{- if and $httpGet (eq (get $httpGet "port") "http") }}
          {{- $_ := set $httpGet "port" $api.port }}
          {{- end }}
          livenessProbe:
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with $.Values.readinessProbe }}
          {{- $probe := deepCopy . }}
          {{- $httpGet := get $probe "httpGet" }}
          {{- if and $httpGet (eq (get $httpGet "port") "http") }}
          {{- $_ := set $httpGet "port" $api.port }}
          {{- end }}
          readinessProbe:
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with $.Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ $.Values.configMap.meshConfig.DATA_DIR | default "/app/data" }}
            {{- if $.Values.decofileCache.enabled }}
            - name: decofile-cache
              mountPath: {{ $.Values.decofileCache.mountPath | quote }}
            {{- end }}
            {{- if and (eq (lower (default "sqlite" $.Values.database.engine)) "postgresql") $.Values.database.caCert }}
            - name: ca-cert
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- end }}
            {{- if $.Values.tunnel.nats.clusterCreds.enabled }}
            - name: nats-cluster-creds
              mountPath: {{ $.Values.tunnel.nats.clusterCreds.mountDir | quote }}
              readOnly: true
            {{- end }}
          {{- with $.Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if .Values.s3Sync.enabled }}
        - name: s3-sync
          image: "{{ .Values.s3Sync.image.repository }}:{{ .Values.s3Sync.image.tag }}"
          imagePullPolicy: {{ .Values.s3Sync.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/sync.sh"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.s3Sync.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.configMap.meshConfig.DATA_DIR | default "/app/data" }}
            - name: s3-sync-script
              mountPath: /scripts
              readOnly: true
      {{- end }}
      {{- with .Values.extraContainers }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if and (eq (lower (default "sqlite" .Values.database.engine)) "postgresql") .Values.database.caCert }}
        - name: ca-cert
          configMap:
            name: {{ include "chart-deco-studio.fullname" . }}-ca-cert
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          {{- if .Values.persistence.claimName }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-deco-studio.fullname" . }}-data
          {{- end }}
        {{- else }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.persistence.emptyDirSizeLimit | default "10Gi" }}
        {{- end }}
        {{- if .Values.decofileCache.enabled }}
        # Content-addressed decofile cache: per-pod, rebuilt on reschedule, so
        # emptyDir (not a PVC) is the right lifetime. sizeLimit is the hard
        # wall; the app's own byte budget evicts well below it.
        - name: decofile-cache
          emptyDir:
            sizeLimit: {{ .Values.decofileCache.sizeLimit | default "4Gi" }}
        {{- end }}
        {{- if .Values.s3Sync.enabled }}
        - name: s3-sync-script
          configMap:
            name: {{ include "chart-deco-studio.fullname" . }}-s3-sync
            defaultMode: 0755
            items:
              - key: sync.sh
                path: sync.sh
        {{- end }}
        {{- if .Values.tunnel.nats.clusterCreds.enabled }}
        - name: nats-cluster-creds
          secret:
            secretName: {{ include "chart-deco-studio.natsClusterCredsSecretName" . | quote }}
            items:
              - key: {{ .Values.tunnel.nats.clusterCreds.secretKey | quote }}
                path: {{ .Values.tunnel.nats.clusterCreds.fileName | quote }}
        {{- end }}
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.topologySpreadConstraints (gt (len .Values.topologySpreadConstraints) 0) }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - {{- if not .labelSelector }}
          {{- fail "labelSelector is required in topologySpreadConstraints. Specify the labels explicitly." }}
          {{- else }}
          labelSelector:
            {{- toYaml .labelSelector | nindent 12 }}
          {{- end }}
          maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
        {{- end }}
      {{- end }}
