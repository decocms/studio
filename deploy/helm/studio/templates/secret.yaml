{{- if and (not .Values.secret.secretName) (not .Values.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}-secrets
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
  {{- if .Values.preview.enabled }}
  annotations:
    # Same wave as the ExternalSecret, and for the same reason: the migrate Job
    # (-10) and the app Deployments (0) both take this via envFrom, and a
    # missing configMapRef leaves the container in CreateContainerConfigError —
    # which stalls the whole sync on the hook, with no error on the object
    # itself. Only a real sync surfaces this; `helm template` cannot.
    argocd.argoproj.io/sync-wave: "-30"
  {{- end }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ .Values.secret.BETTER_AUTH_SECRET | quote }}
  ENCRYPTION_KEY: {{ .Values.secret.ENCRYPTION_KEY | default "" | quote }}
  {{- with .Values.secret.NATS_ACCOUNT_JWT }}
  NATS_ACCOUNT_JWT: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.NATS_ACCOUNT_SIGNING_KEY }}
  NATS_ACCOUNT_SIGNING_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.NATS_OPERATOR_JWT }}
  NATS_OPERATOR_JWT: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.NATS_CLUSTER_CREDS }}
  NATS_CLUSTER_CREDS: |-
    {{- . | nindent 4 }}
  {{- end }}
  {{- if and (eq (lower (default "sqlite" .Values.database.engine)) "postgresql") (ne (include "chart-deco-studio.previewPostgresProvidesUrl" . | trim) "true") }}
  DATABASE_URL: {{ include "chart-deco-studio.databaseUrl" . | trim | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_GOOGLE_CLIENT_ID }}
  AUTH_GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_GOOGLE_CLIENT_SECRET }}
  AUTH_GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_GITHUB_CLIENT_ID }}
  AUTH_GITHUB_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_GITHUB_CLIENT_SECRET }}
  AUTH_GITHUB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_RESEND_API_KEY }}
  AUTH_RESEND_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_RESEND_FROM_EMAIL }}
  AUTH_RESEND_FROM_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_SENDGRID_API_KEY }}
  AUTH_SENDGRID_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_SENDGRID_FROM_EMAIL }}
  AUTH_SENDGRID_FROM_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_SSO_DOMAIN }}
  AUTH_SSO_DOMAIN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_SSO_MS_TENANT_ID }}
  AUTH_SSO_MS_TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_SSO_MS_CLIENT_ID }}
  AUTH_SSO_MS_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_SSO_MS_CLIENT_SECRET }}
  AUTH_SSO_MS_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_SSO_GOOGLE_CLIENT_ID }}
  AUTH_SSO_GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.AUTH_SSO_GOOGLE_CLIENT_SECRET }}
  AUTH_SSO_GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
