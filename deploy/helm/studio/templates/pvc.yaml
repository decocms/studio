{{- if .Values.persistence.enabled -}}
{{- if not .Values.persistence.claimName }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}-data
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- /*
  When persistence.storageClass is empty the field is OMITTED (not set to ""),
  so the cluster's DEFAULT StorageClass is used. An explicit "" would instead
  DISABLE dynamic provisioning and leave the PVC Pending.
  */}}
{{- end }}
{{- end }}
