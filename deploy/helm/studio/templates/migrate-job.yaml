{{- $preview := .Values.preview.enabled }}
{{- if or .Values.migrateJob.enabled $preview }}
{{- $name := printf "%s-%s" (include "chart-deco-studio.fullname" .) (ternary "preview-migrate" "migrate" $preview) }}
{{- $deadline := ternary .Values.preview.migrateDeadlineSeconds .Values.migrateJob.deadlineSeconds $preview }}
{{- $jobResources := ternary .Values.preview.jobResources .Values.migrateJob.resources $preview }}
{{- /*
The single migration writer. Runs before the app pods can race each other.

Why it must exist outside preview too: DBOS migrates its own `dbos` schema on
DBOS.launch(), every replica does it on boot, and the SDK's version bump is
`UPDATE dbos.dbos_migrations SET version = $1` with no WHERE — it assumes the
table holds exactly one row. Two replicas reaching the bump together insert two
rows, and from then on every bump tries to write the same version into both,
collides on the primary key, and the schema version can never advance again.
The install is bricked permanently, reproducible with a single pod, and only a
manual DELETE recovers it. This is not theoretical: it happened on a customer's
first install with replicaCount: 3.

Sync-phase hook at wave -10: the single migration writer.

A Sync hook rather than PreSync because the preview's Postgres (wave -20) is a
Sync-phase resource — a PreSync Job would run before it exists. Argo holds each
wave until its resources report healthy, so this starts only once Postgres is
accepting connections, and the app Deployments (default wave 0) start only once
this Job has completed. Pods then boot with --skip-migrations (enforced by
validatePreview).

Both steps are needed. --skip-migrations only covers studio's own migrations;
DBOS still migrates its `dbos` schema on launch, and parallel pod boots race on
inserts into dbos.dbos_migrations — see tests/multi-pod/docker-compose.yml.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 3
  # A deadline, because backoffLimit does not cover the ways this Job hangs
  # rather than fails. Twice now it sat Running 0/1 indefinitely — once with the
  # pod stuck in CreateContainerConfigError on a missing ConfigMap, once with no
  # pod at all because the ServiceAccount did not exist yet. Neither counts as a
  # failed attempt, so backoffLimit never trips.
  #
  # That matters beyond this Job. It is a sync hook, so Argo blocks the whole
  # operation waiting for it — and a blocked operation cannot be superseded,
  # which means the ApplicationSet cannot delete the Application either. A
  # preview in that state ignores its label being removed and outlives the 48h
  # TTL, which is the one thing the TTL exists to prevent.
  #
  # Failing frees the operation: Argo reports a failed sync, retry applies, and
  # removing the label works again. 15 minutes is well past a cold migration
  # (measured ~3 min, nearly all of it waiting for the image to publish).
  activeDeadlineSeconds: {{ $deadline }}
  template:
    metadata:
      labels:
        {{- include "chart-deco-studio.podLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "chart-deco-studio.serviceAccountName" . }}
      securityContext:
        {{- include "chart-deco-studio.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}{{- if and .Values.image.tag (hasPrefix "sha256:" .Values.image.tag) }}@{{ .Values.image.tag }}{{- else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "chart-deco-studio.fullname" . }}-config
            - secretRef:
                name: {{ include "chart-deco-studio.secretName" . }}
          command: ["/bin/sh", "-c"]
          args:
            # Absolute bundle paths, not `bun run <script>`: the image installs
            # the decocms tarball into a bare directory whose package.json
            # carries none of apps/api's scripts.
            - |
              set -eu
              bun run node_modules/decocms/dist/server/migrate.js
              bun run node_modules/decocms/dist/server/migrate-dbos.js
          resources:
            {{- toYaml $jobResources | nindent 12 }}
          {{- if and (eq (lower (default "sqlite" .Values.database.engine)) "postgresql") .Values.database.caCert }}
          # NODE_EXTRA_CA_CERTS points at /etc/ssl/certs/ca-cert.pem, so the Job
          # needs the same mount the Deployments get. Without it the variable
          # names a file that is not there, the extra CA is silently skipped,
          # and a privately-rooted Postgres — an RDS instance endpoint, whose
          # chain is not in the Node root store — fails the connection with
          # SELF_SIGNED_CERT_IN_CHAIN seconds into the Job. Being a sync hook at
          # wave -10, that aborts the operation and nothing in wave 0 is ever
          # applied.
          volumeMounts:
            - name: ca-cert
              mountPath: /etc/ssl/certs
              readOnly: true
          {{- end }}
      {{- if and (eq (lower (default "sqlite" .Values.database.engine)) "postgresql") .Values.database.caCert }}
      volumes:
        - name: ca-cert
          configMap:
            name: {{ include "chart-deco-studio.fullname" . }}-ca-cert
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
      {{- end }}
{{- end }}
