{{- if .Values.worker.enabled }}
{{/*
Agent-loop worker Deployment. Same image / DB / auth as the main Deployment,
but STUDIO_DISPATCH_ROLE=worker so it dequeues ONLY the agent/automation run
queues. It carries a distinct `app.kubernetes.io/name` ("<name>-worker") so the
main Deployment selector and the Service selector do NOT match its pods —
workers never get LB/HTTP traffic; they only pull work from the DBOS queue.

NOTE: this intentionally mirrors deployment.yaml's pod spec (minus the s3-sync
sidecar / PVC). A future cleanup could share a named pod-spec template; kept
separate here so the main Deployment's rendered output is unchanged.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}-worker
  labels:
    app.kubernetes.io/name: {{ include "chart-deco-studio.name" . }}-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "chart-deco-studio.chart" . }}
    {{- if .Chart.AppVersion }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- end }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chart-deco-studio.name" . }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- if or .Values.metrics.scrape .Values.podAnnotations .Values.worker.doNotDisrupt }}
      annotations:
        {{- if .Values.metrics.scrape }}
        # Worker runs the stream pump (encode/publish) and the run executors, so
        # its metrics (decopilot.stream.*, eventloop.delay) only reach Prometheus
        # if vmagent's kubernetes-pods job scrapes this pod too — same block as
        # the API deployment.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.configMap.meshConfig.PORT | default "3000" | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        {{- end }}
        {{- if .Values.worker.doNotDisrupt }}
        # Workers execute in-flight agent-loop runs (DBOS workflows, concurrency=1
        # per thread). Workers are I/O-bound on LLM/sandbox calls, so their nodes
        # look CPU-idle and Karpenter consolidates them ("Evicted: Underutilized")
        # mid-run — graceful shutdown then blocks on pending workflows while the
        # replacement pod re-recovers ~20 workflows and the interrupted run's
        # sandbox is reaped, so decopilot chats stall. Block Karpenter VOLUNTARY
        # disruption (consolidation/drift/expiration); deploys still roll pods
        # normally and land them on fresh nodes, so drift is resolved each release.
        karpenter.sh/do-not-disrupt: "true"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "chart-deco-studio.name" . }}-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        {{- if .Chart.AppVersion }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart-deco-studio.serviceAccountName" . }}
      securityContext:
        {{- include "chart-deco-studio.podSecurityContext" . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-worker
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}{{- if and .Values.image.tag (hasPrefix "sha256:" .Values.image.tag) }}@{{ .Values.image.tag }}{{- else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.image.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.configMap.meshConfig.PORT | default "3000" | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "chart-deco-studio.fullname" . }}-config
            - secretRef:
                name: {{ include "chart-deco-studio.secretName" . }}
          env:
            # Role: dequeue only the agent/automation run queues.
            - name: PORT
              value: {{ .Values.configMap.meshConfig.PORT | default "3000" | quote }}
            - name: STUDIO_DISPATCH_ROLE
              value: worker
            {{- if .Values.terminationGracePeriodSeconds }}
            - name: SHUTDOWN_GRACE_SECONDS
              value: {{ .Values.terminationGracePeriodSeconds | quote }}
            {{- end }}
            {{- if .Values.tunnel.nats.clusterCreds.enabled }}
            - name: NATS_CREDS
              value: {{ include "chart-deco-studio.natsClusterCredsPath" . | quote }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            {{- if .Values.otel.protocol }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            {{- end }}
            {{- if .Values.otel.service }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-worker" .Values.otel.service | quote }}
            {{- end }}
            {{- if .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- else if .Values.otel.collector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ printf "http://%s-opentelemetry-collector:4318" .Release.Name | quote }}
            {{- end }}
            {{- if and .Values.otel.headers (or (not .Values.otel.collector.enabled) .Values.otel.endpoint) }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ include "chart-deco-studio.otelHeaders" . | quote }}
            {{- end }}
            {{- if .Values.otel.attributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "chart-deco-studio.otelAttributes" . | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.dbosConductor .Values.dbosConductor.enabled }}
            - name: DBOS_CONDUCTOR_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbosConductor.existingSecret | default (printf "%s-dbos-conductor" (include "chart-deco-studio.fullname" .)) }}
                  key: {{ .Values.dbosConductor.existingSecretKey | default "DBOS_CONDUCTOR_KEY" }}
            {{- with .Values.dbosConductor.url }}
            - name: DBOS_CONDUCTOR_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.worker.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.configMap.meshConfig.DATA_DIR | default "/app/data" }}
            {{- if and (eq (lower (default "sqlite" .Values.database.engine)) "postgresql") .Values.database.caCert }}
            - name: ca-cert
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- end }}
            {{- if .Values.tunnel.nats.clusterCreds.enabled }}
            - name: nats-cluster-creds
              mountPath: {{ .Values.tunnel.nats.clusterCreds.mountDir | quote }}
              readOnly: true
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if and (eq (lower (default "sqlite" .Values.database.engine)) "postgresql") .Values.database.caCert }}
        - name: ca-cert
          configMap:
            name: {{ include "chart-deco-studio.fullname" . }}-ca-cert
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
        {{- end }}
        # Workers are stateless (no PVC / s3-sync): DATA_DIR is scratch.
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.persistence.emptyDirSizeLimit | default "10Gi" }}
        {{- if .Values.tunnel.nats.clusterCreds.enabled }}
        - name: nats-cluster-creds
          secret:
            secretName: {{ include "chart-deco-studio.natsClusterCredsSecretName" . | quote }}
            items:
              - key: {{ .Values.tunnel.nats.clusterCreds.secretKey | quote }}
                path: {{ .Values.tunnel.nats.clusterCreds.fileName | quote }}
        {{- end }}
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
