{{- if .Values.preview.enabled }}
{{- /*
PostDelete hook: destroys the per-PR database and bucket when the preview goes
away. This is the half of the lifecycle that a GitHub-Actions teardown job
cannot do reliably — if that job is cancelled or never runs, the database
leaks. Argo runs this whenever the Application is deleted.

DROP DATABASE ... WITH (FORCE) matters: the pods' connection pools may not have
fully drained when this runs, and a plain DROP would fail on the open backends.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chart-deco-studio.fullname" . }}-preview-teardown
  labels:
    {{- include "chart-deco-studio.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PostDelete
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "chart-deco-studio.podLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.preview.objectStorage.manageBucket }}
      initContainers:
        - name: remove-bucket
          image: "{{ .Values.preview.mcImage.repository }}:{{ .Values.preview.mcImage.tag }}"
          imagePullPolicy: {{ .Values.preview.mcImage.pullPolicy }}
          env:
            - name: S3_ENDPOINT
              value: {{ .Values.preview.objectStorage.endpoint | quote }}
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.preview.objectStorage.credentialsSecret.name }}
                  key: {{ .Values.preview.objectStorage.credentialsSecret.accessKeyIdKey }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.preview.objectStorage.credentialsSecret.name }}
                  key: {{ .Values.preview.objectStorage.credentialsSecret.secretAccessKeyKey }}
          command: ["/bin/sh", "-c"]
          args:
            # Guarded rather than `|| true`: an already-absent bucket is
            # expected, any other mc failure should still fail the Job.
            - |
              set -eu
              mc alias set preview "$S3_ENDPOINT" "$ACCESS_KEY" "$SECRET_KEY"
              if mc ls "preview/{{ include "chart-deco-studio.previewBucket" . }}" >/dev/null 2>&1; then
                mc rb --force "preview/{{ include "chart-deco-studio.previewBucket" . }}"
              fi
          resources:
            {{- toYaml .Values.preview.jobResources | nindent 12 }}
      {{- end }}
      containers:
        - name: drop-database
          image: "{{ .Values.preview.postgresImage.repository }}:{{ .Values.preview.postgresImage.tag }}"
          imagePullPolicy: {{ .Values.preview.postgresImage.pullPolicy }}
          env:
            - name: ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.preview.dbAdminSecret.name | default (include "chart-deco-studio.secretName" .) }}
                  key: {{ .Values.preview.dbAdminSecret.key }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
                -c 'DROP DATABASE IF EXISTS "{{ include "chart-deco-studio.previewDbName" . }}" WITH (FORCE)'
              echo "database {{ include "chart-deco-studio.previewDbName" . }} dropped"
          resources:
            {{- toYaml .Values.preview.jobResources | nindent 12 }}
{{- end }}
