map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      "";
}

upstream studio_api {
  zone studio_api 64k;
  server 127.0.0.1:3000 max_conns=128;
  server 127.0.0.1:3001 max_conns=128;
  keepalive 64;
}

server {
  listen 8080;
  server_name ~^[^.]+\.preview\..+$;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_max_body_size 100m;
  client_body_timeout 30s;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  send_timeout 60s;

  location / {
    proxy_pass http://studio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_max_body_size 100m;
  client_body_timeout 30s;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  send_timeout 60s;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(api|mcp|oauth-proxy|\.well-known|org|health|metrics)(/|$) {
    proxy_pass http://studio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  location /assets/ {
    try_files $uri @asset_missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location @asset_missing {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
