# This file is baked into the nginx image (apps/web/Dockerfile), not mounted as a
# ConfigMap — edits only take effect after a release rebuilds the image and the
# deployed tag is bumped. release-tagging watches this dir so that happens.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      "";
}

# Two in-pod Bun API processes. max_fails is left at the default (1) so a
# genuinely dead/booting process is still ejected on a real connect/read error
# and traffic fails over to its sibling. Crucially, `proxy_next_upstream` below
# does NOT list http_502/503/504: app-level 5xx (e.g. a 503 circuit-breaker for
# an unreachable downstream MCP, or a 502 "Preview not available" for a dead
# sandbox) are VALID responses, not process-health signals. If they were listed,
# a single such response would count toward max_fails and eject an otherwise
# healthy process; with both processes returning the same app-5xx for the same
# dead downstream, nginx ejects both -> "no live upstreams" -> the whole front
# door 502s, including unrelated DB-only endpoints. Keep app-5xx out of the
# passive-health path.
upstream studio_api {
  zone studio_api 64k;
  server 127.0.0.1:3000 max_conns=128;
  server 127.0.0.1:3001 max_conns=128;
  keepalive 64;
}

server {
  listen 8080;
  server_name ~^[^.]+\.preview\..+$;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_max_body_size 100m;
  client_body_timeout 30s;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  send_timeout 60s;

  # Cookies concatenate into one Cookie: header line; the default 8k buffer is
  # exceeded by normal domain-wide accumulation (Better Auth session + PostHog +
  # siblings), yielding a 400 "Request Header Or Cookie Too Large".
  large_client_header_buffers 4 32k;

  location / {
    proxy_pass http://studio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_max_body_size 100m;
  client_body_timeout 30s;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  send_timeout 60s;

  # See the preview server above: raise from the 8k default so accumulated
  # cookies in one Cookie: header line don't 400 with "Cookie Too Large".
  large_client_header_buffers 4 32k;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(api|mcp|oauth-proxy|\.well-known|org|health|metrics)(/|$) {
    proxy_pass http://studio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  location /assets/ {
    try_files $uri @asset_missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location @asset_missing {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Pinned build mtimes + fixed-width Vite hashes make index.html's ETag and
    # Last-Modified identical across deploys, so `no-cache` revalidation always
    # 304s and serves stale HTML until a hard refresh. Drop the validators ->
    # every soft reload gets a fresh 200.
    etag off;
    if_modified_since off;
    try_files $uri /index.html;
  }
}
