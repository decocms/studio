apiVersion: v2
name: chart-deco-studio-previews
description: |
  Control plane for per-PR preview environments of a Studio repository.

  Deploys no workload of its own. It renders an Argo CD ApplicationSet whose
  pullRequest generator turns every labelled open PR into an Application that
  installs chart-deco-studio into its own namespace, plus the shared wildcard
  Gateway those per-PR HTTPRoutes attach to.

  Requires Argo CD. Deliberately a separate chart from chart-deco-studio:
  the application chart must never carry an argoproj.io CRD that a plain Helm
  install cannot resolve, a preview release must never be able to render the
  ApplicationSet that generates previews, and preview policy must be able to
  change without bumping — and therefore rolling — the application chart.
type: application
# 0.1.1: pass namespaceLabels through to the studio chart, which renders the
# preview's Namespace itself as of chart-deco-studio 0.14.3. Without this the
# namespace is created with no gateway selector label and the HTTPRoute
# attaches to nothing.

version: 0.1.1
