apiVersion: v2
name: sandbox-env
description: |
  Studio-side resources that consume the agent-sandbox operator: the
  shared SandboxTemplate, Studio runner RBAC, sandbox-pod NetworkPolicy,
  optional SandboxWarmPool, and optional preview Gateway / HTTPRoute /
  Certificate. Install one release per environment (dev / staging /
  prod / ...). Resource names are suffixed with `envName` so multiple
  releases coexist in the shared `agent-sandbox-system` namespace.
  Requires the sandbox-operator chart to already be installed.
type: application
# 0.9.57: opt-in `goTemplate` renders a second SandboxTemplate,
# `studio-sandbox-<envName>-go`, pinned to the Go image. `daemonImpl` moves the
# whole env; this moves ONE sandbox, because `spec.sandboxTemplateRef` is the
# only per-claim lever the operator honors on a warm-poolable claim. Studio
# points STUDIO_SANDBOX_GO_TEMPLATE_NAME at it; unset there, the org flag and
# SANDBOX_START's `daemonImpl` prop are both inert. Default render unchanged
# (enabled: false), and enabling it requires image.goRepository.
# 0.9.55: the sandbox daemon implementation is now the IMAGE, not a runtime
# switch. `daemonImpl` (default "ts") selects image.repository vs
# image.goRepository (studio-sandbox vs studio-sandbox-go), and the pod no
# longer receives SANDBOX_DAEMON_IMPL — a pod cannot disagree with the template
# that created it. Default render is unchanged; `daemonImpl: go` requires
# image.goRepository (validated at template time). One tag drives both images:
# they are released together from the same source revision.
# 0.9.44: opt-in L2 cross-node golden archive (depsCache.remote.*,
# default off) — mounts an RWX PVC READ-ONLY and sets
# GOLDEN_CACHE_REMOTE so the daemon can restore a per-(repo,lockfile)
# tar.zst on any node/zone. Additive; no change unless enabled.
# Requires depsCache.enabled and a zstd-bearing sandbox image.
# 0.9.20: Studio terminology and compatibility documentation refresh. The
# legacy `mesh.*` values key remains supported; no runtime behavior changes.
# 0.9.14: sandbox pod memory request 1Gi -> 2Gi (= measured p95 of per-pod peak
# working-set; 7d). At 1Gi the scheduler bin-packed on less than half of real
# usage and prod nodes hit memory-pressure eviction (0 per-pod OOMs — the 4Gi
# limit was never reached). Sizes the request to real usage; trades packing
# density for the elimination of node-pressure evictions. Limit unchanged.
# 0.9.6: default studio-sandbox image tag bumped to 1.17.8 — catches the chart
# up to the current sandbox image (the tag lockstep had drifted from 1.12.0,
# missing 5 minors of image changes, incl. the slides deck-as-theme CSS fix
# #4868). Image-tag change only; no chart template changes.
# 0.9.5: housekeeper reaps orphaned phase=Failed sandbox pods (left when the
# orgfs-sidecar is SIGKILLed on teardown and its Sandbox CR is already gone) +
# grants the housekeeper Role `delete` on pods. Additive; existing reap paths
# unchanged.
# 0.9.4: default studio-sandbox image tag bumped to 1.12.0 (Node.js 26).
# 0.9.3: opt-in HPA for the warm pool (warmPool.autoscaling.*, default off) —
# scales SandboxWarmPool via its native scale subresource. No default metric
# ships; requires warmPool.enabled + at least one metrics entry. Additive; no
# change unless enabled.
# 0.9.2: opt-in golden node_modules reflink cache (depsCache.golden, default
# off) — sets GOLDEN_CACHE_ENABLED so the daemon reflink-restores a cached
# node_modules and skips install. Additive; no change unless enabled. (The
# daemon-side code merged in 0.9.1's window but the chart wasn't bumped, so
# the publish workflow skipped it — this bump ships the template.)
# 0.9.1: opt-in node-local deps cache (depsCache.*, default off) —
# hostPath store keyed per-repo by the daemon. Additive; no change for
# consumers that leave it disabled.
# 0.9.0: org-fs is mandatory — removed the `orgFs.enabled` + `hostUsers`
# toggles (sidecar always deployed, hostUsers fixed true). Minor bump:
# behavior change for consumers that ran with org-fs disabled / userns
# remap — those settings are now ignored.
# 0.8.1: housekeeper no longer force-deletes claims on a transient
# ReconcilerError (grace window + adopted-claim guard) — fixes the "did not
# record an adopted Sandbox within 60s" auto-start freeze.
# 0.8.0: org-fs sidecar (orgFs.*) — privileged rclone mounter + main-container
# mounts. NOTE: the publish workflow skips existing versions, so this MUST
# stay ahead of the latest published chart (0.7.5 at time of writing).
version: 0.9.61
# appVersion tracks the studio-sandbox image version (image.tag default).
appVersion: "1.31.3"
kubeVersion: ">=1.30.0-0"
