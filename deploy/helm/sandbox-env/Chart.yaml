apiVersion: v2
name: sandbox-env
description: |
  Studio-side resources that consume the agent-sandbox operator: the
  shared SandboxTemplate, Studio runner RBAC, sandbox-pod NetworkPolicy,
  optional SandboxWarmPool, and optional preview Gateway / HTTPRoute /
  Certificate. Install one release per environment (dev / staging /
  prod / ...). Resource names are suffixed with `envName` so multiple
  releases coexist in the shared `agent-sandbox-system` namespace.
  Requires the sandbox-operator chart to already be installed.
type: application
# 0.16.2: renewals now land at idleTtlSeconds + `housekeeper.renewSlackSeconds`
# (default 60) instead of exactly idleTtlSeconds, so the sweep's graceful reap
# — HTTPRoute deleted before the pod drains — stays ahead of the operator's own
# ClaimExpired, which skips that ordering. Keep the slack >= your sweep
# interval.
# 0.16.0: the housekeeper now RENEWS a claim's shutdownTime (out to
# idleTtlSeconds) whenever its daemon served traffic within
# `housekeeper.renewActiveSeconds`. Studio only renews for its own SSE/run
# clients, so a preview URL opened directly in a browser used to die
# mid-session and 502 until it was reopened from Studio. Set
# renewActiveSeconds: 0 for the old behaviour.
# 0.14.6: opt-in `disruptionProtection.doNotDisrupt` (default off) — annotates
# sandbox pods with Karpenter's `do-not-disrupt` so voluntary node
# consolidation/drift never evicts a claimed sandbox mid-session (#5815). A
# PodDisruptionBudget doesn't fit here (a claimed sandbox is a singleton, no
# replicas to shift load to — its minAvailable/maxUnavailable math can
# deadlock Karpenter drift instead), so this is the narrower, safe mitigation.
# Does not cover involuntary disruption (spot reclaim, node failure) — that's
# terminationGracePeriodSeconds' job. Additive; no change unless enabled.
# 0.14.0: scope the golden uploader by environment, and give its volume the key
# prefix it was missing. Two defects, both of which made the tier silently do
# nothing rather than fail:
#   - the uploader's writable mount had NO `prefix`, while the tenant mount is
#     scoped to `prefix=<envName>/`. Writes landed at bucket root and no tenant
#     mount could ever see them, so every restore missed forever and it read as
#     "the cache never hits". The org is in the object KEY and isolates tenants;
#     the environment is the mount PREFIX and is what makes a write readable —
#     conflating the two is what caused this.
#   - the hostPath store is per NODE and every environment's sandboxes share one
#     NodePool, so a node holds a mix. Each uploader now forwards only goldens
#     its own environment produced (SANDBOX_ENV, stamped into the golden's meta
#     by the sandbox container). Without it an uploader compressed and shipped a
#     neighbour's tree into a prefix that neighbour never reads.
# Needs studio-sandbox-go >= 1.47.0: the env is stamped by the daemon, so an
# older image leaves it blank and a scoped uploader skips everything.
# 0.13.2: fix — the uploader DaemonSet crash-looped with
# `Script not found "golden-uploader"`. The sandbox image's ENTRYPOINT comes from
# the oven/bun base and its CMD is the daemon binary, so overriding `args` alone
# handed the subcommand to bun. Now overrides `command` with the binary's full
# path. 0.13.0 and 0.13.1 both ship an uploader that cannot start; it is
# default-off, so only a consumer that enabled it saw this.
# 0.13.1: fix — the goldenUploader DaemonSet rendered with NO tolerations, so it
# could not schedule on the `decocms.com/sandbox=true:NoSchedule` NodePool where
# the hostPath it reads exists. `fromYaml` on a LIST yields an empty map, so the
# `with` dropped the block; `fromYamlArray` is correct, as the neighbouring
# nodePlaceholder template already had it. nodeSelector was unaffected (a map),
# which is why it hid. 0.13.0 shipped the DaemonSet unschedulable — it is
# default-off, so nothing deployed it.
# 0.13.0: opt-in `goldenUploader` (default off) — a DaemonSet that carries L1
# goldens from a node's hostPath into the shared L2 store, plus its own WRITABLE
# PV/PVC over that store. Without it the shared store stays empty: a sandbox
# pod's mount is read-only by design, so nothing a tenant boots can publish
# there. A DaemonSet rather than a sidecar so the sandbox PodSpec is untouched —
# no per-pod request, no effect on packing density, nothing new that can degrade
# the health probe — and so the writable mount lives once per node in
# infrastructure instead of inside every tenant's pod. Archives are keyed by org,
# which is what makes fleet-wide publishing acceptable: a repo hash comes from
# the clone URL, so two orgs cloning one public template would otherwise share a
# key. Requires depsCache.enabled + depsCache.remote.enabled and a writable
# volume source (the new PV, or goldenUploader.pvcName — mandatory on the dynamic
# storageClassName path, which cannot express the read-only/read-write split).
# Additive; no change unless enabled.
# 0.12.1: pin `updateStrategy.type: OnReplenish` on every SandboxWarmPool
# (generic + tenant). It is already the operator's default as of v0.4.5, so
# this renders no behaviour change today — it exists so an operator upgrade
# that moves the default to `Recreate` can't turn a routine SandboxTemplate
# sync (an image bump) into a pool-wide pod restart.
# 0.12.0: tenantPools — per-tenant warm pools (SandboxWarmPool per entry
# against the shared SandboxTemplate). Additive and empty by default; each
# entry needs a matching object in Studio's STUDIO_SANDBOX_TENANT_POOLS.
# Also grants the runner Role `sandboxwarmpools: get` — the reconciler reads
# each pool's status.selector to find its pods, and 403s without it.
# 0.11.0: this chart now asks for the L2 store's volume instead of having it
# handed over. `depsCache.remote` takes exactly one of three sources:
# `storageClassName` (dynamic — renders only a PVC, so any RWX CSI driver works
# and nothing here names a cloud), `volume.{driver,attributes,mountOptions}`
# (static — renders PV + PVC, required for a driver with no provisioner, which
# is why mountpoint-S3 is the default), or `pvcName` (an existing claim, as
# before). Two set fails the render as ambiguous; none set fails instead of
# leaving a PVC Pending forever with neither a StorageClass nor a volumeName.
# Those objects used to be created by terraform under one namespace-wide name,
# which made every release share a single store root — so stg could publish an
# archive that prod then restored; both are now envName-suffixed, and the static
# path keys each release under its own `prefix`. Minor bump: `pvcName` stops
# being the only way in, and a consumer pointing it at the terraform-created
# `sandbox-golden-ro` must move to one of the other two before those objects are
# removed on the terraform side. Still default off — no change unless enabled.
# 0.10.7: opt-in node placeholder / "balloon" (nodePlaceholder.*, default off)
# — low-priority pods that reserve warm NODE capacity on the sandbox NodePool
# so warm-pool refill / KEDA scale-up / cold claims schedule onto an already-up
# node instead of waiting on Karpenter. Complements warmPool (warm pods) with
# warm nodes under them. Placement defaults to the sandbox pod's own
# nodeSelector/tolerations so capacity lands on the same dedicated pool.
# Additive; no change unless enabled.
# 0.10.0: the Go daemon is the ONLY sandbox daemon. Removed `daemonImpl`,
# `goTemplate.*` and `image.goRepository`; `image.repository` now points at
# studio-sandbox-go and the chart renders exactly one SandboxTemplate and one
# SandboxWarmPool again. Upgrading FLIPS THE DEFAULT TEMPLATE'S IMAGE, which
# rolls the warm pool — and it DELETES `studio-sandbox-<envName>-go`, so deploy
# the Studio side that stopped referencing it (STUDIO_SANDBOX_GO_TEMPLATE_NAME
# removed) BEFORE syncing this, or in-flight claims will name a template that
# no longer exists.
# 0.9.44: opt-in L2 cross-node golden archive (depsCache.remote.*,
# default off) — mounts an RWX PVC READ-ONLY and sets
# GOLDEN_CACHE_REMOTE so the daemon can restore a per-(repo,lockfile)
# tar.zst on any node/zone. Additive; no change unless enabled.
# Requires depsCache.enabled and a zstd-bearing sandbox image.
# 0.9.20: Studio terminology and compatibility documentation refresh. The
# legacy `mesh.*` values key remains supported; no runtime behavior changes.
# 0.9.14: sandbox pod memory request 1Gi -> 2Gi (= measured p95 of per-pod peak
# working-set; 7d). At 1Gi the scheduler bin-packed on less than half of real
# usage and prod nodes hit memory-pressure eviction (0 per-pod OOMs — the 4Gi
# limit was never reached). Sizes the request to real usage; trades packing
# density for the elimination of node-pressure evictions. Limit unchanged.
# 0.9.6: default studio-sandbox image tag bumped to 1.17.8 — catches the chart
# up to the current sandbox image (the tag lockstep had drifted from 1.12.0,
# missing 5 minors of image changes, incl. the slides deck-as-theme CSS fix
# #4868). Image-tag change only; no chart template changes.
# 0.9.5: housekeeper reaps orphaned phase=Failed sandbox pods (left when the
# orgfs-sidecar is SIGKILLed on teardown and its Sandbox CR is already gone) +
# grants the housekeeper Role `delete` on pods. Additive; existing reap paths
# unchanged.
# 0.9.4: default studio-sandbox image tag bumped to 1.12.0 (Node.js 26).
# 0.9.3: opt-in HPA for the warm pool (warmPool.autoscaling.*, default off) —
# scales SandboxWarmPool via its native scale subresource. No default metric
# ships; requires warmPool.enabled + at least one metrics entry. Additive; no
# change unless enabled.
# 0.9.2: opt-in golden node_modules reflink cache (depsCache.golden, default
# off) — sets GOLDEN_CACHE_ENABLED so the daemon reflink-restores a cached
# node_modules and skips install. Additive; no change unless enabled. (The
# daemon-side code merged in 0.9.1's window but the chart wasn't bumped, so
# the publish workflow skipped it — this bump ships the template.)
# 0.9.1: opt-in node-local deps cache (depsCache.*, default off) —
# hostPath store keyed per-repo by the daemon. Additive; no change for
# consumers that leave it disabled.
# 0.9.0: org-fs is mandatory — removed the `orgFs.enabled` + `hostUsers`
# toggles (sidecar always deployed, hostUsers fixed true). Minor bump:
# behavior change for consumers that ran with org-fs disabled / userns
# remap — those settings are now ignored.
# 0.8.1: housekeeper no longer force-deletes claims on a transient
# ReconcilerError (grace window + adopted-claim guard) — fixes the "did not
# record an adopted Sandbox within 60s" auto-start freeze.
# 0.8.0: org-fs sidecar (orgFs.*) — privileged rclone mounter + main-container
# mounts. NOTE: the publish workflow skips existing versions, so this MUST
# stay ahead of the latest published chart (0.7.5 at time of writing).
version: 0.16.7
# appVersion tracks the studio-sandbox image version (image.tag default).
appVersion: "1.55.6"
kubeVersion: ">=1.30.0-0"
