{{- if .Values.decoCache.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "sandbox-env.sandboxName" . }}-deco-cache
  namespace: agent-sandbox-system
  labels:
    {{- include "sandbox-env.sandboxLabels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.decoCache.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sandbox-env.sandboxName" . }}-deco-cache
  namespace: agent-sandbox-system
  labels:
    {{- include "sandbox-env.sandboxLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.decoCache.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "sandbox-env.sandboxName" . }}-deco-cache
    kind: SecretStore
  target:
    name: {{ include "sandbox-env.decoCacheSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.decoCache.externalSecret.secretPath }}
{{- end }}
