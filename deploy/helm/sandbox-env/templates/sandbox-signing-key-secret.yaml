# The bot's commit signing key, mounted read-only into every sandbox pod of
# this env (see sandbox-template.yaml). Rendered only when
# `commitSigning.privateKey` is set. Pinned to agent-sandbox-system for the
# same reason as the sentinel Secret: the pod that mounts it lives there.
{{- if .Values.commitSigning.privateKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sandbox-env.signingKeySecretName" . }}
  namespace: agent-sandbox-system
  labels:
    {{- include "sandbox-env.sandboxLabels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ .Values.commitSigning.privateKey | quote }}
{{- end }}
