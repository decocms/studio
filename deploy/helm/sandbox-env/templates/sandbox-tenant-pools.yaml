{{- range .Values.tenantPools }}
{{- $pool := . }}
{{- if .resources }}
---
# Per-tenant SandboxTemplate. Rendered ONLY when the pool overrides `resources`
# — pod-spec fields can't be per-claim or per-pool, so a tenant that needs its
# own limits needs its own template. Same partial as the shared template, so
# the two cannot drift; only the overridden fields differ.
#
# The pool below points at this template, and Studio reads the pool's
# `spec.sandboxTemplateRef` back off the cluster to build its claims — a claim
# naming a different template than the pod was built from simply never binds,
# so this name is deliberately not a second string anyone has to keep in sync.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: {{ .name }}
  namespace: agent-sandbox-system
  labels:
    {{- include "sandbox-env.sandboxLabels" $ | nindent 4 }}
    studio.decocms.com/tenant-pool: {{ .name }}
{{- include "sandbox-env.sandboxTemplateSpec" (dict "root" $ "pool" $pool) | nindent 0 }}
{{- end }}
---
# Per-tenant warm pool: pods that are already running ONE org's repo + dev
# server, so a member of that org opens a project with no clone, no install,
# no dev-server boot. Studio bootstraps each pod (it holds the kube access and
# the ~1h clone credential — see the provider's tenant-pools.ts) and resolves
# the pool from the claiming user's org, which is the tenant boundary: the
# operator has no notion of a tenant and binds whatever pool a claim names.
#
# `name` must equal the `name` of the matching entry in Studio's
# STUDIO_SANDBOX_TENANT_POOLS. Additive to the generic `warmPool` above — a
# tenant pool does not replace it, and every path still works at size 0.
#
# `sandboxTemplateRef` is the pool's own template when it overrides resources,
# the shared one otherwise. Studio reads this field back rather than being told
# twice.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: {{ .name }}
  namespace: agent-sandbox-system
  labels:
    {{- include "sandbox-env.sandboxLabels" $ | nindent 4 }}
    studio.decocms.com/tenant-pool: {{ .name }}
spec:
  replicas: {{ .size }}
  # Same reasoning as the generic pool — see sandbox-warm-pool.yaml.
  updateStrategy:
    type: OnReplenish
  sandboxTemplateRef:
    name: {{ if .resources }}{{ .name }}{{ else }}{{ include "sandbox-env.sandboxName" $ }}{{ end }}
{{- end }}
