{{- if .Values.warmPool.enabled }}
# Pre-warms N sandbox pods against the shared SandboxTemplate so new claims
# bind instantly rather than waiting on image pull + kubelet start. Disabled
# by default — enable only after measuring cold-start pain; every pool
# replica costs the full sandbox resource request.
#
# Schema (v1alpha1): see sandbox-operator/crds/agent-sandbox-crds.yaml.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: {{ include "sandbox-env.sandboxName" . }}
  namespace: agent-sandbox-system
  labels:
    {{- include "sandbox-env.sandboxLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.warmPool.size }}
  # Pinned, not defaulted: a SandboxTemplate change (an image bump is the
  # common one) must NOT delete the warm pods already running the old
  # template — that turns every routine sync into a pool-wide restart.
  # Stale pods drain by adoption instead, and since a claim's idle TTL is
  # 15m the whole pool is on the new template within minutes anyway.
  # `OnReplenish` is also the operator's own default as of v0.4.5; stating
  # it here is what stops an operator upgrade from silently flipping it.
  updateStrategy:
    type: OnReplenish
  sandboxTemplateRef:
    name: {{ include "sandbox-env.sandboxName" . }}
---
# Same pool for the `-medium` template — a SandboxWarmPool binds exactly one
# SandboxTemplate, so the second template needs its own pool to be prewarmable
# (and its own autoscaler; see sandbox-warmpool-hpa.yaml).
#
# Size 0 by default, and unlike the generic pool that is not a footgun: verified
# against operator v0.4.5, a claim whose pool is empty (or absent) is served by
# a cold pod built from the claim's OWN template, so nothing breaks and nothing
# idles. Prewarming medium claims is then one value (warmPool.mediumSize).
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: {{ include "sandbox-env.sandboxName" . }}-medium
  namespace: agent-sandbox-system
  labels:
    {{- include "sandbox-env.sandboxLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.warmPool.mediumSize | default 0 }}
  updateStrategy:
    type: OnReplenish
  sandboxTemplateRef:
    name: {{ include "sandbox-env.sandboxName" . }}-medium
{{- end }}
