apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sandbox-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox-controller.labels" . | nindent 4 }}
---
# Namespaced. variants.enabled writes templates and pools; claims.enabled adds
# the claim runtime's access (it never reads sandboxes or opens watches).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sandbox-controller.fullname" . }}
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "sandbox-controller.labels" . | nindent 4 }}
rules:
  # The claim runtime reads them too, for GET /images and capacity.
  - apiGroups: ["sandbox.deco.cx"]
    resources: ["sandboxvariants"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.variants.enabled }}
  - apiGroups: ["sandbox.deco.cx"]
    resources: ["sandboxvariants/status"]
    verbs: ["get", "update", "patch"]
  # Setting blockOwnerDeletion on the rendered objects' ownerReference.
  - apiGroups: ["sandbox.deco.cx"]
    resources: ["sandboxvariants/finalizers"]
    verbs: ["update"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- else }}
  # The template probe and the tenant pools' selectors.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get"]
  {{- end }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election records its transitions as events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if .Values.claims.enabled }}
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "create", "delete", "patch"]
  # The newest pod of a handle (OOM verdict), unplaceable pods (capacity),
  # tenant-pool pods and the re-read before one is warmed.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # FailedScheduling and image-pull events for the lifecycle phases.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Server-Side Apply of the daemon port onto the operator's per-Sandbox
  # Service: apply is PATCH on the verb.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]
  # Per-claim HTTPRoutes, upserted by Server-Side Apply.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "create", "delete", "patch"]
  {{- if not .Values.claims.previewUrlPattern }}
  # Without a preview URL pattern the daemon is reached by port-forward.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["get", "create"]
  {{- end }}
  {{- end }}
  {{- if .Values.variants.enabled }}
  {{- with .Values.imagePullSecretNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: ["get"]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sandbox-controller.fullname" . }}
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "sandbox-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sandbox-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sandbox-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
