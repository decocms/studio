apiVersion: v2
name: sandbox-controller
description: |
  The sandbox controller and its SandboxVariant CRD. Reconciles each
  SandboxVariant into the SandboxTemplates and SandboxWarmPools a claim for
  that image variant resolves to, copied from the live default template
  that the sandbox-env chart renders. Requires the sandbox-operator chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.30.0-0"
