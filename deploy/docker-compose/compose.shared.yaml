# App containers only; dependencies must already exist on STUDIO_INFRA_NETWORK.
services:
  postgres:
    profiles: [isolated]
  nats:
    profiles: [isolated]
  minio:
    profiles: [isolated]
  minio-init:
    profiles: [isolated]
  migrate:
    depends_on: !reset {}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set a worktree-specific database URL}
  api:
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set a worktree-specific database URL}
      NATS_URL: ${NATS_URL:?Set the shared NATS endpoint}
      NATS_USER: ${NATS_USER:?Set a worktree-specific NATS account user}
      NATS_PASSWORD: ${NATS_PASSWORD:?Set the NATS account password}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set the shared object storage endpoint}
      S3_BUCKET: ${S3_BUCKET:?Set a worktree-specific bucket}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set scoped object storage credentials}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set scoped object storage credentials}

networks:
  studio-network:
    external: true
    name: ${STUDIO_INFRA_NETWORK:?Set the existing infrastructure network name}
