# Development infrastructure for optional host-side API/web processes.
services:
  postgres:
    extends:
      file: docker-compose.postgres.yml
      service: postgres
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
  nats:
    extends:
      file: docker-compose.postgres.yml
      service: nats
    ports: ["127.0.0.1:${NATS_PORT:-4222}:4222"]
  minio:
    extends:
      file: docker-compose.postgres.yml
      service: minio
    ports: ["127.0.0.1:${MINIO_PORT:-9000}:9000"]
  minio-init:
    extends:
      file: docker-compose.postgres.yml
      service: minio-init
volumes:
  postgres-data:
  nats-data:
  minio-data:
networks:
  studio-network:
