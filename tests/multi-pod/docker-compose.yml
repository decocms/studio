services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    # Alpine variant so the healthcheck can shell out to wget; the scratch-
    # based `nats:2.14.2` ships only the nats-server binary, which is why
    # the resilience suite settled for `nats-server --help` (which passes
    # even when the server isn't serving). The monitoring port `-m 8222`
    # exposes `/healthz` for a real readiness check.
    image: nats:2.14.2-alpine
    command: -js -m 8222
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Mock OpenAI-compatible AI provider. Scenarios that need to drive the
  # decopilot dispatch pipeline (POST /messages → streamText → JetStream
  # pump → /attach tail) point an `openai-compatible` credential at this
  # service via `http://mock-ai:9000/v1`. No external port — only Studio
  # pods talk to it.
  mock-ai:
    build:
      context: ./mock-ai
      dockerfile: Dockerfile
    environment:
      PORT: "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # External S3 (object store). Runs as its OWN container so it survives a
  # Studio pod SIGKILL+restart — the rollout-churn scenario needs pods to reboot
  # cleanly, and Studio's DECOCMS_LOCAL_MODE otherwise spawns an embedded MinIO
  # *child* that dies with the container and races/crashes on reprovision. With
  # S3_ENDPOINT + bucket + creds set below, ensureServices takes the external
  # path (skipMinio) and never manages an embedded instance. Also faithful to
  # prod, which uses external S3. No healthcheck: the minio server image ships
  # no curl/wget/shell to probe with, and Studio's provisionMinioBucket already
  # retries the startup ECONNREFUSED race.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  # Migrations run once before any Studio pod starts. Pods themselves skip the
  # migration step (we override the entrypoint with a direct start command) to
  # avoid races on parallel boot.
  migrate:
    # The only service with a `build:` — it tags the shared image, and every
    # mesh pod (which depends_on migrate completing) reuses the tag instead of
    # rebuilding the same context 4×. Same pattern as the resilience compose.
    build:
      context: ../../
      dockerfile: tests/resilience/Dockerfile.studio
    image: deco-multipod-studio:latest
    working_dir: /app/apps/api
    command: ["bun", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Legacy service identities are part of the resilience-test control contract;
  # Keep the legacy service names stable while the production apps use Studio naming.
  mesh-1: &studio
    image: deco-multipod-studio:latest
    # No restart policy — tests need explicit start/stop control. With
    # `unless-stopped`, `docker kill` is auto-restarted within seconds,
    # which would defeat any pod-death scenario (the SIGKILL'd pod would
    # come back before the assertion fires). A genuine boot crash is
    # surfaced via the healthcheck, not papered over by a restart.
    restart: "no"
    working_dir: /app/apps/api
    # Bypass the Dockerfile entrypoint (which runs `bun run migrate` before
    # exec'ing the CLI) AND pass `--skip-migrations` so the CLI's own boot
    # migration is suppressed too. Without the flag each of the three pods
    # would race on the migration step independently of the `migrate`
    # service. The `migrate` service is the single source of truth for
    # schema state; pods read-only at boot.
    command: ["bun", "run", "src/cli.ts", "--no-tui", "--skip-migrations"]
    environment: &studio-env
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      POD_NAME: mesh-1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      NATS_URL: nats://nats:4222
      BETTER_AUTH_SECRET: test-secret-for-multi-pod-tests
      BETTER_AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      DECOCMS_LOCAL_MODE: "true"
      ENCRYPTION_KEY: test-encryption-key-32chars-long!
      DATA_DIR: /app/data
      # Bound a silent recovered run inside rollout-churn's terminal poll.
      RUN_IDLE_TIMEOUT_MS: "120000"
      # External S3 → ensureServices skips embedded MinIO (survives restarts).
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: studio-dev
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      # Hosted sandbox infrastructure is available. No sandbox is provisioned
      # in these scenarios because the mock AI never emits sandbox tool calls.
      STUDIO_AGENT_SANDBOX_ENABLED: "true"
    ports:
      - "127.0.0.1:13001:3000"
    # POD_NAME makes `run_owner_pod` match the compose service name
    # (the first service), so scenarios that need to identify the dispatch owner
    # (e.g. pod-death-dbos-replay) can map straight from a thread row
    # to a docker compose target without an extra UUID-to-service hop.
    # Studio defaults this to a random UUID when unset.
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:3000/health/live'); if(!r.ok) process.exit(1)\""]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20

  # Each additional Studio service waits for the previous pod to be healthy
  # before starting. This serializes *first-boot* DBOS migrations: even with
  # Studio's own --skip-migrations, DBOS still runs its system-schema
  # migrations on `DBOS.launch()` and three parallel boots race on
  # inserts into `dbos.dbos_migrations` (unique-constraint violations
  # crash pods 2/3). Once the schema exists, subsequent boots are
  # idempotent — restarting a single pod mid-test stays fast.
  mesh-2:
    <<: *studio
    environment:
      <<: *studio-env
      POD_NAME: mesh-2
    ports:
      - "127.0.0.1:13002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      mesh-1:
        condition: service_healthy

  mesh-3:
    <<: *studio
    environment:
      <<: *studio-env
      POD_NAME: mesh-3
    ports:
      - "127.0.0.1:13003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      mesh-2:
        condition: service_healthy
