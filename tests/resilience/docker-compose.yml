services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    # Keep the healthcheck independent of shell utilities: the default NATS
    # image is distroless, and even Alpine tags should not be required just for
    # `up --wait`.
    image: nats:2.14.2
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats-config/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-config", "/config/toxiproxy.json", "-host=0.0.0.0"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:18474:8474"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  everything-server:
    build:
      context: ./everything-server
      dockerfile: Dockerfile
    environment:
      PORT: "3002"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:3002/mcp').catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  studio:
    build:
      context: ../../
      dockerfile: tests/resilience/Dockerfile.studio
    image: deco-resilience-studio:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@toxiproxy:5433/postgres
      NATS_URL: nats://toxiproxy:4223
      BETTER_AUTH_SECRET: test-secret-for-resilience-tests
      BETTER_AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      DECOCMS_LOCAL_MODE: "true"
      STUDIO_AGENT_SANDBOX_ENABLED: "false"
      STUDIO_SANDBOX_PROVIDER: user-desktop # rollback compatibility only
      ENCRYPTION_KEY: test-encryption-key-32chars-long!
      # org-fs mounts can't work in these containers (no FUSE / rclone mount
      # fails), and this suite exercises tunnel/WS resilience, not org-fs. With
      # mounts enabled the daemon's first quick file op blocks on the 10s
      # FIRST_MOUNT_WAIT_MS grace (entry.ts), which collides with the studio
      # proxy's 10s QUICK_FILE_OP_TIMEOUT_MS (sandbox-proxy.ts) and 502s the very
      # first write/read even on a healthy link. Disable so the daemon never
      # expects org-fs (skips the wait) — see DISABLE_ORGFS_MOUNTS in start.ts.
      DISABLE_ORGFS_MOUNTS: "true"
      DATA_DIR: /app/data
      NATS_PUBLIC_URL: ws://toxiproxy:3010
      NATS_ACCOUNT_JWT: eyJ0eXAiOiJKV1QiLCJhbGciOiJlZDI1NTE5LW5rZXkifQ..KXYXjyj7WzyxCOyz90dIYV_Rq8fGaIUxTP1RhGsV9mpyPZk0Pj30HvRLGilGxz6E75M0IBZkQ7vmFTKFsgeWBA
      NATS_ACCOUNT_SIGNING_KEY: SAAD4LKQUA2MPS5AOHTWV2ELQILVCQXRMMLMWQSJFFRF2MIT3S7ANO4SRM
      NATS_CREDS: /nats-creds/cluster.creds
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      toxiproxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r = await fetch('http://localhost:3000/health/live'); if(!r.ok) process.exit(1)\"",
        ]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    volumes:
      - ./nats-config/cluster.creds:/nats-creds/cluster.creds:ro
