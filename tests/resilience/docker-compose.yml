services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    # Keep the healthcheck independent of shell utilities: the default NATS
    # image is distroless, and even Alpine tags should not be required just for
    # container readiness checks.
    image: nats:2.14.2
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats-config/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-config", "/config/toxiproxy.json", "-host=0.0.0.0"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:18474:8474"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  everything-server:
    build:
      context: ./everything-server
      dockerfile: Dockerfile
    environment:
      PORT: "3002"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:3002/mcp').catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 minioadmin minioadmin && mc ready local; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 30 ] || exit 1
          sleep 1
        done
        mc mb --ignore-existing local/studio-dev
    depends_on:
      minio:
        condition: service_started

  migrate:
    build:
      context: ../../
      dockerfile: tests/resilience/Dockerfile.studio
    image: deco-resilience-studio:latest
    command: ["sh", "-ec", "bun run migrate && bun run migrate:dbos"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy

  studio:
    image: deco-resilience-studio:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@toxiproxy:5433/postgres
      NATS_URL: nats://toxiproxy:4223
      BETTER_AUTH_SECRET: test-secret-for-resilience-tests
      BETTER_AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      DECOCMS_LOCAL_MODE: "true"
      STUDIO_AGENT_SANDBOX_ENABLED: "false"
      ENCRYPTION_KEY: test-encryption-key-32chars-long!
      # org-fs mounts can't work in these containers (no FUSE / rclone mount
      # fails), and this suite exercises API/NATS resilience, not org-fs. With
      # mounts enabled the daemon's first quick file op blocks on the 10s
      # FIRST_MOUNT_WAIT_MS grace (entry.ts), which collides with the studio
      # proxy's 10s QUICK_FILE_OP_TIMEOUT_MS (sandbox-proxy.ts) and 502s the very
      # first write/read even on a healthy sandbox. Disable so the daemon never
      # expects org-fs (skips the wait) — see DISABLE_ORGFS_MOUNTS in start.ts.
      DISABLE_ORGFS_MOUNTS: "true"
      DATA_DIR: /app/data
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: studio-dev
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      toxiproxy:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r = await fetch('http://localhost:3000/health/live'); if(!r.ok) process.exit(1)\"",
        ]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
