<!DOCTYPE html>
<html>
  <head>
    <meta name="theme-color" content="#f6f4ed" />
    <script>
      // Reload once on modulepreload 404 (rolling deployment — old pod missing new chunk).
      // Shares the cooldown key with ChunkErrorBoundary to prevent double-reload loops.
      window.addEventListener('vite:preloadError', function() {
        var key = '__studio_chunk_reload_ts';
        var last = sessionStorage.getItem(key);
        var now = Date.now();
        if (!last || now - Number(last) > 10000) {
          sessionStorage.setItem(key, String(now));
          location.reload();
        }
      });
    </script>
    <script>
      // Apply dark mode class before first paint to prevent flash
      (function() {
        try {
          var p = JSON.parse(
            localStorage.getItem("studio:user:preferences") ||
              localStorage.getItem("mesh:user:preferences") ||
              "{}",
          );
          var theme = p.theme || "system";
          var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
            // Also pre-set <meta name="theme-color"> so the PWA title-bar (WCO)
            // doesn't flash light before the React runtime syncs it from --sidebar.
            // Value approximates dark --sidebar: oklch(0.155 0.005 60).
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#272524");
          }
        } catch(e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>deco Studio</title>
    <meta name="description" content="Hire specialized agents, give them access to your tools, and let them deliver real projects — with planning, verification, and observability built in." />
    <meta property="og:title" content="deco Studio" />
    <meta property="og:description" content="Hire specialized agents, give them access to your tools, and let them deliver real projects — with planning, verification, and observability built in." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="deco Studio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="deco Studio" />
    <meta name="twitter:description" content="Hire specialized agents, give them access to your tools, and let them deliver real projects — with planning, verification, and observability built in." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA install. The manifest + apple-touch-icon below are the "deco
         Studio" defaults and stay active on every route, so the browser's own
         "Add to Home Screen" installs Studio itself. The per-org install page
         (/:org/install) temporarily swaps these for org-branded values via
         usePwaManifest, so installing from there produces a separate app for
         that org, then restores the defaults on leaving the page. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="deco Studio" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
