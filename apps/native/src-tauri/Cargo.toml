[package]
name = "deco"
version.workspace = true
description = "Studio desktop shell — Tauri v2 app embedding the local-api Rust core in-process"
authors = ["decocms"]
license.workspace = true
repository = "https://github.com/decocms/studio"
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "decocms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
rcgen = { workspace = true }
time = { workspace = true }
# In-process local-api embedding (Phase 3 — see the desktop migration contract's "in-process axum,
# no sidecar" decision and the native implementation contract §5). Path dep, not a version to
# keep in sync.
local-api = { path = "../crates/local-api" }
# OAuth PKCE loopback + Keychain session (auth_status/auth_login/
# auth_logout delegate to `upstream::global()` — see `src/auth.rs`). Path
# dep, not a version to keep in sync.
upstream = { path = "../crates/upstream" }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
urlencoding = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri-plugin-mcp-bridge = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true }
# Single-consumer deps for the updater's version-pairing check (inspecting
# the downloaded .app.tar.gz's Info.plist before install — see
# src/updater.rs::bundle_short_version). Declared here, not in the workspace
# table, per the "single-consumer dep stays local" precedent
# crates/harness/Cargo.toml set for portable-pty.
flate2 = "1"
tar = "0.4"
plist = "1"

# `PlatformWebview::inner()` hands back a `webkit2gtk::WebView`, so this crate
# and tauri's must resolve to the SAME webkit2gtk or the types stop unifying.
# `=2.0.2` matches wry 0.55.1's own exact pin (tauri itself asks for a loose
# "2"), which is what pins the graph today — stating it here makes a tauri
# upgrade that moves it a build error instead of a type mismatch, and adds no
# new transitive version to Cargo.lock.
#
# `v2_6` is the exact gate on the two APIs src/webview_trust.rs calls
# (web_context.rs:217 `allow_tls_certificate_for_host`, web_view.rs:2352
# `connect_load_failed_with_tls_errors`). It changes nothing about the build:
# tauri already enables `webkit2gtk/v2_40`, and features unify, so the
# pkg-config webkit floor webkit2gtk-sys derives is 2.40 either way. Asking for
# only what is used keeps that fact tauri's to own rather than ours.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_6"] }

[dev-dependencies]
tempfile = { workspace = true }
