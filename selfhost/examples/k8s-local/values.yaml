# Wiring for the local umbrella. Install with release name `deco-studio` so the
# Studio subchart's derived names (Service, ServiceAccount, NATS, instance label)
# all resolve to `deco-studio` and match the references below.

# ── Studio app (chart-deco-studio subchart) ────────────────────────────────
chart-deco-studio:
  # Dedicated SA (named after the release → "deco-studio"); REQUIRED so the
  # sandbox RBAC (granted to "deco-studio") matches the pod's identity.
  serviceAccount:
    create: true

  # Generic port-80 route: browsers resolve *.localhost → 127.0.0.1, servicelb
  # forwards :80 to Studio, and sandbox previews (<handle>.preview.localhost)
  # route the same way. No ingress / /etc/hosts.
  service:
    type: LoadBalancer
    port: 80

  # External deps = the throwaway Postgres/MinIO from this umbrella's templates.
  database:
    url: "postgresql://studio:studio@studio-db:5432/studio"

  secret:
    # Fixed dev values so `helm install` needs zero pre-steps. LOCAL ONLY — for
    # anything reachable by others, generate real ones (openssl rand -base64 32)
    # and pass via --set or an ExternalSecret. Both must stay stable across
    # restarts: BETTER_AUTH_SECRET signs sessions, ENCRYPTION_KEY is the vault key.
    BETTER_AUTH_SECRET: "local-dev-better-auth-secret-change-me"
    ENCRYPTION_KEY: "local-dev-encryption-key-change-me"

  configMap:
    # Legacy chart values key retained for upgrade compatibility.
    meshConfig:
      BASE_URL: "http://studio.localhost"
      BETTER_AUTH_URL: "http://studio.localhost"
      # Object storage → the bundled MinIO.
      S3_ENDPOINT: "http://studio-minio:9000"
      S3_BUCKET: "studio"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      S3_FORCE_PATH_STYLE: "true"
      # Sandbox: server-side (agent-sandbox), wired to sandbox-env's template.
      STUDIO_AGENT_SANDBOX_ENABLED: "true"
      STUDIO_SANDBOX_PROVIDER: "agent-sandbox" # rollback compatibility
      STUDIO_ENV: "local"
      STUDIO_SANDBOX_TEMPLATE_NAME: "studio-sandbox-local"
      # Shared sentinel token — MUST equal sandbox-env.sentinel.token below.
      # Its presence flips Studio into warm-pool mode: claims are created with
      # `warmpool: "default"` + empty env and the daemon token is rotated
      # post-bind. Without it Studio cold-provisions (`warmpool: "none"`) and
      # injects DAEMON_TOKEN via claim env, which the SandboxTemplate rejects
      # ("environment variable override is not allowed ... DAEMON_TOKEN") →
      # claim never goes Ready → the sandbox never connects. LOCAL fixed value.
      STUDIO_SANDBOX_SENTINEL_TOKEN: "local-dev-sandbox-sentinel-token-change-me"
      # Preview a site running in a sandbox at <handle>.preview.localhost.
      STUDIO_SANDBOX_PREVIEW_URL_PATTERN: "http://{handle}.preview.localhost"

  # Laptop-sized — everything trimmed small; this is local, not prod.
  persistence:
    storageClass: ""
    size: 2Gi
  # API pods (two Bun processes behind nginx). Requests are just scheduling
  # floors here; limits leave headroom so they don't OOM under a real request.
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { memory: "512Mi" }
  worker:
    replicaCount: 1
    autoscaling: { enabled: false }
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { memory: "512Mi" }
  nginx:
    resources:
      requests: { cpu: "25m", memory: "32Mi" }
      limits: { memory: "64Mi" }
  nats:
    config:
      jetstream:
        # Kept light — local clusters are small, and RAM is the scarce resource.
        # Memory store stays tiny; disk-backed streams get a modest 2Gi. The
        # Decopilot late-join stream may still not fit on a tiny cluster
        # ("insufficient storage resources" → late-join disabled) — that's
        # NON-FATAL: the UI, agents, and sandbox all work without it. Bump
        # memoryStore only if you specifically need Decopilot message replay.
        memoryStore:
          maxSize: 256Mi
        fileStore:
          pvc:
            size: 2Gi
            storageClassName: ""
  topologySpreadConstraints: []

# ── Sandbox env (sandbox-env subchart) ─────────────────────────────────────
sandbox-env:
  envName: "local"
  # Shared warm-pool sentinel token — MUST equal STUDIO_SANDBOX_SENTINEL_TOKEN
  # in the legacy Studio meshConfig key above. An explicit value lets both
  # charts agree without extracting the auto-generated Secret. LOCAL fixed value.
  sentinel:
    token: "local-dev-sandbox-sentinel-token-change-me"
  mesh:
    # Legacy sandbox-env values key retained for upgrade compatibility.
    namespace: "deco-studio"          # where Studio (and its SA) runs
    serviceAccountName: "deco-studio"  # must equal the Studio SA above
    podSelectorLabels:
      app.kubernetes.io/name: "chart-deco-studio"
      app.kubernetes.io/instance: "deco-studio"   # = the release name
  # First multi-arch studio-sandbox tag (arm64 + amd64).
  image:
    tag: "1.17.3"
  # Local: previews via Studio's in-process proxy (no Gateway API / cert-manager).
  previewGateway:
    enabled: false
  # Pre-warmed sandbox pool ON — one pod, zero cold-start on the first sandbox.
  # Safe now that studio-sandbox 1.17.3 is multi-arch (runs on arm64). Turn off
  # with --set sandbox-env.warmPool.enabled=false to save laptop resources.
  warmPool:
    enabled: true
    size: 1

# ── Sandbox operator (sandbox-operator subchart) ───────────────────────────
sandbox-operator:
  # This umbrella's release namespace is deco-studio, but every operator
  # resource is pinned to agent-sandbox-system explicitly — so allow the split.
  allowForeignNamespace: true
