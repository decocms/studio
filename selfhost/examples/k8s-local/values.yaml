# Wiring for the local umbrella. Install with release name `deco-studio` so the
# subcharts' derived names (Studio Service, NATS, the controller's
# `deco-studio-sandbox-controller` Service) match the references below.

# ── Studio app (chart-deco-studio subchart) ────────────────────────────────
chart-deco-studio:
  # Generic port-80 route: browsers resolve *.localhost → 127.0.0.1, servicelb
  # forwards :80 to Studio, and sandbox previews (<handle>.preview.localhost)
  # route the same way. No ingress / /etc/hosts.
  service:
    type: LoadBalancer
    port: 80

  # External deps = the throwaway Postgres/MinIO from this umbrella's templates.
  database:
    url: "postgresql://studio:studio@studio-db:5432/studio"

  secret:
    # Fixed dev values so `helm install` needs zero pre-steps. LOCAL ONLY — for
    # anything reachable by others, generate real ones (openssl rand -base64 32)
    # and pass via --set or an ExternalSecret. Both must stay stable across
    # restarts: BETTER_AUTH_SECRET signs sessions, ENCRYPTION_KEY is the vault key.
    BETTER_AUTH_SECRET: "local-dev-better-auth-secret-change-me"
    ENCRYPTION_KEY: "local-dev-encryption-key-change-me"

  configMap:
    # Legacy chart values key retained for upgrade compatibility.
    meshConfig:
      BASE_URL: "http://studio.localhost"
      BETTER_AUTH_URL: "http://studio.localhost"
      # Object storage → the bundled MinIO.
      S3_ENDPOINT: "http://studio-minio:9000"
      S3_BUCKET: "studio"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      S3_FORCE_PATH_STYLE: "true"
      # Hosted sandboxes, through the sandbox controller below.
      STUDIO_AGENT_SANDBOX_ENABLED: "true"
      STUDIO_ENV: "local"
      # Studio's in-process preview proxy serves <handle>.preview.localhost
      # (no Gateway locally). Same pattern as the controller's.
      STUDIO_SANDBOX_PREVIEW_URL_PATTERN: "http://{handle}.preview.localhost"

  # The controller's claim API, over the mTLS pair that
  # templates/sandbox-controller-tls.yaml generates.
  sandboxController:
    enabled: true
    url: "https://deco-studio-sandbox-controller.deco-studio.svc:8443"
    tlsSecretName: studio-sandbox-controller-client

  # Laptop-sized — everything trimmed small; this is local, not prod.
  persistence:
    storageClass: ""
    size: 2Gi
  # API pods (two Bun processes behind nginx). Requests are just scheduling
  # floors here; limits leave headroom so they don't OOM under a real request.
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { memory: "512Mi" }
  worker:
    replicaCount: 1
    autoscaling: { enabled: false }
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { memory: "512Mi" }
  nginx:
    resources:
      requests: { cpu: "25m", memory: "32Mi" }
      limits: { memory: "64Mi" }
  nats:
    config:
      jetstream:
        # Kept light — local clusters are small, and RAM is the scarce resource.
        # Memory store stays tiny; disk-backed streams get a modest 2Gi. The
        # Decopilot late-join stream may still not fit on a tiny cluster
        # ("insufficient storage resources" → late-join disabled) — that's
        # NON-FATAL: the UI, agents, and sandbox all work without it. Bump
        # memoryStore only if you specifically need Decopilot message replay.
        memoryStore:
          maxSize: 256Mi
        fileStore:
          pvc:
            size: 2Gi
            storageClassName: ""
  topologySpreadConstraints: []

# ── Sandbox env (sandbox-env subchart) ─────────────────────────────────────
sandbox-env:
  envName: "local"
  # Shared warm-pool sentinel token — MUST equal the `daemonToken` of the
  # controller's sentinel Secret (templates/sandbox-controller-tls.yaml). An
  # explicit value lets both agree without extracting the generated Secret,
  # which lives in agent-sandbox-system while the controller runs in
  # deco-studio. LOCAL fixed value.
  sentinel:
    token: "local-dev-sandbox-sentinel-token-change-me"
  # Local: previews via Studio's in-process proxy (no Gateway API / cert-manager).
  previewGateway:
    enabled: false
  # Pre-warmed sandbox pool ON — one pod, zero cold-start on the first sandbox.
  # Turn off with --set sandbox-env.warmPool.enabled=false to save laptop
  # resources.
  warmPool:
    enabled: true
    size: 1

# ── Sandbox controller (sandbox-controller subchart) ───────────────────────
# Its image tag defaults to the chart's appVersion; a tag that is not yet
# published has to be built locally from packages/sandbox (see the README).
sandbox-controller:
  claims:
    enabled: true
    # The controller's leaf; its ca.crt also verifies Studio both ways.
    tlsSecretName: sandbox-controller-tls
    clientCASecretName: sandbox-controller-tls
    studioCASecretName: sandbox-controller-tls
    # Studio's `sandbox-callbacks` Service port (sandboxController.callbackPort).
    studioCallbackUrl: "https://deco-studio.deco-studio.svc:9443"
    # The controller owns sandbox_runner_state in Studio's database.
    database:
      secretName: sandbox-controller-db
    # Warm-pool mode: the pool pods' shared token (sandbox-env.sentinel.token).
    sentinel:
      secretName: sandbox-controller-sentinel
    sandboxTemplate: studio-sandbox-local
    envName: local
    # Set, the controller and Studio reach daemons by Service DNS; this is also
    # the preview URL Studio hands the browser.
    previewUrlPattern: "http://{handle}.preview.localhost"
    studio:
      namespace: deco-studio

# ── Sandbox operator (sandbox-operator subchart) ───────────────────────────
sandbox-operator:
  # This umbrella's release namespace is deco-studio, but every operator
  # resource is pinned to agent-sandbox-system explicitly — so allow the split.
  allowForeignNamespace: true
