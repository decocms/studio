<script id="src" type="text/plain"># Sandbox: today vs. target

Diagrams for `sandbox-controller-spec.md` (OSS) and
`control-plane-variants-spec.md` (closed, a feature of `decocms/control-plane`). Dashed lines are background or
asynchronous paths.

## 1. Components — today

```mermaid
flowchart LR
  browser["Browser"]

  subgraph studio_ns["Studio namespace"]
    api["Studio API<br/>AgentSandboxProvider in-process<br/>runner · client · lifecycle-watcher<br/>tenant-pools · capacity · credential-refresh"]
    pg[("Postgres<br/>sandbox_runner_state<br/>repositories.sandbox_image")]
  end

  subgraph cluster["Sandbox cluster"]
    kapi["kube-apiserver"]
    op["agent-sandbox operator"]
    hk["housekeeper CronJob<br/>own SA"]
    gw["preview gateway"]
    subgraph objs["CRs"]
      tpl["SandboxTemplate<br/>default + imageVariants"]
      pool["SandboxWarmPool<br/>default · tenant · variant size 0"]
      claim["SandboxClaim"]
      route["HTTPRoute per claim"]
    end
    pod["sandbox pod<br/>Go daemon :9000"]
  end

  chart["sandbox-env chart<br/>values in deco-apps-cd"]

  browser -->|chat, tools| api
  api <--> pg
  api -->|"Studio SA: claims, routes,<br/>pods get/list, portforward"| kapi
  api -->|"port-forward via apiserver<br/>/_sandbox/config, dispatch, fs"| pod
  kapi --- claim & route
  chart -->|helm / argo| tpl & pool
  op -->|reconciles| claim
  claim -->|from template or pool| pod
  hk -.->|idle sweep, orphan GC| claim & route
  browser -->|preview| gw --> route --> pod
```

## 2. Components — target

```mermaid
flowchart LR
  browser["Browser"]

  subgraph studio_ns["Studio namespace — OSS"]
    api["Studio API<br/>RemoteSandboxProvider ~200 lines<br/>no kubeconfig, no Role"]
    pg[("Postgres")]
  end

  subgraph cluster["Sandbox cluster"]
    ctl["sandbox controller — OSS, Go<br/>claims · SandboxVariant reconciler<br/>runtimes: agent-sandbox · docker"]
    agent["data-plane agent — CLOSED<br/>decocms/operator cmd/agent<br/>group: sandbox.deco.cx only"]
    kapi["kube-apiserver"]
    op["agent-sandbox operator"]
    hk["housekeeper CronJob"]
    gw["preview gateway"]
    subgraph objs["CRs"]
      tplD["default template + pools<br/>managed-by=Helm"]
      sv["SandboxVariant<br/>written by chart, kubectl or agent"]
      tplV["variant templates + pools<br/>rendered by the controller<br/>ownerReference → SandboxVariant"]
      claim["SandboxClaim + HTTPRoute"]
    end
    pod["sandbox pod<br/>Go daemon :9000"]
  end

  cp["decocms/control-plane — CLOSED<br/>variants feature: desired rows per cluster<br/>API · MCP · console"]
  chart["sandbox-env chart<br/>imageVariants → SandboxVariant"]
  ci["infra_applications CI"]

  browser -->|chat, tools| api
  api -->|"mTLS: ensure, alive, delete,<br/>lifetime, events, images, capacity"| ctl
  ctl -.->|"mTLS callback: clone-url"| api
  ctl -->|"owns sandbox_runner_state"| pg
  api -->|"repositories, threads"| pg
  api -->|"direct, Service DNS + per-claim bearer<br/>dispatch, fs"| pod
  ctl -->|"/_sandbox/config + token rotation"| pod
  ctl -->|claims, routes| kapi
  kapi --- claim
  ctl -.->|watches| sv
  ctl -.->|reads| tplD
  ctl -->|"render: SSA, force"| tplV
  chart --> tplD
  chart --> sv
  ci -->|"TAG_SET, service token"| cp
  cp -->|desired state| agent
  agent -->|apply| sv
  op --> claim --> pod
  hk -.-> claim
  browser -->|preview| gw --> pod
```

The controller and the control plane never call each other. They meet in
`SandboxVariant` objects.

```mermaid
flowchart TB

    direction LR
    s["Studio API"] --- c["sandbox controller"] --- d["daemon + base image"] --- h["sandbox-env chart"]
    k1[["contract 1: controller HTTP API"]]
    k2[["contract 2: SandboxVariant CRD<br/>schema + reconciler"]]
  end
  subgraph closed["deco only — closed"]
    direction LR
    p["decocms/control-plane<br/>variants feature"] --- i["infra_applications<br/>variant Dockerfiles + CI"]

  c -. implements .-> k1

Self-hosted = the top box only. deco = both boxes.

## 4. Starting a sandbox — today

```mermaid
sequenceDiagram
  autonumber
  participant T as SANDBOX_START tool
  participant R as AgentSandboxProvider (in Studio)
  participant DB as Postgres
  participant K as kube-apiserver
  participant O as operator
  participant P as daemon pod

  T->>R: ensure(id, opts{sandboxImage})
  R->>DB: read sandbox_runner_state
  R->>K: probe template BASE-VARIANT[-medium] (TTL cache)
  alt variant missing
    R-->>R: degrade to base template, log warning
  end
  R->>K: create SandboxClaim (named = handle)
  O->>P: bind warm pod or boot from template
  R->>K: watch claim until ready
  R->>K: open port-forward
  R->>P: POST /_sandbox/config + rotateToken (sentinel to per-claim)
  R->>K: SSA HTTPRoute + Service port
  R->>DB: write row
  R-->>T: handle, previewUrl
  Note over T,P: later: every daemon call goes through a port-forward
```

## 5. Starting a sandbox — target

```mermaid
sequenceDiagram
  autonumber
  participant T as SANDBOX_START tool
  participant S as RemoteSandboxProvider (Studio)
  participant C as sandbox controller
  participant DB as Postgres
  participant K as kube-apiserver
  participant O as operator
  participant P as daemon pod

  T->>S: ensure(id, opts{sandboxImage})
  S->>C: POST /sandboxes {id, opts, runtime?, requires?} (mTLS)
  C->>DB: read row (runtime is fixed once placed)
  C->>C: place: available, capable, has capacity (variant nodes), serves image
  alt no runtime qualifies
    C-->>S: 503 + per-runtime reasons
    S-->>T: park
  end
  C->>K: template from informer cache: BASE-VARIANT[-medium] or default
  C->>K: create SandboxClaim
  O->>P: bind or boot
  C->>P: POST /_sandbox/config + rotateToken (daemon-go/pkg/protocol)
  C->>K: SSA HTTPRoute + Service port (force: true)
  C->>DB: write row {runtime, image served, writer}
  C-->>S: handle, previewUrl, daemon{url, token}, image{requested, served}, capabilities
  S-->>T: handle, previewUrl
  T->>P: dispatch / fs over Service DNS, bearer
  opt 401
    S->>C: GET /sandboxes/:handle (fresh token)
  end
```

## 6. Shipping a variant — today

```mermaid
flowchart LR
  pr["PR to studio<br/>packages/sandbox/image-android/"] --> rel["studio release workflow<br/>build base + build-push-android"]
  rel --> ghcr[("ghcr<br/>studio-sandbox-go<br/>studio-sandbox-android")]
  rel -->|"needs: build-push-android"| bump["deco-apps-cd values bump<br/>per env: imageVariants.android.tag"]
  bump --> argo["ArgoCD sync<br/>sandbox-env chart"] --> tpl["variant templates + pools"]
  studiopr["Studio PR + deploy<br/>if detection / UI changes"] -.-> tpl
```

Every variant change goes through a studio release and a values PR in each
environment.

## 7. Shipping a variant — target on deco clusters

```mermaid
sequenceDiagram
  autonumber
  participant SR as studio release
  participant IA as infra_applications CI
  participant G as ghcr
  participant CP as decocms/control-plane
  participant A as data-plane agent
  participant SV as SandboxVariant
  participant C as controller

  SR->>G: push studio-sandbox-go:BASE_TAG
  SR->>IA: repository_dispatch sandbox-base-released {version}
  IA->>G: build studio-sandbox-VARIANT:BASE_TAG, smoke.sh, sign, attest
  IA->>CP: SANDBOX_VARIANT_TAG_SET (staging clusters)
  CP->>A: desired state changed
  A->>SV: SSA apply (managed-by=deco-data-plane-agent)
  SV-->>C: watch event
  C->>G: HEAD repository:tag
  alt tag missing
    C->>SV: ImageAvailable=False, keep previous render
  else tag present
    C->>C: render 2 templates + 2 pools from the live default template
    C->>SV: Ready=True, defaultTemplateTag
  end
  SV-->>A: status
  A-->>CP: status shown in the console
  IA->>CP: same for prod, after manual approval
```

Self-hosters use the same shape without the closed half: build an image
`FROM` the base, add an `imageVariants` entry (the chart writes the
`SandboxVariant`), run `helm upgrade`.

## 8. Handing `android` from the chart to the control plane

```mermaid
stateDiagram-v2
  direction LR
  [*] --> ChartTemplates: today: chart renders android templates
  ChartTemplates --> Kept: chart N: templates get resource-policy keep
  Kept --> HelmVariant: chart N+1: SandboxVariant android,<br/>controller adopts the templates (ownerReference)
  HelmVariant --> KeptVariant: deco values: imageVariants.android.keep true
  KeptVariant --> AgentOwned: SANDBOX_VARIANT_ADOPT, identical spec,<br/>agent relabels managed-by
  AgentOwned --> AgentOwned: deco values imageVariants empty,<br/>Helm leaves the kept object, templates survive
  AgentOwned --> [*]: TAG_SET from CI · remove image-android/
```

## 9. Rollout

```mermaid
flowchart TB
  done["DONE: #7461 per-repo image · #7469 Flutter off base"]

  subgraph P1["Phase 1 — controller in prod, variants only (OSS)"]
    p1["controller-go, variants only, final module path"] --> p2["SandboxVariant CRD + reconciler"]
    p2 --> p3["controller chart + image, claim API off"]
    p3 --> p4["chart N: keep · chart N+1: imageVariants → SandboxVariant"]
    p5["detection on REPOSITORY_LINK"]
    p6["release: sandbox-base-released dispatch"]
  end

  subgraph P2["Phase 2 — deco variants via control plane (closed)"]
    c1["infra_applications CI"] --> c3["handover per cluster"]
    c2["control-plane variants feature"] --> c3
    c3 --> c4["delete image-android/"]
  end

  subgraph P3["Phase 3 — controller takes claims (OSS)"]
    b6["claim path: port #6187 against main,<br/>pkg/protocol, RemoteSandboxProvider"] --> b10
    b7["docker runtime"] --> b10["staging → drained prod cutover<br/>same PR deletes in-process runner,<br/>client-node, Studio Role"]
    b8["tenant pools in Go"] --> b10
    b9["claim API on, GET /images"] --> b10
  end

  done --> P1
  p4 --> P2
  p3 --> P3
```
